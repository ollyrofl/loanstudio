    function buildPrintSections() {
      return orderedSections()
        .filter((section) => sectionIsVisible(section))
        .filter((section) => !(securityNestedMode() && section.nestedUnder === "security"))
        .map((section) => {
          const rows = printRowsForSection(section);
          return { heading: sectionDisplayTitle(section).toUpperCase(), rows };
        })
        .filter((section) => section.rows.length || (section.heading === "LOAN" && (state.fundingPositionImage || state.fundingPositionPdf)));
    }

    function printRowsForSection(section, prefix = "") {
      const rows = [];
      if (section.id === "security" && checkboxHasValue("fhogRequired", "FHOG")) {
        rows.push(prefixPrintRow({ key: "FHOG", value: yesWithDetails(state.fhog) }, prefix));
      }
      section.fields.forEach((field) => {
        const row = printRowForField(field);
        if (Array.isArray(row)) rows.push(...row.map((item) => prefixPrintRow(item, prefix)));
        else if (row) rows.push(prefixPrintRow(row, prefix));
      });
      if (section.id === "clients" && state.preferredContact) {
        const row = prefixPrintRow({ key: "Preferred Contact", value: state.preferredContact }, prefix);
        const applicantIndex = rows.findIndex((item) => item.key === (prefix ? `${prefix} - Applicants` : "Applicants"));
        if (applicantIndex >= 0) rows.splice(applicantIndex + 1, 0, row);
        else rows.push(row);
      }
      return rows;
    }

    function prefixPrintRow(row, prefix) {
      if (!prefix || row.type === "note" || !row.key) return row;
      return { ...row, key: `${prefix} - ${row.key}` };
    }

    function printRowForField(field) {
      if (state.fundingPositionImage && ["loanStructure", "loanAmount", "loanSecurityValue", "baseLvr", "postCapLvr", "lmi", "clientContribution", "genuineSavings"].includes(field.id)) return null;
      if (field.id === "fundingPositionPreview") return null;
      if (securityPreApprovalSelected() && field.id === "securityAddress") return null;
      if (!conditionalMatches(field)) return null;
      const value = valueFor(field);
      if (!value || isNAValue(value)) return null;

      if (field.id === "loanStructure") return printRowsForLoans();
      if (field.id === "clientNames") return { key: "Applicants", type: "applicants", clients: state.clients };
      if (field.id === "purpose") {
        const purposes = selectedPurposes();
        if (purposes.length <= 1) return { key: "Purpose", value };
        return purposes.map((purpose, index) => ({ key: `Loan ${index + 1} Purpose`, value: purpose }));
      }
      if (field.id === "dependants") return { key: "Dependants", value: `Yes${state.dependantsDetails ? `, ${state.dependantsDetails}` : ""}` };
      if (field.id === "dependantsDetails") return null;
      if (field.id === "lenderProductPair") {
        return [
          state.lender ? { key: "Lender", value: state.lender } : null,
          state.product ? { key: "Product", value: state.product } : null
        ].filter(Boolean);
      }
      if (field.id === "securityPreApproval") return { key: "Pre-Approval", value: "Yes" };
      if (field.id === "clientIncome") return { key: "Income", value: formatIncomeNotesValue(), type: "income" };
      if (["brokerEngineLink", "quickliLink"].includes(field.id)) {
        return { key: field.label, value, type: "link" };
      }
      if (field.id === "shortSettlementNote") return { valueHtml: settlementAcknowledgementHtml(value), type: "note" };
      if (field.id === "liabilities") return { key: "Liabilities", value };
      if (field.id === "securities") {
        return (state.securities || []).map((security, index) => ({ key: index === 0 ? "Securities" : "", type: "securities", securities: [security], startIndex: index }));
      }
      if (field.id === "otherLendersComparisonCompleted") return { key: "Broker Engine Product Comparison", value: "Completed" };
      if (field.id === "otherLenders") {
        if (checkboxHasValue("otherLendersComparisonCompleted", "Completed in Broker Engine Product Comparison")) return null;
        return { key: "Other Lenders Considered", type: "otherLenders", lenders: state.otherLenders };
      }
      if (field.id === "fhogRequired") return { key: "FHOG", value: yesWithDetails(state.fhog) };
      if (field.id === "fhog") return null;
      if (field.id === "clientContribution") return { key: "Applicant Contribution", value };
      if (field.id === "genuineSavings") return { key: "Genuine Savings", value: state.genuineSavingsNotes ? `In OneDrive - ${state.genuineSavingsNotes}` : "In OneDrive" };
      if (field.id === "genuineSavingsNotes") return null;
      if (field.id === "cashback") return { key: "Cashback", value: state.cashbackNotes ? yesWithDetails(state.cashbackNotes) : "Yes" };
      if (field.id === "cashbackNotes") return null;
      if (field.id === "depositScheme") return { key: "5% Deposit Scheme", value: "Yes" };
      if (field.id === "hecsDebtRequired") return { key: "HECS Debt", value: yesWithDetails(state.hecsDebt) };
      if (field.id === "hecsDebt") return null;
      if (field.id === "exitStrategyRequired") return { key: "Exit Strategy Required", value: yesWithDetails(state.exitStrategy) };
      if (field.id === "exitStrategy") return null;
      if (field.id === "firstHomeBuyer") return { key: "First Home Buyer", value: "Yes" };
      if (field.id === "privateHealthInsurance") return { key: "Private Health Insurance", value: state.privateHealthInsuranceAmount ? `Disclosed - ${state.privateHealthInsuranceAmount}` : "Disclosed" };
      if (field.id === "privateHealthInsuranceAmount") return null;
      if (field.id === "craaIssuesRequired") return { key: "CCR Issues", value: yesWithDetails(state.craaIssues) };
      if (field.id === "craaIssues") return null;
      if (field.id === "dischargeRequired") return { key: "Discharge Required", value: yesWithDetails(state.dischargeTiming) };
      if (field.id === "dischargeTiming") return null;
      if (field.id === "approvalRequested" && value === "Conditional" && state.approvalSubjectTo) {
        return { key: field.label, value: `Conditional - Subject to: ${state.approvalSubjectTo}` };
      }
      if (field.id === "approvalSubjectTo") return null;
      return { key: field.label, value };
    }

    function renderPrintRow(row) {
      if (typeof row === "object" && row) {
        if (row.type === "note") {
          return `<div class="print-row print-note-line"><div class="print-value">${row.valueHtml || escapeHtml(row.value)}</div></div>`;
        }
        if (row.type === "income") {
          return `
            <div class="print-row print-row-wide">
              <div class="print-key">${escapeHtml(row.key)}</div>
              <div class="print-value">${renderIncomePrintValue(row.value)}</div>
            </div>
          `;
        }
        if (row.type === "applicants") {
          return `
            <div class="print-row print-row-wide">
              <div class="print-key">${escapeHtml(row.key)}</div>
              <div class="print-value">${renderApplicantsPrintValue(row.clients)}</div>
            </div>
          `;
        }
        if (row.type === "loans") {
          return `
            <div class="print-row print-row-wide">
              <div class="print-key">${escapeHtml(row.key)}</div>
              <div class="print-value">${renderLoansPrintValue(row.loans, row.startIndex || 0)}</div>
            </div>
          `;
        }
        if (row.type === "securities") {
          return `
            <div class="print-row print-row-wide">
              <div class="print-key">${escapeHtml(row.key)}</div>
              <div class="print-value">${renderSecuritiesPrintValue(row.securities, row.startIndex || 0)}</div>
            </div>
          `;
        }
        if (row.type === "otherLenders") {
          return `
            <div class="print-row print-row-wide">
              <div class="print-key">${escapeHtml(row.key)}</div>
              <div class="print-value">${renderOtherLendersPrintValue(row.lenders)}</div>
            </div>
          `;
        }
        if (row.type === "link") {
          return `
            <div class="print-row">
              <div class="print-key">${escapeHtml(row.key)}</div>
              <div class="print-value">${renderPrintLink(row.value)}</div>
            </div>
          `;
        }
        if (row.key === "Lender") {
          return `
            <div class="print-row">
              <div class="print-key">${escapeHtml(row.key)}</div>
              <div class="print-value">${renderPrintLenderName(row.value)}</div>
            </div>
          `;
        }
        return `
          <div class="print-row">
            <div class="print-key">${escapeHtml(row.key)}</div>
            <div class="print-value">${escapeHtml(row.value)}</div>
          </div>
        `;
      }
      const splitIndex = row.indexOf(":");
      if (splitIndex === -1 || /^NOTE\b/i.test(row)) {
        return `<div class="print-row print-note-line"><div class="print-value">${escapeHtml(row)}</div></div>`;
      }
      const key = row.slice(0, splitIndex).trim();
      const value = row.slice(splitIndex + 1).trim();
      if (key === "Income") {
        return `
          <div class="print-row print-row-wide">
            <div class="print-key">${escapeHtml(key)}</div>
            <div class="print-value">${renderIncomePrintValue(value)}</div>
          </div>
        `;
      }
      return `
        <div class="print-row">
          <div class="print-key">${escapeHtml(key)}</div>
          <div class="print-value">${escapeHtml(value)}</div>
        </div>
      `;
    }

    function normalizedLinkHref(value) {
      const text = String(value || "").trim();
      if (!text) return "";
      if (/^(https?:|mailto:|tel:)/i.test(text)) return text;
      return `https://${text}`;
    }

    function renderPrintLink(value) {
      const text = String(value || "").trim();
      const href = normalizedLinkHref(text);
      if (!href) return "";
      return `<a class="print-link" href="${escapeHtml(href)}" target="_blank" rel="noopener noreferrer">${escapeHtml(text)}</a>`;
    }

    function renderApplicantsPrintValue(clients = []) {
      const items = clients
        .filter((client) => client.name)
        .map((client, index) => {
          const details = [
            client.household ? ["Household", client.household] : null,
            client.relationship ? ["Relationship", client.relationship] : null,
            client.postcode ? ["Postcode", client.postcode] : null,
            client.citizenship ? ["Citizenship", client.citizenship] : null,
            client.visaVevoHeld ? ["VISA/VEVO", "Held"] : null
          ].filter(Boolean);
          return `
            <div class="print-applicant-card">
              <span class="print-applicant-name">${escapeHtml(client.name || `Applicant ${index + 1}`)}</span>
              ${details.map(([label, value]) => `<span class="print-applicant-detail"><strong>${escapeHtml(label)}:</strong> ${escapeHtml(value)}</span>`).join("")}
            </div>
          `;
        })
        .join("");
      return `<div class="print-applicant-list">${items}</div>`;
    }

    function printRowIsNA(row) {
      const splitIndex = row.indexOf(":");
      if (splitIndex === -1) return isNAValue(row);
      return isNAValue(row.slice(splitIndex + 1));
    }

    function renderIncomePrintValue(value) {
      const clientItems = state.clients
        .filter((client) => client.income && !isNAValue(client.income))
        .map((client) => ({
          name: client.name || "Applicant",
          details: client.income,
          detailsHtml: incomeEditorHtml(client)
        }));
      const fallbackItems = String(value || "")
        .split("\n")
        .map((line) => line.trim())
        .filter((line) => line && !isNAValue(line))
        .map((line) => ({ name: "", details: line }));
      const items = (clientItems.length ? clientItems : fallbackItems)
        .map(({ name, details, detailsHtml }) => {
          return `
            <div class="print-income-client">
              ${name ? `<span class="print-income-name">${escapeHtml(name)}</span>` : ""}
              <span class="print-income-details">${detailsHtml ? sanitizeIncomeHtml(detailsHtml) : escapeHtml(details)}</span>
            </div>
          `;
        })
        .join("");
      return `<div class="print-income-list">${items}</div>`;
    }

    function securityValueSummaryPrintValue(security = {}) {
      const landValue = securityHasType(security, "land") ? security.land?.price : "";
      const buildValue = securityHasType(security, "construction") ? security.build?.contractAmount : "";
      const outOfContractValue = securityHasType(security, "construction") ? security.build?.outOfContractItems : "";
      const componentTotal = securityComponentTotal(security);
      const total = security.value || (componentTotal ? normalizeCurrencyValue(String(componentTotal)) : "");
      const summaryParts = [
        ["Land", landValue],
        ["Build", buildValue],
        ["Out of contract", outOfContractValue]
      ].filter(([, value]) => value && !isNAValue(value));
      if (!summaryParts.length) return total;
      const summaryHtml = summaryParts
        .map(([label, value]) => `<span>${escapeHtml(label)}: ${escapeHtml(value)}</span>`)
        .join("");
      return {
        text: total,
        html: `${escapeHtml(total)}<span class="print-security-value-summary">${summaryHtml}</span>`
      };
    }

    function printLineValueText(value) {
      if (value && typeof value === "object") return value.text || "";
      return value;
    }

    function renderSecuritiesPrintValue(securities, startIndex = 0) {
      const cards = (securities || []).map((security, offset) => {
        const index = startIndex + offset;
        const typeLabel = securityModeLabel(security);
        const linkedLoans = state.loans
          .map((loan, loanIndex) => {
            const whole = (loan.securityIds || []).includes(index);
            const components = (loan.securityLinks || [])
              .filter((link) => String(link).startsWith(`${index}:`))
              .map((link) => String(link).endsWith(":build") ? "Build" : "Land");
            if (whole) return `Loan ${loanIndex + 1}: Whole security`;
            if (components.length) return `Loan ${loanIndex + 1}: ${components.join(" + ")}`;
            return "";
          })
          .filter(Boolean)
          .join("; ");
        const lines = [
          ["Address", security.address],
          ["Value", securityValueSummaryPrintValue(security)],
          ["Property Purpose", security.propertyPurpose],
          ["Boarder", security.propertyPurpose === "Owner Occupied" && security.boarder ? "Yes" : ""],
          ["Transaction Type", security.transactionType],
          ["Weekly Income", securityShowsWeeklyIncome(security) ? security.weeklyIncome : ""],
          ["Investment Expense", securityShowsInvestmentExpense(security) ? security.investmentExpense : ""],
          ...(securityHasType(security, "established") ? [
            ["Valuation", valuationDisplay(security.valuation, security.valuationOther)],
            ["Contract", security.contract],
            ["Expected", formatMonthDisplay(security.expectedDate)],
            ["Conveyancer", security.conveyancer]
          ] : []),
          [(securityHasType(security, "land") || securityHasType(security, "construction")) ? "Settlement Conditions / Plan of Subdivision Timelines" : "", security.settlementTimelines],
          ["Linked", linkedLoans]
        ].filter(([label, value]) => label && printLineValueText(value) && !isNAValue(printLineValueText(value)));
        return `
          <div class="print-security-card">
            <div class="print-security-card-head">
              <strong>Security ${index + 1}</strong>
              ${typeLabel ? `<span>${escapeHtml(typeLabel)}</span>` : ""}
            </div>
            ${lines.length ? `<div class="print-security-grid">${lines.map(renderPrintSecurityLine).join("")}</div>` : ""}
            ${securityHasType(security, "land") ? renderSecurityComponentPrint("Land", [
              ["Address", security.land?.address],
              ["Estate", security.land?.estate],
              ["Price", security.land?.price],
              ["Deposit", security.land?.depositsPaid],
              ["Receipt", security.land?.depositReceipt],
              ["POS", formatMonthDisplay(security.land?.posDate)],
              ["Valuation", valuationDisplay(security.land?.valuation, security.land?.valuationOther)],
              ["Contract", security.land?.contract],
              ["Expected", formatMonthDisplay(security.land?.expectedDate)],
              ["Conveyancer", security.land?.conveyancer]
            ]) : ""}
            ${securityHasType(security, "construction") ? renderSecurityComponentPrint("Construction", [
              ["Builder", security.build?.builderName],
              ["Amount", security.build?.contractAmount],
              ["Deposit", security.build?.depositsPaid],
              {
                type: "pair",
                left: ["Out of Contract Items", security.build?.outOfContractItems],
                right: ["Out of Contract Details", security.build?.outOfContractDetails]
              },
              ["Receipt", security.build?.depositReceipt],
              ["Site Start", security.build?.siteStart],
              ["Valuation", valuationDisplay(security.build?.valuation, security.build?.valuationOther)],
              ["Expected", formatMonthDisplay(security.build?.expectedDate)],
              ["Contract", security.build?.contract]
            ]) : ""}
          </div>
        `;
      }).join("");
      return `<div class="print-security-list">${cards}</div>`;
    }

    function renderSecurityComponentPrint(title, lines) {
      const filtered = lines.filter((line) => {
        if (line?.type === "pair") {
          return [line.left, line.right].some((item) => printLineValueText(item?.[1]) && !isNAValue(printLineValueText(item?.[1])));
        }
        return printLineValueText(line?.[1]) && !isNAValue(printLineValueText(line?.[1]));
      });
      if (!filtered.length) return "";
      return `
        <div class="print-security-component">
          <h3>${escapeHtml(title)}</h3>
          <div class="print-security-component-grid">${filtered.map((line) => line?.type === "pair" ? renderPrintSecurityPairLine(line) : renderPrintSecurityLine(line)).join("")}</div>
        </div>
      `;
    }

    function renderPrintSecurityPairLine(line) {
      const renderSide = (item) => {
        const [label, value] = item || [];
        if (!printLineValueText(value) || isNAValue(printLineValueText(value))) {
          return `<div class="print-security-line print-security-line-empty"></div>`;
        }
        return renderPrintSecurityLine([label, value]);
      };
      return `
        <div class="print-security-pair print-line-wide">
          ${renderSide(line.left)}
          ${renderSide(line.right)}
        </div>
      `;
    }

    function renderPrintSecurityLine([label, value]) {
      const valueHtml = value && typeof value === "object" && value.html ? value.html : escapeHtml(value);
      return `
        <div class="print-security-line">
          <strong>${escapeHtml(label)}</strong>
          <span>${valueHtml}</span>
        </div>
      `;
    }

    // One row per card keeps each card an unbreakable unit that a page break can work around.
    function printRowsForLoans() {
      return (state.loans || []).map((loan, index) => ({ key: index === 0 ? "Loans" : "", type: "loans", loans: [loan], startIndex: index }));
    }

    function renderLoansPrintValue(loans, startIndex = 0) {
      const loanCards = (loans || []).map((loan, offset) => {
        const index = startIndex + offset;
        const loanLabel = `Loan ${index + 1}`;
        const detailParts = [
          loan.purpose ? escapeHtml(loan.purpose) : "",
          loan.lender ? renderPrintLenderName(loan.lender) : "",
          loan.product ? escapeHtml(loan.product) : ""
        ].filter(Boolean);
        const lines = [
          ["Base Loan", loan.loanAmount],
          ["Linked Securities", linkedSecuritySummary(loan)],
          ["Security Value", loan.loanSecurityValue],
          ["Base LVR", loan.baseLvr],
          ...(loanLmiApplies(loan) ? [["LMI", loanPrintLmiValue(loan)], ["Post Cap LVR", loan.postCapLvr]] : []),
          ["5% Deposit Scheme", loan.depositScheme ? "Yes" : ""],
          ["Pricing", loan.pricingStatus],
          ["Pricing Notes", loan.pricingNotes],
          ["Loan Note", loan.loanNote]
        ].filter(([, value]) => value && !isNAValue(value));
        if (loan.approvalRequested) {
          const subjectTo = loan.approvalRequested === "Conditional" && loan.approvalSubjectTo ? `, subject to ${loan.approvalSubjectTo}` : "";
          lines.push(["Approval Requested", `${loan.approvalRequested}${subjectTo}`]);
        }
        const splitItems = (loan.splits || []).map((split, splitIndex) => {
          const splitDetails = [
            split.amount,
            split.loanUse,
            split.product,
            split.term ? `${split.term} yrs` : "",
            split.ioTerm ? `IO ${split.ioTerm} yrs` : "",
            split.interestRate,
            split.note
          ].filter(Boolean).join(" - ");
          return splitDetails ? `<div class="print-split-item"><strong>Split ${splitIndex + 1}</strong><span>${escapeHtml(splitDetails)}</span></div>` : "";
        }).filter(Boolean).join("");

        return `
          <div class="print-loan-card">
            <div class="print-loan-card-head">
              <strong>${escapeHtml(loanLabel)}</strong>
              ${detailParts.length ? `<span class="print-loan-summary">${detailParts.join("<span>-</span>")}</span>` : ""}
            </div>
            ${lines.length ? `
              <div class="print-loan-grid">
                ${lines.map(([label, value]) => `
                  <div class="print-loan-line">
                    <strong>${escapeHtml(label)}</strong>
                    <span>${escapeHtml(value)}</span>
                  </div>
                `).join("")}
              </div>
            ` : ""}
            ${splitItems ? `<div class="print-split-list">${splitItems}</div>` : ""}
          </div>
        `;
      }).join("");
      return `<div class="print-loan-list">${loanCards}</div>`;
    }

    function renderOtherLendersPrintValue(items = []) {
      const rendered = (items || []).map((item) => {
        if (!item?.lender && !item?.product && !item?.reason) return "";
        const detail = [item.product, item.reason].filter(Boolean).join(" - ");
        return `
          <div class="print-other-lender-item">
            ${item.lender ? renderPrintLenderName(item.lender) : "<span></span>"}
            ${detail ? `<span class="print-other-lender-detail">${escapeHtml(detail)}</span>` : ""}
          </div>
        `;
      }).filter(Boolean).join("");
      return rendered ? `<div class="print-other-lender-list">${rendered}</div>` : "";
    }

    function renderPrintLenderName(value) {
      const lender = lenderForName(value);
      const logo = lender?.logo ? `<img class="print-lender-logo" src="${escapeHtml(lender.logo)}" alt="">` : "";
      return `<span class="print-lender-name">${logo}<span>${escapeHtml(value)}</span></span>`;
    }

    function toTitleCase(value) {
      return String(value || "")
        .toLowerCase()
        .replace(/\b\w/g, (letter) => letter.toUpperCase());
    }

    function conditionalMatches(field) {
      if (field.hiddenWhen) {
        if (field.hiddenWhen.id === "securityPreApproval" && securityPreApprovalSelected()) return false;
        const actual = state[field.hiddenWhen.id];
        const hiddenValues = field.hiddenWhen.values || [field.hiddenWhen.value];
        const isHidden = Array.isArray(actual)
          ? hiddenValues.some((value) => actual.includes(value))
          : hiddenValues.includes(actual);
        if (isHidden) return false;
      }
      if (!field.conditionalOn) return true;
      if (field.conditionalOn.predicate === "above80") {
        return lvrIsAbove80();
      }
      if (field.conditionalOn.predicate === "above80WithoutDepositScheme") {
        return lvrIsAbove80() && !checkboxHasValue("depositScheme", "5% Deposit Scheme");
      }
      if (field.conditionalOn.predicate === "hasValue") {
        return Boolean(String(state[field.conditionalOn.id] || "").trim());
      }
      const actual = state[field.conditionalOn.id];
      const expected = field.conditionalOn.values || [field.conditionalOn.value];
      return Array.isArray(actual)
        ? expected.some((value) => actual.includes(value))
        : expected.includes(actual);
    }

    function lvrIsAbove80() {
      return parsePercentNumber(state.baseLvr) > 80;
    }

    function checkboxHasValue(id, value) {
      return Array.isArray(state[id]) && state[id].includes(value);
    }

    function updateProgress() {
      const required = orderedSections()
        .filter((section) => sectionIsVisible(section))
        .filter((section) => !(securityNestedMode() && section.nestedUnder === "security"))
        .flatMap((section) => section.required.map((id) => ({ section, id })))
        .filter(({ id }) => {
          const field = fieldById(id);
          return field && conditionalMatches(field) && !isSingleOptionCheckbox(field);
      });
      const complete = required.filter(({ id }) => {
        if (state.fundingPositionImage && ["loanStructure", "loanAmount", "loanSecurityValue", "baseLvr"].includes(id)) return true;
        if (securityPreApprovalSelected() && id === "securityAddress") return true;
        const field = fieldById(id);
        const value = field ? valueFor(field) : "";
        return value.length > 0;
      }).length;
      const percent = required.length ? Math.round((complete / required.length) * 100) : 100;
      progressText.textContent = `${percent}%`;
      progressFill.style.width = `${percent}%`;

      orderedSections().forEach((section) => {
        if (!sectionIsVisible(section)) return;
        const stepButton = document.querySelector(`[data-step-section="${section.id}"]`);
        if (section.id === "security") {
          const progress = securityOverallProgress();
          document.getElementById(`count-${section.id}`).textContent = `${progress.complete}/${progress.total}`;
          stepButton?.classList.toggle("done", progress.total > 0 && progress.complete >= progress.total);
          return;
        }
        if (securityNestedMode() && section.nestedUnder === "security") {
          const progress = securityComponentProgress(section.id);
          document.getElementById(`count-${section.id}`).textContent = `${progress.complete}/${progress.total}`;
          stepButton?.classList.toggle("done", progress.total > 0 && progress.complete >= progress.total);
          return;
        }
        const countableFields = section.fields.filter((field) => fieldCountsForProgress(field));
        const completedFields = countableFields.filter((field) => valueFor(field).length > 0).length;
        document.getElementById(`count-${section.id}`).textContent = `${completedFields}/${countableFields.length}`;
        stepButton?.classList.toggle("done", countableFields.length > 0 && completedFields >= countableFields.length);
      });
    }

    function securityOverallProgress() {
      if (securityPreApprovalSelected()) {
        return { complete: 0, total: 0 };
      }
      const items = [];
      (state.securities || []).forEach((security) => {
        items.push(...securityRequiredValues(security));
      });
      return {
        complete: items.filter((value) => String(value || "").trim()).length,
        total: items.length
      };
    }

    function securityRequiredValues(security = {}) {
      const values = [];
      if (securityHasType(security, "established")) {
        values.push(security.address, security.value);
      }
      if (securityHasType(security, "land")) {
        if (sectionIsVisible(fieldSection("absorbLand"))) {
          values.push(security.land?.price, security.land?.valuation, security.land?.contract);
        } else {
          values.push(security.land?.estate, security.land?.price, security.land?.valuation, security.land?.conveyancer);
        }
      }
      if (securityHasType(security, "construction")) {
        values.push(security.build?.builderName, security.build?.contract, security.build?.contractAmount, security.build?.valuation);
      }
      return values;
    }

    function securityComponentProgress(sectionId) {
      const securities = (state.securities || []).filter((security) => {
        if (sectionId === "builder") return securityHasType(security, "construction");
        return securityHasType(security, "land");
      });
      const values = securities.flatMap((security) => {
        const land = security.land || blankLandComponent();
        const build = security.build || blankBuildComponent();
        return sectionId === "builder"
          ? [build.builderName, build.contract, build.contractAmount, build.valuation]
          : sectionId === "absorbLand"
            ? [land.price, land.valuation, land.contract]
            : [land.estate, land.price, land.valuation, land.conveyancer];
      });
      return {
        complete: values.filter((value) => String(value || "").trim()).length,
        total: values.length
      };
    }

    function updateMissing() {
      missingBox.hidden = true;
      missingBox.textContent = "";
    }

    function fieldCountsForProgress(field) {
      if (field.count === false) return false;
      if (state.fundingPositionImage && ["loanStructure", "loanAmount", "loanSecurityValue", "baseLvr", "postCapLvr", "lmi", "clientContribution", "genuineSavings"].includes(field.id)) return false;
      if (securityPreApprovalSelected() && field.id === "securityAddress") return false;
      if (!conditionalMatches(field)) return false;
      if (field.type === "fundingPositionPreview") return false;
      if (isSingleOptionCheckbox(field)) return false;
      return true;
    }

    function isSingleOptionCheckbox(field) {
      return field.type === "checkbox" && (field.options || []).length <= 1;
    }

    function getMissingRequiredItems() {
      const missing = [];
      orderedSections().forEach((section) => {
        if (!sectionIsVisible(section)) return;
        if (securityNestedMode() && section.nestedUnder === "security") return;
        section.required.forEach((id) => {
          if (state.fundingPositionImage && ["loanStructure", "loanAmount", "loanSecurityValue", "baseLvr"].includes(id)) return;
          if (securityPreApprovalSelected() && id === "securityAddress") return;
          const field = fieldById(id);
          if (!field || !conditionalMatches(field)) return;
          if (isSingleOptionCheckbox(field)) return;
          if (!valueFor(field)) missing.push({ section, field });
        });
      });
      missing.push(...getMissingLoanStructureItems());
      missing.push(...getMissingSecurityComponentItems());
      return missing;
    }

    function getMissingLoanStructureItems() {
      const missing = [];
      const section = fieldSection("loan");
      if (!section || !sectionIsVisible(section)) return missing;
      if (state.fundingPositionImage) return missing;
      (state.loans || []).forEach((loan, loanIndex) => {
        if (state.securities.length && !loanHasLinkedSecurity(loan)) {
          missing.push({
            section,
            field: {
              id: `loan-${loanIndex}-linkedSecurities`,
              focusSelector: `input[data-loan-index="${loanIndex}"][data-loan-security-link]`
            }
          });
        }
        [
          ["purpose", `#loan${loanIndex}Purpose`],
          ["lender", `#loan${loanIndex}Lender`],
          ["product", `#loan${loanIndex}Product`],
          ["loanAmount", `#loan${loanIndex}Amount`],
          ["loanSecurityValue", `#loan${loanIndex}SecurityValue`],
          ["baseLvr", `#loan${loanIndex}BaseLvr`],
          ["postCapLvr", `#loan${loanIndex}PostCapLvr`],
          ["lmi", `#loan${loanIndex}Lmi`],
          ["pricingStatus", `#loan${loanIndex}PricingStatus`],
          ["approvalRequested", `#loan${loanIndex}ApprovalRequested`],
          ["approvalSubjectTo", `#loan${loanIndex}ApprovalSubjectTo`]
        ].forEach(([key, focusSelector]) => {
          if (!loanFieldIsRequired(key, loan)) return;
          if (!String(loan[key] || "").trim()) {
            missing.push({ section, field: { id: `loan-${loanIndex}-${key}`, focusSelector } });
          }
        });

        (loan.splits || []).forEach((split, splitIndex) => {
          [
            ["amount", `#loan${loanIndex}Split${splitIndex}Amount`],
            ["loanUse", `#loan${loanIndex}Split${splitIndex}LoanUse`],
            ["product", `#loan${loanIndex}Split${splitIndex}Product`],
            ["term", `#loan${loanIndex}Split${splitIndex}Term`],
            ["interestRate", `#loan${loanIndex}Split${splitIndex}InterestRate`]
          ].forEach(([key, focusSelector]) => {
            if (!splitFieldIsRequired(key)) return;
            if (!String(split[key] || "").trim()) {
              missing.push({ section, field: { id: `loan-${loanIndex}-split-${splitIndex}-${key}`, focusSelector } });
            }
          });
        });
      });
      return missing;
    }

    function getMissingSecurityComponentItems() {
      const missing = [];
      if (!sectionIsVisible(fieldSection("security"))) return missing;
      if (securityPreApprovalSelected()) return missing;
      (state.securities || []).forEach((security, index) => {
        if (securityHasType(security, "established")) {
          [
            ["address", `#securityAddress${index}`],
            ["value", `#securityValue${index}`]
          ].forEach(([key, focusSelector]) => {
            if (!security[key]) missing.push({ section: fieldSection("security"), field: { id: `security-${index}-${key}`, focusSelector } });
          });
        }
        if (securityHasType(security, "land")) {
          [
            ...(!sectionIsVisible(fieldSection("absorbLand")) ? [["estate", `#security${index}LandEstate`]] : []),
            ["price", `#security${index}LandPrice`],
            ["valuation", `#security${index}LandValuation`],
            ...(sectionIsVisible(fieldSection("absorbLand")) ? [["contract", `#security${index}LandContract`]] : [["conveyancer", `#security${index}LandConveyancer`]])
          ].forEach(([key, focusSelector]) => {
            const section = sectionIsVisible(fieldSection("absorbLand")) ? fieldSection("absorbLand") : fieldSection("land");
            if (!security.land?.[key]) missing.push({ section, field: { id: `security-${index}-land-${key}`, focusSelector } });
          });
        }
        if (securityHasType(security, "construction")) {
          [
            ["builderName", `#security${index}BuilderName`],
            ["contract", `#security${index}BuildContract`],
            ["contractAmount", `#security${index}BuildAmount`],
            ["valuation", `#security${index}BuildValuation`]
          ].forEach(([key, focusSelector]) => {
            if (!security.build?.[key]) missing.push({ section: fieldSection("builder"), field: { id: `security-${index}-build-${key}`, focusSelector } });
          });
        }
      });
      return missing;
    }

    function fieldSection(id) {
      return sections.find((section) => section.id === id);
    }

    function focusNextMissingField() {
      collectAndUpdate();
      const missing = getMissingRequiredItems();
      if (!missing.length) return false;
      const controls = missing
        .map(({ field }) => focusTargetForField(field))
        .filter((control) => control && !control.closest(".is-hidden"));
      if (!controls.length) return false;
      const currentIndex = controls.findIndex((control) => control === document.activeElement || control.contains?.(document.activeElement));
      const next = controls[currentIndex + 1] || controls[0];
      next.scrollIntoView({ behavior: "smooth", block: "center" });
      next.focus({ preventScroll: true });
      markMissingField(next);
      return true;
    }

    function markMissingField(control) {
      clearMissingIndicators();
      addMissingIndicator(control);
    }

    function addMissingIndicator(control) {
      const target = control.closest(".field, .mini-field, .repeat-row, .split-row, .loan-card, .applicant-card, .income-client-card, .sub-card, label.choice") || control.closest(".repeater") || control;
      target.classList.add("missing-highlight");
      control.setAttribute("aria-invalid", "true");
    }

    function highlightMissingItems(missing) {
      clearMissingIndicators();
      const controls = missing
        .map(({ field }) => focusTargetForField(field))
        .filter((control) => control && !control.closest(".is-hidden"));
      controls.forEach(addMissingIndicator);
      controls[0]?.scrollIntoView({ behavior: "smooth", block: "center" });
      controls[0]?.focus({ preventScroll: true });
      return controls.length;
    }

    function clearMissingIndicators() {
      document.querySelectorAll(".missing-highlight").forEach((element) => {
        element.classList.remove("missing-highlight");
      });
      document.querySelectorAll("[aria-invalid='true']").forEach((element) => {
        element.removeAttribute("aria-invalid");
      });
    }

    function focusTargetForField(field) {
      if (field.focusSelector) return document.querySelector(field.focusSelector);
      if (field.type === "clientRepeater") return document.querySelector("[data-client-key='name']");
      if (field.type === "purposeRepeater") return document.querySelector("[data-purpose-index]");
      if (field.type === "incomeRepeater") return document.querySelector("[data-client-income-index]");
      if (field.type === "loanStructureRepeater") return document.querySelector("[data-loan-index]");
      if (field.type === "liabilityRepeater") return document.querySelector("[data-liability-index]");
      if (field.type === "securityRepeater") return document.querySelector("[data-security-index]");
      if (field.type === "otherLenderRepeater") return document.querySelector("[data-other-lender-index]");
      if (field.type === "contributionButton") return document.querySelector("[data-toggle-contribution]");
      if (field.type === "radio" || field.type === "checkbox") return document.querySelector(`input[name="${field.id}"]`);
      return document.getElementById(field.id);
    }

    function setValue(id, value) {
      const field = fieldById(id);
      if (!field) {
        state[id] = value;
        return;
      }

      if (field.type === "clientRepeater") {
        state.clients = Array.isArray(value) && value.length ? value : [{ name: "", income: "" }];
        syncClientRelationships();
        syncPreferredContact();
        return;
      }

      if (field.type === "purposeRepeater") {
        state.purposes = Array.isArray(value) ? value.map(normalizePurpose) : [normalizePurpose(value)];
        state.purpose = state.purposes.find(Boolean) || "";
        return;
      }

      if (field.type === "liabilityRepeater") {
        state.liabilities = Array.isArray(value) && value.length ? value.map((item) => ({ ...blankLiability(), ...item })) : [blankLiability()];
        return;
      }

      if (field.type === "radio") {
        const input = Array.from(document.querySelectorAll(`input[name="${id}"]`))
          .find((candidate) => candidate.value === value);
        if (input) input.checked = true;
      } else if (field.type === "checkbox") {
        const values = Array.isArray(value) ? value : [value];
        document.querySelectorAll(`input[name="${id}"]`).forEach((input) => {
          input.checked = values.includes(input.value);
        });
      } else {
        const control = document.getElementById(id);
        if (control) control.value = value;
      }
    }

    function reset(show = true) {
      clearState();
      activeSavedNoteId = "";
      clearTimeout(savedNoteAutosaveTimer);
      savedNoteAutosaveTimer = null;
      clearTimeout(draftSaveTimer);
      draftSaveTimer = null;
      pendingDraftSave = null;
      lastDraftSnapshot = "";
      reportedStorageFull = false;
      localStorage.removeItem("paraBrokerActiveSavedNoteId");
      localStorage.removeItem(draftStorageKey);
      localStorage.removeItem("paraBrokerNotesDraft");
      localStorage.removeItem("paraBrokerNotesDraftBlankV2");
      localStorage.removeItem("paraBrokerNotesDraftBlankV3");
      render();
      recordHistorySnapshot({ clearRedo: true, force: true });
      updateAutosaveStatus("Draft cleared");
      if (show) showToast("Form cleared.");
    }

    function clearState() {
      Object.keys(state).forEach((key) => delete state[key]);
      state.clients = [{ name: "", income: "" }];
      state.securities = [blankSecurity()];
      state.liabilities = [blankLiability()];
      state.otherLenders = [
        { lender: "", product: "", reason: "" },
        { lender: "", product: "", reason: "" }
      ];
    }

    // The print document is only ever visible inside @media print, and rebuilding it
    // reparses the whole note - over a megabyte of HTML once a funding position is
    // attached. Defer it, and force it through before anything can print.
    function schedulePrintDocument(noteText) {
      pendingPrintNoteText = noteText;
      clearTimeout(printDocumentTimer);
      printDocumentTimer = setTimeout(ensurePrintDocument, 350);
    }

    function ensurePrintDocument() {
      clearTimeout(printDocumentTimer);
      printDocumentTimer = null;
      if (pendingPrintNoteText === null) return;
      const noteText = pendingPrintNoteText;
      pendingPrintNoteText = null;
      noteOutput.innerHTML = buildPrintDocument(noteText);
    }

    // Serialising state can cost tens of milliseconds once a funding position PDF is
    // embedded, so a keystroke only schedules a write. flushPendingSaves() forces it
    // through whenever the page might be going away.
    function saveDraft(options = {}) {
      // Merge with anything already queued: if any caller wants the status line or the
      // saved-note write, the flush must do it.
      pendingDraftSave = {
        status: Boolean(pendingDraftSave?.status) || options.status !== false,
        savedNote: Boolean(pendingDraftSave?.savedNote) || options.savedNote !== false
      };
      if (pendingDraftSave.status) markAutosavePending();
      clearTimeout(draftSaveTimer);
      draftSaveTimer = setTimeout(writePendingDraft, 450);
    }

    function writePendingDraft() {
      clearTimeout(draftSaveTimer);
      draftSaveTimer = null;
      const pending = pendingDraftSave;
      if (!pending) return;
      pendingDraftSave = null;
      const snapshot = stateSnapshot();
      // Nothing changed since the last write, so skip the whole round trip.
      if (snapshot === lastDraftSnapshot) {
        if (pending.status) updateAutosaveStatus("Draft autosaved locally");
        if (pending.savedNote) scheduleSavedNoteAutosave();
        return;
      }
      try {
        localStorage.setItem(draftStorageKey, snapshot);
        lastDraftSnapshot = snapshot;
        recordHistorySnapshot({ snapshot });
        if (pending.status) updateAutosaveStatus("Draft autosaved locally");
        if (pending.savedNote) scheduleSavedNoteAutosave();
      } catch (error) {
        console.error(error);
        reportAutosaveFailure(error);
      }
    }

    function reportAutosaveFailure(error) {
      const outOfSpace = error?.name === "QuotaExceededError" || error?.name === "NS_ERROR_DOM_QUOTA_REACHED";
      if (autosaveStatus) {
        autosaveStatus.classList.add("is-saving");
        autosaveStatus.textContent = outOfSpace ? "Autosave failed - storage full" : "Autosave failed";
      }
      if (outOfSpace && !reportedStorageFull) {
        reportedStorageFull = true;
        showToast("Browser storage is full. Use Save File to back this note up, then delete old saved notes.", 6000);
      }
    }

    // Called before the page can disappear, so a debounced write is never lost.
    function flushPendingSaves() {
      if (pendingDraftSave || draftSaveTimer) writePendingDraft();
      if (savedNoteAutosaveTimer) {
        clearTimeout(savedNoteAutosaveTimer);
        savedNoteAutosaveTimer = null;
        autosaveActiveSavedNote();
      }
    }

    function readStoredDraft() {
      const keys = [draftStorageKey, ...legacyDraftStorageKeys];
      for (const key of keys) {
        const raw = localStorage.getItem(key);
        if (!raw) continue;
        try {
          const draft = JSON.parse(raw);
          if (!draft || typeof draft !== "object" || Array.isArray(draft) || !Object.keys(draft).length) continue;
          if (key !== draftStorageKey) {
            localStorage.setItem(draftStorageKey, JSON.stringify(draft));
          }
          return draft;
        } catch (error) {
          localStorage.removeItem(key);
        }
      }
      return {};
    }

    function loadDraftState() {
      const draft = readStoredDraft();
      Object.assign(state, draft);
      activeSavedNoteId = state.savedNoteId || activeSavedNoteId;
      ensureDefaults();
    }

    function stateSnapshot() {
      return JSON.stringify(state);
    }

    function replaceStateFromSnapshot(snapshot) {
      const nextState = JSON.parse(snapshot || "{}");
      Object.keys(state).forEach((key) => delete state[key]);
      Object.assign(state, nextState);
      ensureDefaults();
    }

    function recordHistorySnapshot(options = {}) {
      if (isRestoringHistory) return;
      // Reuse the caller's string when it already has one - stringify is the expensive part.
      const snapshot = options.snapshot || stateSnapshot();
      if (!options.force && snapshot === lastHistorySnapshot) return;
      undoStack.push(snapshot);
      trimHistoryStack();
      lastHistorySnapshot = snapshot;
      if (options.clearRedo !== false) redoStack = [];
    }

    // A note carrying an embedded PDF can make each snapshot megabytes, so cap the
    // stack by total size as well as by count.
    function trimHistoryStack() {
      while (undoStack.length > 80) undoStack.shift();
      let total = undoStack.reduce((sum, entry) => sum + entry.length, 0);
      while (undoStack.length > 2 && total > 12000000) {
        total -= undoStack.shift().length;
      }
    }

    function restoreHistorySnapshot(snapshot, message) {
      isRestoringHistory = true;
      replaceStateFromSnapshot(snapshot);
      clearTimeout(draftSaveTimer);
      draftSaveTimer = null;
      pendingDraftSave = null;
      lastDraftSnapshot = stateSnapshot();
      localStorage.setItem(draftStorageKey, lastDraftSnapshot);
      render();
      lastHistorySnapshot = stateSnapshot();
      isRestoringHistory = false;
      updateAutosaveStatus("Draft autosaved locally");
      scheduleSavedNoteAutosave();
      showToast(message, 1400);
    }

    function undoState() {
      collectAndUpdate(false);
      recordHistorySnapshot({ clearRedo: false });
      if (undoStack.length < 2) {
        showToast("Nothing to undo.", 1200);
        return;
      }
      const current = undoStack.pop();
      redoStack.push(current);
      const previous = undoStack[undoStack.length - 1];
      restoreHistorySnapshot(previous, "Undone.");
    }

    function redoState() {
      if (!redoStack.length) {
        showToast("Nothing to redo.", 1200);
        return;
      }
      const snapshot = redoStack.pop();
      undoStack.push(snapshot);
      restoreHistorySnapshot(snapshot, "Redone.");
    }

    function setActiveSidebarSection(sectionId) {
      document.querySelectorAll(".step").forEach((step) => {
        step.classList.toggle("active", step.dataset.jump === sectionId);
      });
    }

    function setHoveredSidebarSection(sectionId) {
      hoveredSectionId = sectionId;
      setActiveSidebarSection(hoveredSectionId || visibleSectionId);
    }

    function trackActiveSection() {
      if (sectionObserver) sectionObserver.disconnect();
      sectionObserver = new IntersectionObserver((entries) => {
        const visible = entries
          .filter((entry) => entry.isIntersecting)
          .sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];
        if (!visible) return;
        visibleSectionId = visible.target.dataset.section;
        if (!hoveredSectionId) setActiveSidebarSection(visibleSectionId);
      }, { rootMargin: "-20% 0px -60% 0px", threshold: [0.1, 0.35, 0.6] });

      document.querySelectorAll("[data-section]").forEach((section) => {
        sectionObserver.observe(section);
        section.addEventListener("mouseenter", () => setHoveredSidebarSection(section.dataset.section));
        section.addEventListener("mouseleave", () => setHoveredSidebarSection(""));
        section.addEventListener("focusin", () => setHoveredSidebarSection(section.dataset.section));
        section.addEventListener("focusout", (event) => {
          if (!section.contains(event.relatedTarget)) {
            setHoveredSidebarSection("");
          }
        });
      });
    }

    const TOAST_TONES = ["is-error", "is-warning", "is-info"];

    function toneForMessage(message) {
      if (/\b(failed|could not|couldn't|not available|not found|no .* found|please upload|does not contain)\b/i.test(message)) return "error";
      if (/\b(missing|nothing to|not embedded)\b/i.test(message)) return "warning";
      if (/\b(reading|release to|cancelled)\b/i.test(message)) return "info";
      return "success";
    }

    function showToast(message, duration = 2200, tone) {
      toast.textContent = message;
      toast.classList.remove(...TOAST_TONES);
      const resolved = tone || toneForMessage(message);
      if (resolved !== "success") toast.classList.add(`is-${resolved}`);
      toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove("show"), duration);
    }

    function registerServiceWorker() {
      if (!("serviceWorker" in navigator) || window.location.protocol === "file:") return;
      if (["localhost", "127.0.0.1", "::1"].includes(window.location.hostname)) {
        navigator.serviceWorker.getRegistrations()
          .then((registrations) => registrations.forEach((registration) => registration.unregister()))
          .catch(() => {});
        return;
      }
      let refreshing = false;
      const banner = document.getElementById("updateBanner");
      const showUpdateBanner = (registration) => {
        if (!banner) return;
        banner.classList.add("show");
        const button = banner.querySelector("[data-apply-update]");
        if (button && !button.dataset.bound) {
          button.dataset.bound = "true";
          button.addEventListener("click", () => {
            if (registration.waiting) {
              registration.waiting.postMessage({ type: "SKIP_WAITING" });
            } else {
              window.location.reload();
            }
          });
        }
      };

      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (refreshing) return;
        refreshing = true;
        window.location.reload();
      });

      navigator.serviceWorker.register("./sw.js").then((registration) => {
        if (registration.waiting) showUpdateBanner(registration);
        registration.addEventListener("updatefound", () => {
          const worker = registration.installing;
          if (!worker) return;
          worker.addEventListener("statechange", () => {
            if (worker.state === "installed" && navigator.serviceWorker.controller) {
              showUpdateBanner(registration);
            }
          });
        });
      }).catch(() => {});
    }

    async function importQuickliPdf(file) {
      if (!file) return;
      showToast("Reading Quickli PDF...");
      try {
        const quickli = await parseQuickliPdf(file);
        const loanGrouping = quickli.proposedLoans.length > 1
          ? await promptQuickliLoanGrouping(quickli.proposedLoans)
          : quickli.proposedLoans.map((_, index) => index + 1);
        if (!loanGrouping) {
          showToast("Quickli import cancelled.");
          return;
        }
        applyQuickliData(quickli, loanGrouping);
        render();
        saveDraft();
        showToast(`Quickli imported: ${quickli.importedCount} fields filled.`);

        showToast("Quickli import failed. Check the PDF and try again.");

    async function importLoanScenarioPdf(file, options = {}) {
      if (!file) return;
      if (!options.silentFailure) showToast("Reading Loan Scenario PDF...");

    async function importToolExportPdf(file) {
      if (!file) return;
      showToast("Reading exported Para-Broker Wizard PDF...");
      try {
        const rows = await extractPdfRows(file);
        const compactText = rows.map((row) => row.text).join("").replace(/\s+/g, "");
        const match = compactText.match(/LS_TRANSFER_JSON:([A-Za-z0-9+/=]+)/);
        if (!match) {
          showToast("No Para-Broker Wizard data found in that PDF.", 3600);
          return;
        }
        const importedState = decodeStateTransferPayload(match[1]);
        Object.keys(state).forEach((key) => delete state[key]);
        Object.assign(state, importedState);

        showToast("Para-Broker Wizard PDF imported.");

    async function parseLoanScenarioPdf(file) {
      const rows = await extractPdfRows(file);
      const text = rows.map((row) => row.text).join("\n");
      const visibleText = rows.filter((row) => !row.annotation).map((row) => row.text).join("\n");
      const parsed = {
        clients: parseScenarioApplicants(rows, text),
        purpose: parseScenarioPurpose(rows, file.name || "", visibleText),
        referralSource: scenarioFieldValue(rows, /^Referred\s*by$/i) || parseScenarioValue(rows, /Referred\s*By/i),
        clientContributionText: scenarioFieldValue(rows, /^Client Contribution$/i) || parseScenarioValue(rows, /Clients?\s+Contribution/i),
        securityAddress: parseScenarioSecurityAddress(rows),
        securityValue: scenarioFieldMoney(rows, /^Bank_Value$|^Valued_at_\d+$/i) || parseScenarioMoneyAfter(rows, /Property Address/i, { last: true }),
        builderName: parseScenarioBuilder(rows),
        builderContractAmount: scenarioFieldMoney(rows, /Builder|Construction/i) || parseScenarioMoneyAfter(rows, /Builder\s*[/-]\s*House Type|Builder\s+[-–]\s+House Type|Construction Cost/i),
        landPrice: scenarioFieldMoney(rows, /^Purchase_Price$|Land.*Price/i) || parseScenarioMoneyAfter(rows, /Purchase Price|Land Purchase Price/i),
        loanAmount: parseScenarioLoanAmount(rows),
        lmi: parseScenarioLmi(rows),
        baseLvr: scenarioFieldPercent(rows, /Base_Loan_to_Value_Ratio|Land.*Base.*LVR|Total.*Base.*LVR/i) || parseScenarioPercentAfter(rows, /Base Loan to Value Ratio|Land Base Loan to Value Ratio|Total Base Loan to Value Ratio/i),
        postCapLvr: scenarioFieldPercent(rows, /End_Loan_to_Value_Ratio|Land.*End.*LVR|Total.*End.*LVR/i) || parseScenarioPercentAfter(rows, /End Loan to Value Ratio|Land End Loan to Value Ratio|Total End Loan to Value Ratio/i),
        lender: parseScenarioLender(rows),
        product: parseScenarioProduct(rows),
        interestRate: scenarioFieldPercent(rows, /^Actual_Interest_Rate_L\d+$/i) || scenarioFieldPercent(rows, /^Actual_Interest_Rate/i) || parseScenarioPercentAfter(rows, /Actual Interest Rate/i, { last: true }),
        repaymentType: /Principal\s*&\s*Interest/i.test(visibleText) && /✔\s*Principal|✓\s*Principal/i.test(visibleText) ? "Principal & Interest" : "",
        splits: parseScenarioSplits(rows),
        conveyancer: parseScenarioValue(rows, /Conveyancer Details/i),
        settlementText: parseScenarioValue(rows, /Settlement Date/i),
        landDepositsPaid: scenarioFieldMoney(rows, /Initial.*Land.*Deposit|Land.*Deposit/i) || parseScenarioDeposit(rows, /Initial Land Deposit|Initial Deposit/i),
        builderDepositsPaid: scenarioFieldMoney(rows, /Initial.*Builder.*Deposit|Builder.*Deposit/i) || parseScenarioDeposit(rows, /Initial Builder Deposit/i),
        contributionTotal: scenarioFieldMoney(rows, /Total Client Contribution/i) || parseScenarioMoneyAfter(rows, /Total Client Contribution/i),
        importedCount: 0
      };

      if (!parsed.securityValue) parsed.securityValue = parseScenarioMoneyAfter(rows, /Total Value/i);
      if (!parsed.landPrice && /Purchase Land|Land Purchase|Purchase Land and Fund Construction/i.test(visibleText)) {
        parsed.landPrice = parseScenarioMoneyAfter(rows, /Property Address/i);
      }
      parsed.importedCount = Object.entries(parsed)
        .filter(([key, value]) => key !== "importedCount" && Boolean(Array.isArray(value) ? value.length : value))
        .length;
      return parsed;
    }

    function scenarioFieldRows(rows, pattern) {
      return rows.filter((row) => row.annotation && pattern.test(String(row.fieldName || "")));
    }

    function scenarioFieldValue(rows, pattern) {
      const row = scenarioFieldRows(rows, pattern).find((candidate) => {
        const value = String(candidate.fieldValue ?? "").trim();
        return value && value !== "null" && value !== "undefined";
      });
      if (!row) return "";
      return cleanScenarioValue(String(row.fieldValue ?? "").trim());
    }

    function scenarioFieldMoney(rows, pattern) {
      const value = scenarioFieldValue(rows, pattern);
      if (!value || /^N\/?A$/i.test(value)) return "";
      return normalizeScenarioMoney(value);
    }

    function normalizeScenarioMoney(value) {
      const amount = parseCurrencyNumber(value);
      if (!amount) return "";
      return normalizeCurrencyValue(value);
    }

    function normalizeScenarioLoanMoney(value) {
      const amount = parseCurrencyNumber(value);
      if (amount < 10000) return "";
      return normalizeCurrencyValue(value);
    }

    function scenarioFieldPercent(rows, pattern) {
      const value = scenarioFieldValue(rows, pattern);
      if (!value || /^N\/?A$/i.test(value)) return "";
      const numeric = Number(String(value).replace(/[^\d.-]/g, ""));
      if (!Number.isFinite(numeric)) return normalizePercent(value);
      const percent = Math.abs(numeric) <= 1 ? numeric * 100 : numeric;
      return normalizePercent(`${Number(percent.toFixed(2))}`);
    }

    function scenarioRowsNear(rows, pattern) {
      return rows.filter((row) => pattern.test(row.text));
    }

    function parseScenarioValue(rows, pattern) {
      const row = scenarioRowsNear(rows, pattern).find((candidate) => {
        const value = textAfterPattern(candidate.text, pattern);
        return value && !/^\$?0(?:\.00)?$/.test(value);
      });
      if (!row) return "";
      return cleanScenarioValue(textAfterPattern(row.text, pattern));
    }

    function textAfterPattern(text, pattern) {
      const source = String(text || "");
      const match = source.match(pattern);
      if (!match) return source;
      const start = match.index ?? source.search(pattern);
      return source.slice(start + match[0].length).trim();
    }

    function cleanScenarioValue(value) {
      return String(value || "")
        .replace(/\s{2,}/g, " ")
        .replace(/\s+\b(Referred By|Referred by|Clients? Contribution|Deposit Date|Tender Date|Contract Date|Settlement Date|Finance Clause Date|Bank Valuation|Valued at|Bank Value|Term \(Years\)|Package|Product|Repayment Type|Package Discount|Actual Interest Rate|Base Loan to Value Ratio.*|End Loan to Value Ratio.*)\b[\s\S]*$/i, "")
        .trim();
    }

    function parseScenarioApplicants(rows, text = "") {
      const fieldApplicant = cleanApplicantCandidate(scenarioFieldValue(rows, /^Applicants$/i));
      if (fieldApplicant) return splitScenarioNames(fieldApplicant).map((name) => ({ name, income: "" }));

      const topRows = rows.slice(0, Math.min(rows.length, 12));
      for (const row of topRows) {
        const text = row.text.replace(/^Loan Scenario\s*/i, "").trim();
        const match = text.match(/^(.+?)\s+Referred\s+By\b/i) || text.match(/^(.+?)\s+Referred\s+by\b/i);
        const candidate = cleanApplicantCandidate(match?.[1] || "");
        if (candidate) {
          return splitScenarioNames(candidate).map((name) => ({ name, income: "" }));
        }
      }
      const textMatch = text.match(/Loan Scenario\s+([\s\S]*?)\s+Referred\s+By/i);
      const textCandidate = cleanApplicantCandidate(textMatch?.[1] || "");
      if (textCandidate) return splitScenarioNames(textCandidate).map((name) => ({ name, income: "" }));
      const applicantRowIndex = rows.findIndex((row) => /^Applicants\b/i.test(row.text));
      const nextText = rows.slice(Math.max(0, applicantRowIndex - 2), applicantRowIndex + 3)
        .map((row) => row.text)
        .join(" ");
      const fallback = nextText.match(/Loan Scenario\s+(.+?)\s+Applicants/i)?.[1] || "";
      return splitScenarioNames(cleanApplicantCandidate(fallback)).map((name) => ({ name, income: "" }));
    }

    function cleanApplicantCandidate(value) {
      const cleaned = cleanScenarioValue(value)
        .replace(/^Applicants\b/i, "")
        .replace(/\s+Applicants\b/i, "")
        .replace(/\s+-\s+TOP UP ONLY\b/i, "")
        .replace(/\s+-\s+.*$/i, "")
        .trim();
      if (!cleaned || /^Referred By$/i.test(cleaned) || /^Applicants$/i.test(cleaned)) return "";
      return cleaned;
    }

    function splitScenarioNames(value) {
      const cleaned = String(value || "")
        .replace(/\*+/g, "")
        .replace(/\s+/g, " ")
        .trim();
      if (!cleaned) return [];
      if (/\s+&\s+/.test(cleaned) && !/,/.test(cleaned)) {
        const parts = cleaned.split(/\s+&\s+/).map((part) => part.trim()).filter(Boolean);
        if (parts.length === 2 && parts.every((part) => /^[A-Z][A-Z\s'-]+$/.test(part))) return parts.map(toDisplayName);
        return [cleaned];
      }
      return cleaned.split(/\s*,\s*/).filter(Boolean);
    }

    function toDisplayName(value) {
      return String(value || "").toLowerCase().replace(/\b[a-z]/g, (letter) => letter.toUpperCase());
    }

    function parseScenarioPurpose(rows, fileName, text = "") {
      const rowValue = parseScenarioValue(rows, /^Purpose\b/i);
      const source = `${rowValue} ${fileName} ${text}`.toLowerCase();
      if (/\balc\b|absorb|refinance\s+land\s*(?:&|and)\s*construction|refinance\s+.*construction/i.test(source)) return "ALC (Refinance Land & Construction)";
      if (/\baio\b|land\s*(?:&|and)\s*construction|construction\s*(?:&|and)\s*land|purchase land and fund construction/i.test(source)) return "AIO (Land & Construction)";
      if (/construction/.test(source)) return "Construction";
      if (/purchase land|land purchase/.test(source)) return "Purchase Land";
      if (/internal refi|int refinance|refinance internal/.test(source)) return "Refinance (Internal)";
      if (/refinance|refi/.test(source)) return "Refinance (External)";
      if (/purchase|purchased|established/.test(source)) return "Purchase Established";
      return "";
    }

    function parseScenarioSecurityAddress(rows) {
      const fieldValue = scenarioFieldValue(rows, /^Property Address$/i);
      if (fieldValue) return fieldValue;
      const row = rows.find((candidate) => /Property Address/i.test(candidate.text));
      if (!row) return "";
      const withoutLabel = row.text.replace(/^\d+\s*/, "").replace(/Property Address/i, "").trim();
      return withoutLabel.replace(/\$[\d,]+(?:\.\d+)?[\s\S]*$/, "").trim();
    }

    function parseScenarioBuilder(rows) {
      const row = rows.find((candidate) => /Builder\s*[/-]\s*House Type|Builder\s+[-–]\s+House Type/i.test(candidate.text));
      if (!row) return "";
      return cleanScenarioValue(row.text.replace(/Builder\s*[/-]\s*House Type|Builder\s+[-–]\s+House Type/i, "").replace(/\$[\d,]+(?:\.\d+)?[\s\S]*$/, ""));
    }

    function parseScenarioLender(rows) {
      const fieldValue = scenarioFieldValue(rows, /^Bank_L\d+$/i) || scenarioFieldValue(rows, /^Bank$/i);
      if (fieldValue) return fieldValue;
      const row = rows.find((candidate) => /\bBank\b/i.test(candidate.text) && !/Bank Valuation|Bank Value/i.test(candidate.text));
      if (!row) return "";
      return cleanScenarioValue(textAfterPattern(row.text, /\bBank\b/i)).replace(/\s+\$[\d,]+(?:\.\d+)?[\s\S]*$/, "").trim();
    }

    function parseScenarioProduct(rows) {
      const fieldValue = scenarioFieldValue(rows, /^Product_L\d+$/i)
        || scenarioFieldValue(rows, /^Product_S\d+$/i)
        || scenarioFieldValue(rows, /^Package_L\d+$/i)
        || scenarioFieldValue(rows, /^Package_S\d+$/i);
      if (fieldValue) return fieldValue;
      const rowsWithProduct = rows.filter((candidate) => /\bProduct\b/i.test(candidate.text));
      const row = rowsWithProduct.find((candidate) => !/Package|Repayment Type/i.test(candidate.text) && /Product\s+\S/i.test(candidate.text)) || rowsWithProduct[0];
      if (!row) return "";
      const parts = row.text.split(/\bProduct\b/i).map((part) => cleanScenarioValue(part)).filter(Boolean);
      const product = parts[parts.length - 1] || "";
      return /^(Fees|Total Cost|Other Costs?|Costs?)$/i.test(product) ? "" : product;
    }

    function parseScenarioLoanAmount(rows) {
      const fieldValue = normalizeScenarioLoanMoney(scenarioFieldValue(rows, /^Loan_Amount_L\d+$/i))
        || normalizeScenarioLoanMoney(scenarioFieldValue(rows, /^Total Loan$/i))
        || normalizeScenarioLoanMoney(scenarioFieldValue(rows, /^Total_Loan$/i));
      if (fieldValue) return fieldValue;
      const loanRows = rows.filter((candidate) => /Loan Amount/i.test(candidate.text) && /\$[\d,]+(?:\.\d+)?/.test(candidate.text));
      const row = loanRows.find((candidate) => !/Split Amount/i.test(candidate.text)) || loanRows[loanRows.length - 1];
      if (!row) return normalizeScenarioLoanMoney(parseScenarioMoneyAfter(rows, /Total Loan/i, { last: true }));
      const money = row.text.match(/\$[\d,]+(?:\.\d+)?/g) || [];
      return money.length ? normalizeScenarioLoanMoney(money[money.length - 1]) : "";
    }

    function parseScenarioLmi(rows) {
      const fieldValue = scenarioFieldMoney(rows, /^Lenders?_Mortgage_Insurance$/i);
      if (fieldValue) return fieldValue;
      const row = rows.find((candidate) => /Lenders?\s+Mortgage\s+Insurance|Lender’s Mortgage Insurance/i.test(candidate.text) && /\$[\d,]+(?:\.\d+)?/.test(candidate.text));
      if (!row || /Total Fees/i.test(row.text)) return "";
      const money = row.text.match(/\$[\d,]+(?:\.\d+)?/g) || [];
      return money.length ? normalizeScenarioMoney(money[money.length - 1]) : "";
    }

    function parseScenarioSplits(rows) {
      const splitRows = rows
        .filter((row) => row.annotation && /^Split\d+$/i.test(String(row.fieldName || "")) && row.fieldValue)
        .sort((a, b) => Number(String(a.fieldName).match(/\d+/)?.[0] || 0) - Number(String(b.fieldName).match(/\d+/)?.[0] || 0));
      const splits = splitRows.map((row, index) => {
        const splitNumber = Number(String(row.fieldName).match(/\d+/)?.[0] || index + 1);
        const amount = normalizeScenarioMoney(row.fieldValue);
        return normalizeSplit({
          amount,
          product: scenarioFieldValue(rows, new RegExp(`^Product_${splitNumber === 1 ? "S1" : `L${splitNumber - 1}`}$`, "i"))
            || scenarioFieldValue(rows, new RegExp(`^Product_S${splitNumber}$`, "i"))
            || scenarioFieldValue(rows, new RegExp(`^Package_${splitNumber === 1 ? "S1" : `L${splitNumber - 1}`}$`, "i"))
            || scenarioFieldValue(rows, new RegExp(`^Package_S${splitNumber}$`, "i")),
          repaymentType: /Principal\s*&\s*Interest/i.test(rows.map((item) => item.text).join(" ")) ? "Principal & Interest" : "",
          interestRate: scenarioFieldPercent(rows, new RegExp(`^Actual_Interest_Rate_${splitNumber === 1 ? "S1" : `L${splitNumber - 1}`}$`, "i")) || scenarioFieldPercent(rows, new RegExp(`^Actual_Interest_Rate_S${splitNumber}$`, "i")),
          term: scenarioFieldValue(rows, new RegExp(`^${splitNumber === 1 ? "S1TermYears" : "TermYears"}$`, "i"))
            || scenarioFieldValue(rows, new RegExp(`^Term YearsS${splitNumber}$`, "i")),
          note: splitNumber === 1 ? "Existing loan" : ""
        });
      });
      return splits.filter((split) => split.amount || split.product || split.interestRate);
    }

    function parseScenarioMoneyAfter(rows, pattern, options = {}) {
      const row = rows.find((candidate) => pattern.test(candidate.text) && /\$[\d,]+(?:\.\d+)?/.test(candidate.text));
      if (!row) return "";
      const after = row.text.slice(Math.max(0, row.text.search(pattern)));
      const matches = after.match(/\$[\d,]+(?:\.\d+)?/g) || [];
      const chosen = options.last ? matches[matches.length - 1] : matches[0];
      return chosen ? normalizeScenarioMoney(chosen) : "";
    }

    function parseScenarioPercentAfter(rows, pattern, options = {}) {
      const row = rows.find((candidate) => pattern.test(candidate.text) && /\d+(?:\.\d+)?%/.test(candidate.text));
      if (!row) return "";
      const after = row.text.slice(Math.max(0, row.text.search(pattern)));
      const matches = after.match(/\d+(?:\.\d+)?%/g) || [];
      const chosen = options.last ? matches[matches.length - 1] : matches[0];
      return chosen ? normalizePercent(chosen) : "";
    }

    function parseScenarioDeposit(rows, pattern) {
      const row = rows.find((candidate) => pattern.test(candidate.text) && /\$[\d,]+(?:\.\d+)?/.test(candidate.text));
      if (!row) return "";
      const money = row.text.match(/\$[\d,]+(?:\.\d+)?/g) || [];
      return money.length ? normalizeScenarioMoney(money[money.length - 1]) : "";
    }

    function applyLoanScenarioData(scenario) {
      if (scenario.clients.length) state.clients = scenario.clients;
      if (scenario.purpose) {
        state.purposes = [scenario.purpose];
        state.purpose = scenario.purpose;
      }
      if (scenario.referralSource) {
        state.referralSource = "Other";
        state.referralSourceOther = scenario.referralSource;
      }
      if (scenario.securityAddress) {
        state.securityAddress = scenario.securityAddress;
        state.absorbLandAddress = scenario.securityAddress;
        state.securities = state.securities?.length ? state.securities : [blankSecurity()];
        state.securities[0].address = scenario.securityAddress;
      }
      if (scenario.securityValue) {
        state.loanSecurityValue = normalizeCurrencyValue(scenario.securityValue);
        state.securityValue = state.loanSecurityValue;
        state.absorbLandValue = state.loanSecurityValue;
        state.securities = state.securities?.length ? state.securities : [blankSecurity()];
        state.securities[0].value = state.loanSecurityValue;
      }
      if (scenario.builderName) {
        const knownBuilder = ["Plantation Homes", "Coral Homes", "Orbit Homes", "Glenvill Homes"].find((name) => scenario.builderName.includes(name));
        state.builderName = knownBuilder || "Other";
        if (!knownBuilder) state.builderNameOther = scenario.builderName;
      }
      if (scenario.builderContractAmount) state.builderContractAmount = normalizeCurrencyValue(scenario.builderContractAmount);
      if (scenario.landPrice) state.landPrice = normalizeCurrencyValue(scenario.landPrice);
      updatePrimaryLoan({
        purpose: scenario.purpose || state.purpose,
        loanAmount: scenario.loanAmount ? normalizeCurrencyValue(scenario.loanAmount) : state.loanAmount,
        loanSecurityValue: scenario.securityValue ? normalizeCurrencyValue(scenario.securityValue) : state.loanSecurityValue,
        lmi: scenario.lmi ? normalizeCurrencyValue(scenario.lmi) : state.lmi,
        baseLvr: scenario.baseLvr ? normalizePercent(scenario.baseLvr) : state.baseLvr,
        postCapLvr: scenario.postCapLvr ? normalizePercent(scenario.postCapLvr) : state.postCapLvr,
        lender: scenario.lender ? lenderForName(scenario.lender)?.name || scenario.lender : state.lender,
        product: scenario.product || state.product,
        interestRate: scenario.interestRate ? normalizePercent(scenario.interestRate) : state.interestRate,
        repaymentType: scenario.repaymentType || state.repaymentType,
        splits: scenario.splits?.length ? scenario.splits : state.loans?.[0]?.splits
      });
      if (scenario.conveyancer) {
        state.securityConveyancer = scenario.conveyancer;
        state.conveyancer = scenario.conveyancer;
        state.absorbLandConveyancer = scenario.conveyancer;
      }
      if (scenario.settlementText) state.clientNotes = [state.clientNotes, `Settlement Date: ${scenario.settlementText}`].filter(Boolean).join("\n");
      if (scenario.landDepositsPaid) state.contributionLandDeposit = normalizeCurrencyValue(scenario.landDepositsPaid);
      if (scenario.builderDepositsPaid) state.contributionBuilderDeposit = normalizeCurrencyValue(scenario.builderDepositsPaid);
      if (scenario.contributionTotal) {
        state.notesForTeam = [
          state.notesForTeam,
          `Imported total applicant contribution: ${normalizeCurrencyValue(scenario.contributionTotal)}. Confirm savings/equity breakdown manually.`
        ].filter(Boolean).join("\n");
      }
      if (scenario.clientContributionText) state.notesForTeam = [state.notesForTeam, `Applicant contribution notes: ${scenario.clientContributionText}`].filter(Boolean).join("\n");
      syncContributionFromDeposits();
      syncLinkedSecurityValue();
    }

    async function parseQuickliPdf(file) {
      const rows = await extractPdfRows(file);
      const structuredRows = quickliRowsWithoutNotes(rows);
      const parsed = {
        clients: parseQuickliApplicants(structuredRows),
        dependantsDetails: parseQuickliDependants(structuredRows),
        liabilities: parseQuickliPersonalLiabilities(structuredRows),
        hecsDebtDetails: "",
        securities: [],
        proposedLoans: [],
        favouriteResults: [],
        results: [],
        favouriteLender: "",
        loanAmount: "",
        lvr: "",
        livingExpenses: "",
        importedCount: 0
      };

      parsed.proposedLoans = parseQuickliProposedLoans(structuredRows);
      const logoResults = await detectQuickliResultLogos(file, rows);
      parsed.favouriteResults = logoResults.filter((result) => result.section === "Favourite Results");
      parsed.results = logoResults.filter((result) => result.section === "Results");
      parsed.favouriteLender = parsed.favouriteResults.find((result) => result.lender)?.lender || "";
      parsed.securities = parseQuickliProperties(structuredRows);
      parsed.hecsDebtDetails = parseQuickliHecsDetails(structuredRows, parsed.clients);
      const proposed = parsed.proposedLoans[0] || {};
      parsed.loanAmount = proposed.loanAmount || "";
      parsed.lvr = proposed.lvr || "";
      parsed.livingExpenses = parseQuickliLivingExpenses(structuredRows);
      parsed.importedCount = [
        parsed.clients.length,
        parsed.dependantsDetails,
        parsed.liabilities.length,
        parsed.hecsDebtDetails,
        parsed.securities.length,
        parsed.proposedLoans.length,
        parsed.favouriteLender,
        parsed.livingExpenses
      ].filter(Boolean).length;
      return parsed;
    }

    async function detectQuickliResultLogos(file, rows) {
      const candidates = quickliLogoCandidateRows(rows);
      if (!candidates.length) return [];
      try {
        const signatures = await quickliLenderSignatures();
        if (!signatures.length) return candidates;
        const pdfjsLib = await import("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs");
        pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";
        const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
        const pageCanvases = new Map();
        const scale = 2;
        const withMatches = [];
        for (const candidate of candidates) {
          if (!pageCanvases.has(candidate.pageNumber)) {
            const page = await pdf.getPage(candidate.pageNumber);
            const viewport = page.getViewport({ scale });
            const canvas = document.createElement("canvas");
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
            pageCanvases.set(candidate.pageNumber, { canvas, viewport, pageHeight: viewport.height / scale });
          }
          const pageInfo = pageCanvases.get(candidate.pageNumber);
          const fingerprint = quickliFingerprintFromCanvas(pageInfo.canvas, {
            x: 30 * scale,
            y: (pageInfo.pageHeight - candidate.y - 17) * scale,
            w: 95 * scale,
            h: 30 * scale
          });
          const textLender = quickliLenderFromRowText(candidate);
          const visualLender = quickliLenderFromVisualFingerprint(fingerprint);
          const match = textLender
            ? { lender: textLender, score: 0, confidence: 1 }
            : visualLender
              ? { lender: visualLender, score: 0, confidence: 0.95 }
              : matchQuickliLenderFingerprint(fingerprint, signatures);
          withMatches.push({
            ...candidate,
            lender: match?.lender || "",
            matchScore: match?.score ?? null,
            confidence: match?.confidence ?? 0
          });
        }
        return withMatches;
      } catch (error) {
        console.warn("Quickli logo detection skipped", error);
        return candidates;
      }
    }

    function quickliLogoCandidateRows(rows) {
      const favouriteStart = findExactSectionIndex(rows, "Favourite Results");
      const resultsStart = findExactSectionIndex(rows, "Results", Math.max(0, favouriteStart + 1));
      const end = findExactSectionIndex(rows, "Applicants", Math.max(0, resultsStart + 1));
      const candidates = [];
      const addRows = (section, from, to) => {
        if (from === -1) return;
        rows.slice(from + 1, to === -1 ? undefined : to).forEach((row, index) => {
          if (!quickliLooksLikeResultRow(row)) return;
          candidates.push({ section, rowIndex: index, pageNumber: row.pageNumber, y: row.y, text: row.text });
        });
      };
      addRows("Favourite Results", favouriteStart, resultsStart);
      addRows("Results", resultsStart, end);
      return candidates;
    }

    function quickliLooksLikeResultRow(row) {
      const text = String(row.text || "");
      const hasServicingNumbers = /\$[\d,]+(?:\.\d+)?/.test(text) && /\d+(?:\.\d+)?%/.test(text);
      const hasPolicyMessage = /Loan \d+ amount is too low|does not offer|New Calc update|cannot both be/i.test(text);
      return (hasServicingNumbers || hasPolicyMessage) && row.items?.some((item) => item.x >= 140);
    }

    function quickliLenderFromRowText(row) {
      const first = (row.items || []).find((item) => item.x < 125);
      if (!first) return "";
      return lenderForName(first.text)?.name || "";
    }

    function quickliLenderFromVisualFingerprint(fingerprint) {
      if (!fingerprint) return "";
      if (fingerprint.orangeRatio > 0.18 && fingerprint.darkRatio > 0.01) return "Bankwest";
      return "";
    }
