        state.purposes = nextPurposes.length ? nextPurposes : [""];
        state.purpose = state.purposes.find(Boolean) || "";
      }

      const loanInputs = Array.from(document.querySelectorAll("[data-loan-index][data-loan-key]"));
      if (loanInputs.length) {
        const activeId = activeIdOverride || document.activeElement?.id || "";
        const nextLoans = [];
        loanInputs.forEach((input) => {
          const index = Number(input.dataset.loanIndex);
          const key = input.dataset.loanKey;
          nextLoans[index] = nextLoans[index] || blankLoan({ splits: [] });
          const rawValue = input.type === "checkbox" ? input.checked : input.value.trim();
          nextLoans[index][key] = ["loanAmount", "loanSecurityValue", "lmi"].includes(key)
            ? normalizeCurrencyValue(rawValue)
            : ["baseLvr", "postCapLvr", "interestRate"].includes(key)
              ? normalizePercent(rawValue)
              : key === "purpose"
                ? normalizePurpose(rawValue)
                : rawValue;
        });
        Array.from(document.querySelectorAll("[data-loan-flag]")).forEach((input) => {
          const index = Number(input.dataset.loanIndex);
          nextLoans[index] = nextLoans[index] || blankLoan({ splits: [] });
          nextLoans[index][input.dataset.loanFlag] = input.checked;
        });
        Array.from(document.querySelectorAll("[data-loan-preapproval]")).forEach((input) => {
          const index = Number(input.dataset.loanIndex);
          nextLoans[index] = nextLoans[index] || blankLoan({ splits: [] });
          nextLoans[index].preApproval = input.checked;
          if (input.checked) {
            nextLoans[index].approvalRequested = "Pre-Approval";
          } else if (nextLoans[index].approvalRequested === "Pre-Approval") {
            nextLoans[index].approvalRequested = "Formal";
          }
        });
        Array.from(document.querySelectorAll("[data-loan-security-link]")).forEach((input) => {
          const loanIndex = Number(input.dataset.loanIndex);
          const securityIndex = Number(input.dataset.loanSecurityLink);
          nextLoans[loanIndex] = nextLoans[loanIndex] || blankLoan({ splits: [] });
          nextLoans[loanIndex].securityIds = nextLoans[loanIndex].securityIds || [];
          nextLoans[loanIndex].securityLinksTouched = true;
          if (input.checked && !nextLoans[loanIndex].securityIds.includes(securityIndex)) {
            nextLoans[loanIndex].securityIds.push(securityIndex);

        });
        Array.from(document.querySelectorAll("[data-loan-security-component-link]")).forEach((input) => {
          const loanIndex = Number(input.dataset.loanIndex);
          const link = input.dataset.loanSecurityComponentLink;
          nextLoans[loanIndex] = nextLoans[loanIndex] || blankLoan({ splits: [] });
          nextLoans[loanIndex].securityLinks = nextLoans[loanIndex].securityLinks || [];
          nextLoans[loanIndex].securityLinksTouched = true;
          if (input.checked && !nextLoans[loanIndex].securityLinks.includes(link)) {
            nextLoans[loanIndex].securityLinks.push(link);

        nextLoans.forEach((loan) => {
          normalizeLoanSecuritySelections(loan);

        Array.from(document.querySelectorAll("[data-split-index][data-split-key]")).forEach((input) => {
          const loanIndex = Number(input.dataset.loanIndex);
          const splitIndex = Number(input.dataset.splitIndex);
          const key = input.dataset.splitKey;
          nextLoans[loanIndex] = nextLoans[loanIndex] || blankLoan({ splits: [] });
          nextLoans[loanIndex].splits[splitIndex] = nextLoans[loanIndex].splits[splitIndex] || blankSplit();
          nextLoans[loanIndex].splits[splitIndex][key] = key === "amount"
            ? normalizeCurrencyValue(input.value)
            : key === "interestRate"
              ? normalizePercent(input.value)
              : input.value.trim();
        });
        state.loans = nextLoans.map((loan, index) => {
          const existing = state.loans?.[index] || blankLoan();
          return calculateLoanLvr(normalizeLoan({ ...existing, ...loan, splits: loan.splits?.length ? loan.splits : existing.splits }), activeId, activeEventType);

        syncPrimaryLoanState();

      const securityInputs = Array.from(document.querySelectorAll("[data-security-index][data-security-key]"));
      if (securityInputs.length) {
        const nextSecurities = [];
        securityInputs.forEach((input) => {
          if ((input.type === "radio" || input.type === "checkbox") && !input.checked) return;
          const index = Number(input.dataset.securityIndex);
          const key = input.dataset.securityKey;
          nextSecurities[index] = nextSecurities[index] || blankSecurity();
          nextSecurities[index][key] = key === "boarder"
            ? input.checked
            : ["value", "weeklyIncome", "investmentExpense"].includes(key)
            ? normalizeCurrencyValue(input.value)
            : key === "expectedDate"
              ? normalizeMonthValue(input.value)
              : input.value.trim();
        });
        document.querySelectorAll("[data-security-mode]:checked").forEach((input) => {
          const index = Number(input.dataset.securityIndex);
          nextSecurities[index] = nextSecurities[index] || blankSecurity();
          nextSecurities[index].types = securityModeTypes(input.dataset.securityMode);
        });
        nextSecurities.forEach((security) => {
          security.types = normalizeSecurityTypes(security);
        });
        document.querySelectorAll("[data-security-component][data-security-component-key]").forEach((input) => {
          const index = Number(input.dataset.securityIndex);
          const component = input.dataset.securityComponent;
          const key = input.dataset.securityComponentKey;
          nextSecurities[index] = nextSecurities[index] || blankSecurity();
          nextSecurities[index][component] = nextSecurities[index][component] || (component === "build" ? blankBuildComponent() : blankLandComponent());
          const isCurrency = ["price", "depositsPaid", "contractAmount", "outOfContractItems"].includes(key);
          const isMonth = ["posDate", "expectedDate"].includes(key);
          nextSecurities[index][component][key] = isCurrency
            ? normalizeCurrencyValue(input.value)
            : isMonth
              ? normalizeMonthValue(input.value)
              : input.value.trim();
        });
        nextSecurities.forEach((security, index) => {
          if (activeIdOverride === `securityTransactionType${index}`) {
            security.contract = defaultContractForTransaction(security.transactionType);
          }
        });
        state.securities = nextSecurities.length ? nextSecurities.map(normalizeSecurity) : [blankSecurity()];
        syncLegacySecurityFieldsFromSecurities();
      }

      // Scoped to data-liability-key so the flag checkboxes, which share the index
      // attribute, do not write an "undefined" key onto every liability.
      const liabilityInputs = Array.from(document.querySelectorAll("[data-liability-index][data-liability-key]"));
      if (liabilityInputs.length) {
        const nextLiabilities = [];
        liabilityInputs.forEach((input) => {
          const index = Number(input.dataset.liabilityIndex);
          const key = input.dataset.liabilityKey;
          nextLiabilities[index] = nextLiabilities[index] || blankLiability();
          nextLiabilities[index][key] = ["limit", "owing", "repayment"].includes(key)
            ? normalizeCurrencyValue(input.value)
            : key === "rate"
              ? normalizePercent(input.value)
            : input.value.trim();
        });
        Array.from(document.querySelectorAll("[data-liability-flag]")).forEach((input) => {
          const index = Number(input.dataset.liabilityIndex);
          const key = input.dataset.liabilityFlag;
          nextLiabilities[index] = nextLiabilities[index] || blankLiability();
          nextLiabilities[index][key] = input.checked;
        });
        state.liabilities = nextLiabilities.length ? nextLiabilities : [blankLiability()];
      }
      const refinanceLiabilityInputs = Array.from(document.querySelectorAll("[data-refinance-liability-key]"));
      if (refinanceLiabilityInputs.length) {
        const nextRefinanceLiability = {
          ...blankLiability(),
          liability: "Loan being refinanced",
          beingRefinanced: true,
          ...(state.refinanceLiability || {})
        };
        refinanceLiabilityInputs.forEach((input) => {
          const key = input.dataset.refinanceLiabilityKey;
          nextRefinanceLiability[key] = ["limit", "owing", "repayment"].includes(key)
            ? normalizeCurrencyValue(input.value)
            : key === "rate"
              ? normalizePercent(input.value)
            : input.value.trim();
        });
        Array.from(document.querySelectorAll("[data-refinance-liability-flag]")).forEach((input) => {
          nextRefinanceLiability[input.dataset.refinanceLiabilityFlag] = input.checked;
        });
        state.refinanceLiability = normalizeLiabilityCurrency(nextRefinanceLiability);
      }

      const otherLenderInputs = Array.from(document.querySelectorAll("[data-other-lender-index]"));
      if (otherLenderInputs.length) {
        const nextOtherLenders = [];
        otherLenderInputs.forEach((input) => {
          const index = Number(input.dataset.otherLenderIndex);
          const key = input.dataset.otherLenderKey;
          nextOtherLenders[index] = nextOtherLenders[index] || { lender: "", product: "", reason: "" };
          nextOtherLenders[index][key] = input.value.trim();
        });
        state.otherLenders = nextOtherLenders;
      }
      document.querySelectorAll("[data-contribution-field]").forEach((input) => {
        if (input.type === "checkbox") {
          state[input.dataset.contributionField] = input.checked;
        } else {
          state[input.dataset.contributionField] = normalizeCurrencyValue(input.value);
        }
      });
      ensureDefaults();
    }

    function normalizePercent(value) {
      const trimmed = String(value || "").trim();
      if (!trimmed) return "";
      if (isNAValue(trimmed)) return "N/A";
      return /%/.test(trimmed) ? trimmed : `${trimmed}%`;
    }

    function normalizeCurrencyValue(value) {
      const trimmed = String(value || "").trim();
      if (!trimmed || isNAValue(trimmed)) return trimmed;
      const compact = trimmed.replace(/\s+/g, " ");
      const match = compact.match(/^(-?)\$?\s*([\d,]+(?:\.\d+)?)(?:\s*([kmb]))?(.*)$/i);
      if (!match) return compact;
      const [, sign, numeric, shorthand, suffix] = match;
      const multiplier = shorthand ? { k: 1000, m: 1000000, b: 1000000000 }[shorthand.toLowerCase()] : 1;
      const normalizedNumber = Number(numeric.replace(/,/g, "")) * multiplier;
      if (!Number.isFinite(normalizedNumber)) return compact;
      const formatted = normalizedNumber.toLocaleString("en-AU", {
        maximumFractionDigits: 2
      });
      return `${sign}$${formatted}${suffix || ""}`;
    }

    function currencyFieldIds() {
      return sections
        .flatMap((section) => section.fields)
        .filter((field) => field.format === "currency")
        .map((field) => field.id);
    }

    function normalizeLiabilityCurrency(item) {
      return {
        ...item,
        limit: normalizeCurrencyValue(item.limit),
        owing: normalizeCurrencyValue(item.owing),
        rate: normalizePercent(item.rate || ""),
        repayment: normalizeCurrencyValue(item.repayment)
      };
    }

        const label = document.querySelector(`[data-income-label="${index}"]`);

        const current = select.value;
        const firstClient = state.clients.find((client) => client.name)?.name || "";

        select.innerHTML = renderClientOptions(selected);

    function handleFundingPositionUpload(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      if (file.type === "application/pdf" || /\.pdf$/i.test(file.name || "")) {
        setFundingPositionFromPdf(file);
        importLoanScenarioPdf(file, { silentFailure: true });
        event.target.value = "";
        return;
      }
      if (!file.type.startsWith("image/")) {
        showToast("Please upload an image or PDF file.");
        return;
      }
      setFundingPositionFromImage(file);
      event.target.value = "";
    }

    async function copyFundingPositionFromClipboard() {
      if (!navigator.clipboard?.read) {
        showToast("Clipboard image access is not available in this browser.");
        return;
      }
      try {
        const items = await navigator.clipboard.read();
        for (const item of items) {
          const imageType = item.types.find((type) => type.startsWith("image/"));
          if (imageType) {
            const blob = await item.getType(imageType);
            setFundingPositionFromImage(blob);
            return;
          }
        }
        showToast("Clipboard does not contain an image.");
      } catch (error) {
        showToast("Could not read an image from clipboard.");
      }
    }

    function setFundingPositionFromImage(file) {
      const reader = new FileReader();
      reader.onload = () => {
        state.fundingPositionImage = String(reader.result || "");
        delete state.fundingPositionPdf;
        delete state.fundingPositionPdfName;
        render();
        saveDraft();
        showToast("Funding position uploaded.");
      };
      reader.readAsDataURL(file);
    }

    function setFundingPositionFromPdf(file) {
      const reader = new FileReader();
      reader.onload = () => {
        state.fundingPositionPdf = String(reader.result || "");
        state.fundingPositionPdfName = file.name || "funding-position.pdf";
        delete state.fundingPositionImage;
        render();
        saveDraft();
        showToast("PDF uploaded.");
      };
      reader.readAsDataURL(file);
    }

      delete state.fundingPositionImage;
      delete state.fundingPositionPdf;
      delete state.fundingPositionPdfName;
      const upload = document.getElementById("fundingPositionUpload");
      if (upload) upload.value = "";

      saveDraft();

      });

    function syncLoanCardCalculatedFields() {
      state.loans.forEach((loan, index) => {
        const showLmi = loanLmiApplies(loan);
        document.querySelectorAll(`[data-loan-lmi-field="${index}"]`).forEach((element) => {
          element.classList.toggle("is-hidden", !showLmi);
        });
        const lmiHint = document.querySelector(`[data-loan-lmi-hint="${index}"]`);
        if (lmiHint) lmiHint.textContent = loanLmiHint(loan);
        document.querySelector(`[data-loan-capitalised-row="${index}"]`)?.classList.toggle("is-hidden", Boolean(loan.depositScheme));
        const lmi = document.getElementById(`loan${index}Lmi`);
        if (lmi) {
          lmi.readOnly = Boolean(loan.depositScheme);
          if (document.activeElement !== lmi) lmi.value = loan.lmi || "";
        }
        const amount = document.getElementById(`loan${index}Amount`);
        const base = document.getElementById(`loan${index}BaseLvr`);
        const postCap = document.getElementById(`loan${index}PostCapLvr`);
        if (amount && document.activeElement !== amount) amount.value = loan.loanAmount || "";
        if (base && document.activeElement !== base) base.value = loan.baseLvr || "";
        if (postCap && document.activeElement !== postCap) postCap.value = loan.postCapLvr || "";
        loan.splits.forEach((split, splitIndex) => {
          const splitAmount = document.getElementById(`loan${index}Split${splitIndex}Amount`);
          if (splitAmount && document.activeElement !== splitAmount) splitAmount.value = split.amount || "";
        });

    const addressSearchTimers = {};

    function scheduleAddressSearch(input) {
      clearTimeout(addressSearchTimers[input.id]);
      const status = document.querySelector(`[data-address-status="${input.id}"]`);
      if (status) {
        status.textContent = input.value.trim().length >= 4 ? "Searching..." : "Type at least 4 characters to search.";
        status.classList.toggle("searching", input.value.trim().length >= 4);
      }
      addressSearchTimers[input.id] = setTimeout(() => searchAddress(input), 450);
    }

    async function searchAddress(input) {
      const query = input.value.trim();
      const box = document.querySelector(`[data-address-suggestions="${input.id}"]`);
      const status = document.querySelector(`[data-address-status="${input.id}"]`);
      if (!box || query.length < 4) {
        box?.classList.add("is-hidden");
        if (status) {
          status.textContent = query ? "Type at least 4 characters to search." : "";
          status.classList.remove("searching");
        }
        return;
      }
      try {
        const url = `https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=au&limit=5&q=${encodeURIComponent(query)}`;
        const response = await fetch(url, { headers: { "Accept": "application/json" } });
        const results = await response.json();
        box.innerHTML = results
          .map((result) => `<button class="address-suggestion" type="button" data-address-value="${escapeHtml(result.display_name)}">${escapeHtml(result.display_name)}</button>`)
          .join("");
        box.classList.toggle("is-hidden", !results.length);
        if (status) {
          status.textContent = results.length ? "Select an address below." : "No matches found.";
          status.classList.remove("searching");
        }
        box.querySelectorAll("[data-address-value]").forEach((button) => {
          button.addEventListener("click", () => {
            input.value = button.dataset.addressValue;
            if (input.dataset.securityComponent) {
              const index = Number(input.dataset.securityIndex);
              const component = input.dataset.securityComponent;
              const key = input.dataset.securityComponentKey;
              state.securities[index] = state.securities[index] || blankSecurity();
              state.securities[index][component] = state.securities[index][component] || (component === "build" ? blankBuildComponent() : blankLandComponent());
              state.securities[index][component][key] = button.dataset.addressValue;
            } else if (input.dataset.securityIndex) {
              const index = Number(input.dataset.securityIndex);
              state.securities[index] = state.securities[index] || blankSecurity();
              state.securities[index].address = button.dataset.addressValue;
            } else {
              state[input.id] = button.dataset.addressValue;
            }
            box.classList.add("is-hidden");
            if (status) status.textContent = "";
            collectAndUpdate();
          });
        });
      } catch (error) {
        box.classList.add("is-hidden");
        if (status) {
          status.textContent = "Address search unavailable.";
          status.classList.remove("searching");
        }
      }
    }

    function lenderMatches(query) {
      const normalized = normalizeLenderSearch(query);
      return normalized
        ? lenderOptions.filter((lender) => lenderSearchTerms(lender).some((term) => term.includes(normalized)))
        : lenderOptions;
    }

          input.value = button.dataset.lenderValue || "";

    function syncLenderInputState(input) {
      if (input.dataset.field) {
        state[input.dataset.field] = input.value.trim();
      }
      if (input.dataset.otherLenderIndex && input.dataset.otherLenderKey) {
        const index = Number(input.dataset.otherLenderIndex);
        if (!state.otherLenders[index]) state.otherLenders[index] = { lender: "", product: "", reason: "" };
        state.otherLenders[index][input.dataset.otherLenderKey] = input.value.trim();
      }
      syncLenderMark(input);
    }

    function syncLenderMarks() {
      document.querySelectorAll("[data-lender-search]").forEach((input) => syncLenderMark(input));
    }

    function syncLenderMark(input) {
      const wrap = input.closest(".lender-wrap");
      const mark = wrap?.querySelector("[data-lender-mark]");
      if (!mark) return;
      wrap.classList.toggle("has-logo", Boolean(lenderForName(input.value.trim())?.logo));
      mark.outerHTML = renderLenderMark(input.value.trim());
    }

    function updateSecurityPreApprovalVisibility() {
      document.querySelector(".security-address-field")?.classList.toggle("is-preapproval", securityPreApprovalSelected());
    }

    function updateConditionalVisibility() {
      document.querySelectorAll("[data-conditional-source]").forEach((element) => {
        if (element.dataset.otherDetail) {
          const id = element.dataset.otherDetail;
          const expected = element.dataset.conditionalValue;
          const actual = state[id];
          const matches = Array.isArray(actual) ? actual.includes(expected) : actual === expected;
          element.classList.toggle("is-hidden", !matches);
          return;
        }
        const field = fieldById(element.dataset.conditionalField || "");
        const matches = field ? conditionalMatches(field) : false;
        element.classList.toggle("is-hidden", !matches);
      });
    }

    function updateSectionVisibility() {
      let visibleIndex = 1;
      orderedSections().forEach((section) => {
        const visible = sectionIsVisible(section);
        document.getElementById(`section-${section.id}`)?.classList.toggle("is-hidden", !visible);
        const step = document.querySelector(`[data-step-section="${section.id}"]`);
        step?.classList.toggle("is-hidden", !visible);
        if (visible) {
          const index = document.querySelector(`[data-step-index="${section.id}"]`);
          if (index) index.textContent = String(visibleIndex);
          visibleIndex += 1;
        }
      });
      if (!document.querySelector(".step.active:not(.is-hidden)")) {
        document.querySelector(".step:not(.is-hidden)")?.classList.add("active");
      }
    }

    function securityNestedMode() {
      return sections.some((section) => section.nestedUnder === "security" && sectionIsVisible(section));
    }

    function sectionIsVisible(section) {
      if (!section.showWhen) return true;
      const showLand = anySecurityHasType("land");
      const showAbsorbLand = hasPurpose("ALC (Refinance Land & Construction)");
      const showBuild = anySecurityHasType("construction");
      if (section.showWhen.type === "landBuild") return showLand && !showAbsorbLand;
      if (section.showWhen.type === "buildLoan") return showBuild;
      if (section.showWhen.type === "absorbLand") return showLand && showAbsorbLand;
      if (section.showWhen.type === "notLandBuild") return true;
      return true;
    }

    function sectionDisplayTitle(section) {
      const showLand = anySecurityHasType("land");
      const showAbsorbLand = hasPurpose("ALC (Refinance Land & Construction)");
      if (showLand && showAbsorbLand) {
        if (section.id === "land") return "Land Purchase";
        if (section.id === "absorbLand") return "Land Security";
      }
      return section.title;
    }

    function valueFor(field) {
      if (field.type === "clientRepeater") {
        return state.clients
          .map((client) => {
            if (!client.name) return "";
            const details = [
              client.household ? `Household: ${client.household}` : "",
              client.relationship ? `Relationship: ${client.relationship}` : "",
              client.postcode ? `Postcode: ${client.postcode}` : "",
              client.citizenship ? `Citizenship: ${client.citizenship}` : "",
              client.visaVevoHeld ? "VISA/VEVO held" : ""
            ].filter(Boolean);
            return details.length ? `${client.name} (${details.join("; ")})` : client.name;
          })
          .filter(Boolean)
          .join(", ");
      }
      if (field.type === "purposeRepeater") {
        const purposes = selectedPurposes();
        if (purposes.length <= 1) return purposes[0] || "";
        return purposes.map((purpose, index) => `Loan ${index + 1} Purpose: ${purpose}`).join("\n");
      }
      if (field.type === "incomeRepeater") {
        return state.clients
          .map((client, index) => {
            if (!client.income) return "";
            const name = client.name || "";
            return name ? `${name}: ${client.income}` : client.income;
          })
          .filter(Boolean)
          .join("\n");
      }
      if (field.type === "liabilityRepeater") {
        const liabilities = isRefinancePurpose()
          ? [state.refinanceLiability, ...state.liabilities]
          : state.liabilities;
        return liabilities
          .map((item) => formatLiability(item))
          .filter(Boolean)
          .join("\n");
      }
      if (field.type === "securityRepeater") {
        return state.securities
          .map((security, index) => formatSecurity(security, index))
          .filter(Boolean)
          .join("\n");
      }
      if (field.type === "otherLenderRepeater") {
        if (checkboxHasValue("otherLendersComparisonCompleted", "Completed in Broker Engine Product Comparison")) return "";
        return state.otherLenders
          .map((item) => formatOtherLender(item))
          .filter(Boolean)
          .join("\n");
      }
      if (field.type === "loanStructureRepeater") {
        return formatLoanStructureNotes();
      }
      if (field.type === "fundingPositionPreview") {
        return state.fundingPositionImage || state.fundingPositionPdf ? (state.fundingPositionPdfName || "Uploaded file") : "";
      }
      if (field.type === "lenderProductPair") {
        return [state.lender, state.product].filter(Boolean).join(" - ");
      }
      if (field.type === "contributionButton") {
        return contributionSummary().filter((line) => line !== "Click to enter contribution").join("\n");
      }
      const raw = state[field.id];
      if (field.type === "month" || field.format === "month") {
        return formatMonthDisplay(raw);
      }
      if (Array.isArray(raw)) {
        const values = raw.map((item) => item === field.other && state[`${field.id}Other`] ? state[`${field.id}Other`] : item);
        return values.filter(Boolean).join(", ");
      }
      if (raw === field.other && state[`${field.id}Other`]) {
        return state[`${field.id}Other`];
      }
      return raw || "";
    }

    function formatLiability(item) {
      const parts = [];
      if (item.liability) parts.push(item.liability);
      if (item.limit) parts.push(`Limit ${item.limit}`);
      if (item.owing) parts.push(`Owing ${item.owing}`);
      if (item.rate) parts.push(`Rate ${item.rate}`);
      if (item.repayment) parts.push(`${item.repayment}`);
      if (item.beingRefinanced) parts.push("Consolidated in loan");
      if (item.beingClosed) parts.push("Closed before approval");
      return parts.join(" - ");
    }

    function formatSecurity(security, index) {
      const parts = [];
      parts.push(`Security ${index + 1}`);
      if (security.address) parts.push(security.address);
      if (security.value) parts.push(security.value);
      if (security.propertyPurpose) parts.push(`Property Purpose: ${security.propertyPurpose}`);
      if (security.propertyPurpose === "Owner Occupied" && security.boarder) parts.push("Boarder: Yes");
      if (security.transactionType) parts.push(`Transaction Type: ${security.transactionType}`);
      if (securityShowsWeeklyIncome(security) && security.weeklyIncome) parts.push(`Weekly Income: ${security.weeklyIncome}`);
      if (securityShowsInvestmentExpense(security) && security.investmentExpense) parts.push(`Investment Expense: ${security.investmentExpense}`);
      if (securityHasType(security, "established")) {
        if (security.valuation) parts.push(`Valuation: ${valuationDisplay(security.valuation, security.valuationOther)}`);
        if (security.contract) parts.push(`Contract: ${security.contract}`);
        if (security.expectedDate) parts.push(`Expected: ${formatMonthDisplay(security.expectedDate)}`);
        if (security.conveyancer) parts.push(`Conveyancer: ${security.conveyancer}`);
      }
      const landParts = securityHasType(security, "land") ? formatSecurityLandComponent(security.land) : "";
      if (landParts) parts.push(`Land: ${landParts}`);
      const buildParts = securityHasType(security, "construction") ? formatSecurityBuildComponent(security.build) : "";
      if (buildParts) parts.push(`Construction: ${buildParts}`);
      if ((securityHasType(security, "land") || securityHasType(security, "construction")) && security.settlementTimelines) {
        parts.push(`Settlement Conditions / Plan of Subdivision Timelines: ${security.settlementTimelines.replace(/\n+/g, "; ")}`);
      }
      const linkedLoans = state.loans
        .map((loan, loanIndex) => {
          const whole = (loan.securityIds || []).includes(index);
          const components = (loan.securityLinks || [])
            .filter((link) => String(link).startsWith(`${index}:`))
            .map((link) => String(link).endsWith(":build") ? "build" : "land");
          if (whole) return `Loan ${loanIndex + 1} whole security`;
          if (components.length) return `Loan ${loanIndex + 1} ${components.join(" + ")}`;
          return "";
        })
        .filter(Boolean)
        .join(", ");
      if (linkedLoans) parts.push(`Linked loans: ${linkedLoans}`);
      return parts.length > 1 ? parts.join(" - ") : "";
    }

    function formatSecurityLandComponent(land = {}) {
      const parts = [];
      if (land.estate) parts.push(land.estate);
      if (land.price) parts.push(land.price);
      if (land.depositsPaid) parts.push(`Deposit ${land.depositsPaid}`);
      if (land.depositReceipt) parts.push(`Deposit receipt: ${land.depositReceipt}`);
      if (land.posDate) parts.push(`POS: ${formatMonthDisplay(land.posDate)}`);
      if (land.valuation) parts.push(`Valuation: ${valuationDisplay(land.valuation, land.valuationOther)}`);
      if (land.contract) parts.push(`Contract: ${land.contract}`);
      if (land.expectedDate) parts.push(`Expected: ${formatMonthDisplay(land.expectedDate)}`);
      if (land.conveyancer) parts.push(`Conveyancer: ${land.conveyancer}`);
      return parts.join(" - ");
    }

    function formatSecurityBuildComponent(build = {}) {
      const parts = [];
      if (build.builderName) parts.push(build.builderName);
      if (build.contractAmount) parts.push(build.contractAmount);
      if (build.outOfContractItems) parts.push(`Out of contract items: ${build.outOfContractItems}`);
      if (build.outOfContractDetails) parts.push(`Out of contract details: ${build.outOfContractDetails}`);
      if (build.depositsPaid) parts.push(`Deposit ${build.depositsPaid}`);
      if (build.depositReceipt) parts.push(`Deposit receipt: ${build.depositReceipt}`);
      if (build.siteStart) parts.push(`Site start: ${build.siteStart}`);
      if (build.valuation) parts.push(`Valuation: ${valuationDisplay(build.valuation, build.valuationOther)}`);
      if (build.expectedDate) parts.push(`Expected: ${formatMonthDisplay(build.expectedDate)}`);
      if (build.contract) parts.push(`Contract: ${build.contract}`);
      return parts.join(" - ");
    }

    function formatOtherLender(item) {
      const parts = [];
      if (item.lender) parts.push(item.lender);
      if (item.product) parts.push(item.product);
      if (item.reason) parts.push(item.reason);
      return parts.join(" - ");
    }

    function formatLoanStructureNotes() {
      return state.loans
        .map((loan, index) => formatLoanNotes(loan, index))
        .filter(Boolean)
        .join("\n");
    }

    function formatLoanNotes(loan, index) {
      const parts = [];
      if (loan.purpose) parts.push(`Purpose: ${loan.purpose}`);
      if (loan.lender) parts.push(`Lender: ${loan.lender}`);
      if (loan.product) parts.push(`Product: ${loan.product}`);
      if (loan.loanAmount) parts.push(`Base Loan: ${loan.loanAmount}`);
      if (linkedSecuritySummary(loan)) parts.push(`Linked Securities: ${linkedSecuritySummary(loan)}`);
      if (loan.loanSecurityValue) parts.push(`Security Value: ${loan.loanSecurityValue}`);
      if (loan.baseLvr) parts.push(`Base LVR: ${loan.baseLvr}`);
      if (loanLmiApplies(loan) && loanPrintLmiValue(loan)) parts.push(`LMI: ${loanPrintLmiValue(loan)}`);
      if (loanLmiApplies(loan) && loan.postCapLvr) parts.push(`Post Cap LVR: ${loan.postCapLvr}`);
      if (loan.depositScheme) parts.push("5% Deposit Scheme: Yes");
      if (loan.pricingStatus) parts.push(`Pricing: ${loan.pricingStatus}`);
      if (loan.pricingNotes) parts.push(`Pricing Notes: ${loan.pricingNotes}`);
      if (loan.loanNote) parts.push(`Loan Note: ${loan.loanNote}`);
      if (loan.approvalRequested) {
        const subjectTo = loan.approvalRequested === "Conditional" && loan.approvalSubjectTo ? ` - Subject to: ${loan.approvalSubjectTo}` : "";
        parts.push(`Approval Requested: ${loan.approvalRequested}${subjectTo}`);
      }
      const splits = loan.splits
        .map((split, splitIndex) => formatSplitNotes(split, splitIndex))
        .filter(Boolean);
      if (splits.length) parts.push(`Splits: ${splits.join(" | ")}`);
      return parts.length ? `Loan ${index + 1}: ${parts.join(" | ")}` : "";
    }

    function formatSplitNotes(split, index) {
      const parts = [];
      if (split.amount) parts.push(split.amount);
      if (split.loanUse) parts.push(split.loanUse);
      if (split.product) parts.push(split.product);
      if (split.term) parts.push(`${split.term} yrs`);
      if (split.ioTerm) parts.push(`IO ${split.ioTerm} yrs`);
      if (split.interestRate) parts.push(split.interestRate);
      if (split.note) parts.push(split.note);
      return parts.length ? `Split ${index + 1} - ${parts.join(" - ")}` : "";
    }

    function buildNotes() {
      const lines = [];
      lines.push("PARA-BROKER NOTES");
      lines.push(`Generated: ${new Date().toLocaleString("en-AU", { dateStyle: "medium", timeStyle: "short" })}`);
      lines.push("");

      orderedSections().forEach((section) => {
        if (!sectionIsVisible(section)) return;
        if (securityNestedMode() && section.nestedUnder === "security") return;
        const sectionLines = [];
        if (section.id === "security" && checkboxHasValue("fhogRequired", "FHOG")) {
          sectionLines.push(`FHOG: ${yesWithDetails(state.fhog)}`);
        }
        section.fields.forEach((field) => {
          if (state.fundingPositionImage && ["loanStructure", "loanAmount", "loanSecurityValue", "baseLvr", "postCapLvr", "lmi", "clientContribution", "genuineSavings"].includes(field.id)) return;
          if (securityPreApprovalSelected() && field.id === "securityAddress") return;
          if (!conditionalMatches(field)) return;
          const value = valueFor(field);
          if (!value) return;
          if (isNAValue(value)) return;
          if (field.id === "fundingPositionPreview") {
            sectionLines.push(`Funding Position / Loan Scenario: ${value}`);
          } else if (field.id === "lenderProductPair") {
            if (state.lender) sectionLines.push(`Lender: ${state.lender}`);
            if (state.product) sectionLines.push(`Product: ${state.product}`);
          } else if (field.id === "shortSettlementNote") {
            sectionLines.push(value);
          } else if (field.id === "liabilities" || field.id === "otherLenders") {
            sectionLines.push(value);
          } else if (field.id === "loanStructure") {
            sectionLines.push(value);
          } else if (field.id === "clientNames") {
            sectionLines.push(`Applicants: ${value}`);
          } else if (field.id === "purpose") {
            if (selectedPurposes().length <= 1) {
              sectionLines.push(`Purpose: ${value}`);
            } else {
              sectionLines.push(value);
            }
          } else if (field.id === "dependants") {
            sectionLines.push(`Dependants: Yes${state.dependantsDetails ? `, ${state.dependantsDetails}` : ""}`);
          } else if (field.id === "dependantsDetails") {
            return;
          } else if (field.id === "securityPreApproval") {
            sectionLines.push("Pre-Approval: Yes");
          } else if (field.id === "clientIncome") {
            sectionLines.push(`Income: ${formatIncomeNotesValue()}`);
          } else if (field.id === "fhogRequired") {
            sectionLines.push(`FHOG: ${yesWithDetails(state.fhog)}`);
          } else if (field.id === "fhog") {
            return;
          } else if (field.id === "genuineSavings") {
            sectionLines.push(`Genuine Savings: ${state.genuineSavingsNotes ? `In OneDrive - ${state.genuineSavingsNotes}` : "In OneDrive"}`);
          } else if (field.id === "genuineSavingsNotes") {
            return;
          } else if (field.id === "cashback") {
            sectionLines.push(`Cashback: ${state.cashbackNotes ? yesWithDetails(state.cashbackNotes) : "Yes"}`);
          } else if (field.id === "cashbackNotes") {
            return;
          } else if (field.id === "depositScheme") {
            sectionLines.push("5% Deposit Scheme: Yes");
          } else if (field.id === "clientContribution") {
            sectionLines.push(`Applicant Contribution: ${value.replace(/\n+/g, " | ")}`);
          } else if (field.id === "hecsDebtRequired") {
            sectionLines.push(`HECS Debt: ${yesWithDetails(state.hecsDebt)}`);
          } else if (field.id === "hecsDebt") {
            return;
          } else if (field.id === "exitStrategyRequired") {
            sectionLines.push(`Exit Strategy Required: ${yesWithDetails(state.exitStrategy)}`);
          } else if (field.id === "exitStrategy") {
            return;
          } else if (field.id === "firstHomeBuyer") {
            sectionLines.push("First Home Buyer: Yes");
          } else if (field.id === "privateHealthInsurance") {
            sectionLines.push(`Private Health Insurance: ${state.privateHealthInsuranceAmount ? `Disclosed - ${state.privateHealthInsuranceAmount}` : "Disclosed"}`);
          } else if (field.id === "privateHealthInsuranceAmount") {
            return;
          } else if (field.id === "craaIssuesRequired") {
            sectionLines.push(`CCR Issues: ${yesWithDetails(state.craaIssues)}`);
          } else if (field.id === "craaIssues") {
            return;
          } else if (field.id === "otherLendersComparisonCompleted") {
            sectionLines.push("Broker Engine Product Comparison: Completed");
          } else if (field.id === "dischargeRequired") {
            sectionLines.push(`Discharge Required: ${yesWithDetails(state.dischargeTiming)}`);
          } else if (field.id === "dischargeTiming") {
            return;
          } else if (field.id === "approvalRequested" && value === "Conditional" && state.approvalSubjectTo) {
            sectionLines.push(`${field.label}: Conditional - Subject to: ${state.approvalSubjectTo}`);
          } else if (field.id === "approvalSubjectTo") {
            return;
          } else {
            sectionLines.push(`${field.label}: ${value}`);
          }
        });
        if (section.id === "clients" && state.preferredContact) {
          const applicantIndex = sectionLines.findIndex((line) => line.startsWith("Applicants:"));
          const preferredLine = `Preferred Contact: ${state.preferredContact}`;
          if (applicantIndex >= 0) sectionLines.splice(applicantIndex + 1, 0, preferredLine);
          else sectionLines.push(preferredLine);
        }
        if (sectionLines.length) {
          lines.push(sectionDisplayTitle(section).toUpperCase());
          lines.push(...sectionLines);
          lines.push("");
        }
      });

      if (lines.length <= 3) {
        lines.push("Complete the questionnaire to generate file notes.");
      }

      return lines.join("\n").trim();
    }

    function isNAValue(value) {
      return /^N\/A%?$/i.test(String(value || "").trim());
    }

    function formatIncomeNotesValue() {
      return state.clients
        .filter((client) => client.income && !isNAValue(client.income))
        .map((client) => `${client.name || "Applicant"}: ${client.income.replace(/\n+/g, "; ")}`)
        .join(" | ");
    }

    function yesWithDetails(details, separator = ": ") {
      const clean = String(details || "").trim();
      return clean ? `Yes${separator}${clean}` : "Yes";
    }

    function encodeStateTransferPayload() {
      const transferableState = { ...state };
      delete transferableState.fundingPositionImage;
      delete transferableState.fundingPositionPdf;
      return btoa(unescape(encodeURIComponent(JSON.stringify(transferableState))));
    }

    function decodeStateTransferPayload(payload) {
      return JSON.parse(decodeURIComponent(escape(atob(String(payload || "")))));
    }

    function progressFileName() {
      const applicantNames = (state.clients || [])
        .map((client) => client.name)
        .filter(Boolean)
        .join("-");
      const cleanName = String(applicantNames || "untitled")
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "")
        .slice(0, 70) || "untitled";
      const date = new Date().toISOString().slice(0, 10);
      return `loan-studio-para-broker-${cleanName}-${date}.lsnotes`;
    }

    function downloadJsonFile(payload, fileName) {
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const link = document.createElement("a");
      const url = URL.createObjectURL(blob);
      link.href = url;
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function downloadProgressFile() {
      collectAndUpdate();
      const progress = {
        app: "Loan Studio Para-Broker Wizard",
        version: 1,
        savedAt: new Date().toISOString(),
        state: { ...state }
      };
      downloadJsonFile(progress, progressFileName());
      saveDraft();
      showToast("Progress file saved.");
    }

    async function importProgressFile(file) {
      if (!file) return;
      try {
        const text = await file.text();
        const parsed = JSON.parse(text);
        const importedState = parsed?.state && typeof parsed.state === "object" ? parsed.state : parsed;
        if (!importedState || typeof importedState !== "object" || Array.isArray(importedState)) {
          throw new Error("Invalid progress file");
        }
        Object.keys(state).forEach((key) => delete state[key]);
        Object.assign(state, importedState);
        activeSavedNoteId = state.savedNoteId || "";
        if (activeSavedNoteId) {
          localStorage.setItem("paraBrokerActiveSavedNoteId", activeSavedNoteId);
        } else {
          localStorage.removeItem("paraBrokerActiveSavedNoteId");
        }
        ensureDefaults();
        render();
        saveDraft();
        recordHistorySnapshot({ clearRedo: true, force: true });
        showToast("Progress file opened.");
      } catch (error) {
        console.error(error);
        showToast("Could not open that progress file.", 3600);
      }
    }

    function savedNotes() {
      try {
        const notes = JSON.parse(localStorage.getItem(savedNotesStorageKey) || "[]");
        return Array.isArray(notes) ? notes : [];
      } catch (error) {
        localStorage.removeItem(savedNotesStorageKey);
        return [];
      }
    }

    function writeSavedNotes(notes) {
      localStorage.setItem(savedNotesStorageKey, JSON.stringify(notes));
    }

    function stateForSavedNote() {
      const savedState = JSON.parse(JSON.stringify(state));
      delete savedState.fundingPositionImage;
      delete savedState.fundingPositionPdf;
      delete savedState.fundingPositionPdfName;
      return savedState;
    }

    function savedNoteTitle(noteState = state) {
      const applicants = (noteState.clients || [])
        .map((client) => client.name)
        .filter(Boolean)
        .join(" & ");
      const address = (noteState.securities || []).map((security) => security.address).find(Boolean) || noteState.securityAddress || "";
      return applicants || address || "Untitled note";
    }

    // A renamed note keeps its own title; everything else follows the applicant names.
    function titleForSavedNote(note, noteState = state) {
      return note?.customTitle?.trim() || savedNoteTitle(noteState);
    }

    // Values ensureDefaults() puts on a blank note, so they never count as content.
    const blankNoteDefaults = { shortSettlement: "No" };

    // Enough answers entered that discarding them would lose real work.
    function noteHasContent() {
      if ((state.clients || []).some((client) => client.name || client.income || client.incomeHtml)) return true;
      if ((state.securities || []).some((security) => security.address || security.value)) return true;
      if ((state.loans || []).some((loan) => loan.loanAmount || loan.lender || loan.loanSecurityValue)) return true;
      if ((state.liabilities || []).some((liability) => liability.liability || liability.limit)) return true;
      if (state.fundingPositionImage || state.fundingPositionPdf) return true;
      // Catches sections with no repeater of their own - referral source, VOI, assessor notes.
      return sections.some((section) => section.fields.some((field) => {
        const value = state[field.id];
        if (typeof value !== "string") return false;
        const trimmed = value.trim();
        return trimmed !== "" && trimmed !== blankNoteDefaults[field.id];
      }));
    }

    function savedNoteMeta(note) {
      const noteState = note.state || {};
      const applicants = (noteState.clients || []).map((client) => client.name).filter(Boolean).join(", ");
      const loanAmount = noteState.loans?.[0]?.loanAmount || noteState.loanAmount || "";
      const lender = noteState.loans?.[0]?.lender || noteState.lender || "";
      const updated = note.updatedAt
        ? new Date(note.updatedAt).toLocaleString("en-AU", { dateStyle: "medium", timeStyle: "short" })
        : "";
      return [applicants, lender, loanAmount, updated ? `Updated ${updated}` : ""].filter(Boolean).join(" - ");
    }

    function savedNoteSearchText(note) {
      const noteState = note.state || {};
      return [
        note.title,
        savedNoteMeta(note),
        noteState.securityAddress,
        ...(noteState.clients || []).map((client) => client.name),
        ...(noteState.securities || []).map((security) => security.address),
        ...(noteState.loans || []).map((loan) => [loan.lender, loan.product, loan.loanAmount, loan.purpose].filter(Boolean).join(" "))
      ].filter(Boolean).join(" ").toLowerCase();
    }

    function autosaveTime() {
      return new Date().toLocaleTimeString("en-AU", { hour: "numeric", minute: "2-digit" });
    }

    function updateAutosaveStatus(message = "Autosaved locally") {
      if (!autosaveStatus) return;
      autosaveStatus.classList.remove("is-saving");
      autosaveStatus.textContent = `${message} at ${autosaveTime()}`;
    }

    function markAutosavePending() {
      if (!autosaveStatus) return;
      autosaveStatus.classList.add("is-saving");
      autosaveStatus.textContent = activeSavedNoteId ? "Autosaving note..." : "Autosaving draft...";
    }

    function autosaveActiveSavedNote() {
      if (!activeSavedNoteId) return;
      const notes = savedNotes();
      const note = notes.find((item) => item.id === activeSavedNoteId);
      if (!note) {
        activeSavedNoteId = "";
        delete state.savedNoteId;
        localStorage.removeItem("paraBrokerActiveSavedNoteId");
        updateAutosaveStatus("Draft autosaved locally");
        return;
      }
      const now = new Date().toISOString();
      state.savedNoteId = note.id;
      note.title = titleForSavedNote(note);
      note.updatedAt = now;
      note.state = stateForSavedNote();
      note.state.savedNoteId = note.id;
      try {
        writeSavedNotes(notes);
        updateAutosaveStatus("Saved note autosaved");
      } catch (error) {
        console.error(error);
        if (autosaveStatus) {
          autosaveStatus.classList.add("is-saving");
          autosaveStatus.textContent = "Autosave failed";
        }
      }
    }

    function scheduleSavedNoteAutosave() {
      if (!activeSavedNoteId) return;
      markAutosavePending();
      clearTimeout(savedNoteAutosaveTimer);
      savedNoteAutosaveTimer = setTimeout(autosaveActiveSavedNote, 900);
    }

    function saveCurrentNoteInApp(options = {}) {
      collectAndUpdate();
      const now = new Date().toISOString();
      const notes = savedNotes();
      let note = activeSavedNoteId ? notes.find((item) => item.id === activeSavedNoteId) : null;
      if (!note) {
        note = {
          id: crypto.randomUUID ? crypto.randomUUID() : `note-${Date.now()}-${Math.random().toString(16).slice(2)}`,
          createdAt: now
        };
        notes.unshift(note);
      }
      note.title = titleForSavedNote(note);
      note.updatedAt = now;
      note.state = stateForSavedNote();
      note.state.savedNoteId = note.id;
      try {
        writeSavedNotes(notes);
        activeSavedNoteId = note.id;
        state.savedNoteId = note.id;
        localStorage.setItem("paraBrokerActiveSavedNoteId", note.id);
        saveDraft({ savedNote: false });
        updateAutosaveStatus("Saved note locally");
        if (options.show !== false) showToast(`Saved: ${note.title}`);
        return note;
      } catch (error) {
        console.error(error);
        if (options.show !== false) showToast("Could not save in app. Use Save File as a backup.", 4200);
        return null;
      }
    }

    function openSavedNote(noteId) {
      const note = savedNotes().find((item) => item.id === noteId);
      if (!note?.state) {
        showToast("Saved note not found.", 2600);
        return;
      }
      // Land any queued writes against the note we are leaving before swapping state.
      flushPendingSaves();
      Object.keys(state).forEach((key) => delete state[key]);
      Object.assign(state, JSON.parse(JSON.stringify(note.state)));
      activeSavedNoteId = note.id;
      state.savedNoteId = note.id;
      localStorage.setItem("paraBrokerActiveSavedNoteId", note.id);
      ensureDefaults();
      render();
      saveDraft({ savedNote: false });
      recordHistorySnapshot({ clearRedo: true, force: true });
      updateAutosaveStatus("Opened saved note");
      showToast(`Opened: ${note.title}`);
    }

    async function renameSavedNote(noteId) {
      const note = savedNotes().find((item) => item.id === noteId);
      if (!note) return false;
      const entered = await openRenameModal(note.title || "");
      if (entered === null) return false;
      // Re-read after the await; an autosave may have rewritten the library meanwhile.
      const notes = savedNotes();
      const target = notes.find((item) => item.id === noteId);
      if (!target) return false;
      const trimmed = entered.trim();
      // Clearing the name hands the title back to the applicant names.
      target.customTitle = trimmed;
      target.title = titleForSavedNote(target, target.state || {});
      target.updatedAt = new Date().toISOString();
      writeSavedNotes(notes);
      showToast(trimmed ? `Renamed to: ${target.title}` : `Name reset to: ${target.title}`);
      return true;
    }

      return new Promise((resolve) => {
        const backdrop = document.createElement("div");
        backdrop.className = "modal-backdrop";
        backdrop.innerHTML = `

              <button class="button primary" type="button" data-rename-confirm>Save name</button>
            </div>

        const input = backdrop.querySelector("[data-rename-input]");
        const finish = (value) => {
          document.removeEventListener("keydown", onKeyDown);
          backdrop.remove();
          resolve(value);
        };
        const onKeyDown = (event) => {
          if (event.key === "Escape") finish(null);
        };
        backdrop.querySelectorAll("[data-rename-cancel]").forEach((button) => {
          button.addEventListener("click", () => finish(null));
        });
        backdrop.querySelector("[data-rename-confirm]")?.addEventListener("click", () => finish(input.value));

    function deleteSavedNote(noteId) {
      const notes = savedNotes();
      const note = notes.find((item) => item.id === noteId);
      const next = notes.filter((item) => item.id !== noteId);
      writeSavedNotes(next);
      if (activeSavedNoteId === noteId) {
        activeSavedNoteId = "";
        delete state.savedNoteId;
        localStorage.removeItem("paraBrokerActiveSavedNoteId");
        updateAutosaveStatus("Draft autosaved locally");

      showToast(note ? `Deleted: ${note.title}` : "Saved note deleted.");

        version: 1,
        exportedAt: new Date().toISOString(),

        notes

    async function importSavedNotesLibrary(file) {
      if (!file) return;
      try {
        const text = await file.text();
        const parsed = JSON.parse(text);
        const incomingNotes = Array.isArray(parsed) ? parsed : parsed?.notes;
        if (!Array.isArray(incomingNotes)) throw new Error("Invalid saved notes library");
        const cleanIncoming = incomingNotes
          .filter((note) => note && typeof note === "object" && note.state && typeof note.state === "object")
          .map((note) => ({
            ...note,
            id: String(note.id || `note-${Date.now()}-${Math.random().toString(16).slice(2)}`),
            title: titleForSavedNote(note, note.state),
            updatedAt: note.updatedAt || note.createdAt || new Date().toISOString()
          }));
        if (!cleanIncoming.length) throw new Error("No saved notes in library");
        const merged = new Map(savedNotes().map((note) => [note.id, note]));
        cleanIncoming.forEach((note) => merged.set(note.id, note));
        const notes = Array.from(merged.values())
          .sort((a, b) => String(b.updatedAt || "").localeCompare(String(a.updatedAt || "")));
        writeSavedNotes(notes);
        if (!activeSavedNoteId && parsed?.activeSavedNoteId && notes.some((note) => note.id === parsed.activeSavedNoteId)) {
          activeSavedNoteId = parsed.activeSavedNoteId;
          localStorage.setItem("paraBrokerActiveSavedNoteId", activeSavedNoteId);
        }
        showToast(`${cleanIncoming.length} saved note${cleanIncoming.length === 1 ? "" : "s"} uploaded.`);
      } catch (error) {
        console.error(error);
        showToast("Could not upload that saved-notes file.", 3800);
      }
    }

        `Page: ${payload.page}`,
        `App version: ${payload.appVersion}`,
        `Browser: ${payload.browser}`
      ].join("\n");
    }

    async function copyFeedbackFallback(payload) {
      const text = feedbackBodyText(payload);
      try {
        await navigator.clipboard.writeText(text);
      } catch (error) {
        console.error(error);
      }
      const subject = encodeURIComponent(`Para-Broker Notes ${payload.type}: ${payload.title}`);
      const body = encodeURIComponent(text);
      window.location.href = `mailto:${feedbackEmail}?subject=${subject}&body=${body}`;
      showToast("Report copied and email opened.");
    }

    async function sendFeedbackReport(payload) {
      const encoded = new URLSearchParams({
        "form-name": "parabroker-feedback",
        ...payload
      });
      if (!/^https?:$/.test(window.location.protocol)) throw new Error("Netlify forms require a hosted page");
      const response = await fetch("/", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: encoded.toString()
      });
      if (!response.ok) throw new Error(`Feedback submission failed: ${response.status}`);
    }

      document.body.appendChild(backdrop);
      hydrateIcons();
    }

    function showWelcomeIfNeeded() {
      if (localStorage.getItem(welcomeSeenStorageKey)) return;
      if (welcomeDismissedThisSession) return;
      window.setTimeout(() => openWelcomeModal(), 350);
    }

    function buildPrintDocument(noteText) {
      const blocks = noteText.split(/\n\s*\n/).filter(Boolean);
      const headerLines = blocks.shift()?.split("\n") || ["PARA-BROKER NOTES"];
      const title = headerLines[0] || "PARA-BROKER NOTES";
      const generated = headerLines.find((line) => /^Generated:/i.test(line)) || "";
      const printSections = buildPrintSections();
      const sectionHtml = printSections.map(({ heading, rows }) => {
        // The heading travels with the first row so a page break can never orphan it.
        const rowHtml = rows.map((row) => renderPrintRow(row)).filter(Boolean);
        const [leadRow, ...restRows] = rowHtml;
        return `
          <section class="print-section">
            <div class="print-section-lead">
              <h2>${escapeHtml(toTitleCase(heading))}</h2>
              <div class="print-rows${restRows.length ? " print-rows-lead" : ""}">${leadRow || ""}</div>
            </div>
            ${restRows.length ? `<div class="print-rows print-rows-tail">${restRows.join("")}</div>` : ""}
          </section>
          ${heading === "LOAN" && state.fundingPositionImage ? `
            <section class="print-section print-funding-section">
              <h2>Funding Position</h2>
              <div class="print-funding-wrap">
                <img class="print-funding-image" src="${state.fundingPositionImage}" alt="Funding position">
              </div>
            </section>
          ` : ""}
        `;
      }).join("");
