    async function quickliLenderSignatures() {
      if (quickliLenderSignatureCache) return quickliLenderSignatureCache;
      const lendersWithLogos = lenderOptions.filter((lender) => lender.logo);
      const signatures = await Promise.all(lendersWithLogos.map(async (lender) => {
        const fingerprint = await quickliFingerprintFromImage(lender.logo);
        return fingerprint ? { lender: lender.name, fingerprint } : null;
      }));
      quickliLenderSignatureCache = signatures.filter(Boolean);
      return quickliLenderSignatureCache;
    }

    function quickliFingerprintFromImage(url) {
      return new Promise((resolve) => {
        const image = new Image();
        image.crossOrigin = "anonymous";
        image.onload = () => {
          const canvas = document.createElement("canvas");
          canvas.width = image.naturalWidth || 1;
          canvas.height = image.naturalHeight || 1;
          canvas.getContext("2d").drawImage(image, 0, 0);
          resolve(quickliFingerprintFromCanvas(canvas, { x: 0, y: 0, w: canvas.width, h: canvas.height }, true));
        };
        image.onerror = () => resolve(null);
        image.src = url;
      });
    }

    function matchQuickliLenderFingerprint(fingerprint, signatures) {
      if (!fingerprint || !fingerprint.outInk) return null;
      const ranked = signatures
        .map((signature) => ({
          lender: signature.lender,
          score: quickliFingerprintScore(fingerprint, signature.fingerprint)
        }))
        .sort((a, b) => a.score - b.score);
      const best = ranked[0];
      const next = ranked[1];
      if (!best) return null;
      const margin = next ? next.score - best.score : 99;
      if (best.score > 52 || margin < 14) return null;
      return {
        lender: best.lender,
        score: best.score,
        confidence: Math.max(0, Math.min(1, (90 - best.score + margin) / 90))
      };
    }

    function quickliFingerprintScore(a, b) {
      if (!a || !b) return 999;
      let mismatch = 0;
      let color = 0;
      let overlap = 0;
      let union = 0;
      for (let index = 0; index < a.vector.length; index += 5) {
        const aInk = a.vector[index];
        const bInk = b.vector[index];
        if (aInk || bInk) union += 1;
        if (aInk && bInk) {
          overlap += 1;
          color += Math.abs(a.vector[index + 1] - b.vector[index + 1])
            + Math.abs(a.vector[index + 2] - b.vector[index + 2])
            + Math.abs(a.vector[index + 3] - b.vector[index + 3]);
        }
        if (aInk !== bInk) mismatch += 1;
      }
      return (union ? (mismatch / union) * 100 : 100) + (overlap ? (color / overlap) * 3 : 100);
    }

    function quickliFingerprintFromCanvas(sourceCanvas, sourceRect, alphaMode = false) {
      const temp = document.createElement("canvas");
      temp.width = Math.max(1, Math.round(sourceRect.w));
      temp.height = Math.max(1, Math.round(sourceRect.h));
      const tempContext = temp.getContext("2d", { willReadFrequently: true });
      tempContext.drawImage(sourceCanvas, sourceRect.x, sourceRect.y, sourceRect.w, sourceRect.h, 0, 0, temp.width, temp.height);
      const data = tempContext.getImageData(0, 0, temp.width, temp.height).data;
      const background = alphaMode ? [255, 255, 255] : dominantQuickliBackground(data);
      let opaquePixels = 0;
      let orangePixels = 0;
      let darkPixels = 0;
      const isInk = (r, g, b, a) => {
        if (a < 20) return false;
        const max = Math.max(r, g, b);
        const min = Math.min(r, g, b);
        const lightness = (r + g + b) / 3;
        const saturation = max - min;
        const distance = Math.abs(r - background[0]) + Math.abs(g - background[1]) + Math.abs(b - background[2]);
        return alphaMode
          ? lightness < 245 && (lightness < 220 || saturation > 35)
          : lightness < 205 || (saturation > 70 && lightness < 245 && distance > 70);
      };

      let minX = temp.width;
      let minY = temp.height;
      let maxX = -1;
      let maxY = -1;
      for (let y = 0; y < temp.height; y += 1) {
        for (let x = 0; x < temp.width; x += 1) {
          const index = (y * temp.width + x) * 4;
          const r = data[index];
          const g = data[index + 1];
          const b = data[index + 2];
          const a = data[index + 3];
          if (a >= 120) {
            opaquePixels += 1;
            if (r > 210 && g > 80 && g < 175 && b < 80 && r - g > 55) orangePixels += 1;
            if (r < 70 && g < 70 && b < 70) darkPixels += 1;
          }
          if (!isInk(r, g, b, a)) continue;
          minX = Math.min(minX, x);
          minY = Math.min(minY, y);
          maxX = Math.max(maxX, x);
          maxY = Math.max(maxY, y);
        }
      }

      const output = document.createElement("canvas");
      output.width = 96;
      output.height = 48;
      const outputContext = output.getContext("2d", { willReadFrequently: true });
      outputContext.fillStyle = "#fff";
      outputContext.fillRect(0, 0, output.width, output.height);
      if (maxX >= minX) {
        const pad = 1;
        minX = Math.max(0, minX - pad);
        minY = Math.max(0, minY - pad);
        maxX = Math.min(temp.width - 1, maxX + pad);
        maxY = Math.min(temp.height - 1, maxY + pad);
        const trimWidth = maxX - minX + 1;
        const trimHeight = maxY - minY + 1;
        const scale = Math.min(88 / trimWidth, 40 / trimHeight);
        const drawWidth = trimWidth * scale;
        const drawHeight = trimHeight * scale;
        outputContext.drawImage(temp, minX, minY, trimWidth, trimHeight, (output.width - drawWidth) / 2, (output.height - drawHeight) / 2, drawWidth, drawHeight);
      }

      const outputData = outputContext.getImageData(0, 0, output.width, output.height).data;
      const vector = [];
      let outInk = 0;
      for (let index = 0; index < outputData.length; index += 4) {
        const ink = isInk(outputData[index], outputData[index + 1], outputData[index + 2], outputData[index + 3]) ? 1 : 0;
        if (ink) outInk += 1;
        vector.push(
          ink,
          Math.round(outputData[index] / 32),
          Math.round(outputData[index + 1] / 32),
          Math.round(outputData[index + 2] / 32),
          Math.round(outputData[index + 3] / 64)
        );
      }
      return {
        vector,
        outInk,
        orangeRatio: opaquePixels ? orangePixels / opaquePixels : 0,
        darkRatio: opaquePixels ? darkPixels / opaquePixels : 0
      };
    }

    function dominantQuickliBackground(data) {
      const counts = new Map();
      for (let index = 0; index < data.length; index += 4) {
        if (data[index + 3] < 200) continue;
        const key = `${data[index] >> 4},${data[index + 1] >> 4},${data[index + 2] >> 4}`;
        counts.set(key, (counts.get(key) || 0) + 1);
      }
      let best = "";
      let bestCount = 0;
      counts.forEach((count, key) => {
        if (count > bestCount) {
          best = key;
          bestCount = count;
        }
      });
      return best ? best.split(",").map((value) => (Number(value) << 4) + 8) : [255, 255, 255];
    }

    async function extractPdfRows(file) {
      const pdfjsLib = await import("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs");
      pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";

      const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
      const pages = [];
      for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber += 1) {
        const page = await pdf.getPage(pageNumber);
        const content = await page.getTextContent();
        const annotations = await page.getAnnotations({ intent: "display" });
        const items = content.items
          .map((item) => ({
            text: String(item.str || "").trim(),
            x: item.transform[4],
            y: item.transform[5]
          }))
          .filter((item) => item.text);
        const annotationRows = annotations
          .filter((annotation) => annotation.fieldName || annotation.fieldValue)
          .map((annotation, index) => {
            const fieldName = String(annotation.fieldName || "").trim();
            const fieldValue = annotation.fieldValue == null ? "" : String(annotation.fieldValue).trim();
            return {
              y: -1000 - index,
              items: [],
              text: `${fieldName} ${fieldValue}`.trim(),
              annotation: true,
              fieldName,
              fieldValue
            };
          })
          .filter((row) => row.text);
        pages.push({ pageNumber, rows: [...groupPdfRows(items), ...annotationRows] });
      }
      return pages.flatMap((page) => page.rows.map((row) => ({ ...row, pageNumber: page.pageNumber })));
    }

    function groupPdfRows(items) {
      const rows = [];
      items
        .sort((a, b) => b.y - a.y || a.x - b.x)
        .forEach((item) => {
          let row = rows.find((candidate) => Math.abs(candidate.y - item.y) < 4);
          if (!row) {
            row = { y: item.y, items: [] };
            rows.push(row);
          }
          row.items.push(item);
        });

      return rows
        .map((row) => {
          const sorted = row.items.sort((a, b) => a.x - b.x);
          return {
            y: row.y,
            items: sorted,
            text: sorted.map((item) => item.text).join(" ").replace(/\s+/g, " ").trim()
          };
        })
        .filter((row) => row.text);
    }

    function parseQuickliApplicants(rows) {
      const applicantsStart = findExactSectionIndex(rows, "Applicants");
      const applicantRows = applicantsStart === -1 ? rows : rows.slice(applicantsStart + 1);
      const nameRow = applicantRows.find((row) => /^Name\b/.test(row.text));
      if (!nameRow) return [];
      const incomeStartAfterApplicants = findExactSectionIndex(rows, "Income", applicantsStart + 1);
      const applicantDetailRows = applicantsStart === -1
        ? []
        : rows.slice(applicantsStart + 1, incomeStartAfterApplicants === -1 ? undefined : incomeStartAfterApplicants);
      const applicantColumns = nameRow.items.filter((item) => item.x > nameRow.items[0].x + 60);
      const names = applicantColumns.map((item) => item.text).filter(Boolean);
      const householdRow = applicantDetailRows.find((row) => /^Households?\b/i.test(row.text));
      const relationshipRow = applicantDetailRows.find((row) => /^Relationship\b/i.test(row.text));
      const postcodeRow = applicantDetailRows.find((row) => /^Postcode\b/i.test(row.text));
      const incomeRows = rowsBetweenExact(rows, "Income", "Properties and Rental Income", applicantsStart + 1);
      const incomeNameRow = incomeRows.find((row) => /^Name\b/.test(row.text));
      const columns = incomeNameRow
        ? incomeNameRow.items.filter((item) => item.x > incomeNameRow.items[0].x + 60)
        : applicantColumns.length
          ? applicantColumns
          : names.map((name, index) => ({ text: name, x: 190 + (index * 155) }));
      const selfEmployedStart = incomeRows.findIndex((row) => /^Self Employed Income\b/i.test(row.text));
      const standardIncomeRows = selfEmployedStart === -1 ? incomeRows : incomeRows.slice(0, selfEmployedStart);
      const selfEmployedBlocks = parseQuickliSelfEmployedIncome(incomeRows, names);
      const ytdIncomeBlocks = parseQuickliYtdIncome(rows, applicantsStart);

      return names.map((name, index) => {
        const incomeLines = [];
        const currentColumn = columns[index];
        const nextColumn = columns[index + 1];
        const applicantColumn = applicantColumns[index];
        const nextApplicantColumn = applicantColumns[index + 1];
        standardIncomeRows.forEach((row) => {
          if (/^Name\b/.test(row.text) || /^\d+\s*\/\s*\d+$/.test(row.text) || /HECS|HELP/i.test(row.text)) return;
          const label = row.items
            .filter((item) => columns[0] && item.x < columns[0].x - 20)
            .map((item) => item.text)
            .join(" ")
            .trim();
          if (!label || !currentColumn) return;
          const cellValue = row.items
            .filter((item) => item.x >= currentColumn.x - 8 && (!nextColumn || item.x < nextColumn.x - 12))
            .map((item) => item.text)
            .join(" ")
            .trim();
          if (cellValue) incomeLines.push(`${label}: ${cellValue}`);
        });
        const selfEmployedIncome = selfEmployedBlocks
          .filter((block) => block.ownerNames.includes(normalizePersonNameForMatch(name)))
          .map((block) => block.lines.join("\n"));
        if (selfEmployedIncome.length) {
          if (incomeLines.length) incomeLines.push("");
          incomeLines.push(...selfEmployedIncome);
        }
        const ytdIncome = ytdIncomeBlocks
          .filter((block) => block.nameNorm === normalizePersonNameForMatch(name))
          .map((block) => block.lines.join("\n"));
        if (ytdIncome.length) {
          if (incomeLines.length) incomeLines.push("");
          incomeLines.push(...ytdIncome);
        }
        const income = incomeLines.join("\n");
        return {
          name,
          household: cellTextForColumn(householdRow, applicantColumn, nextApplicantColumn),
          relationship: cellTextForColumn(relationshipRow, applicantColumn, nextApplicantColumn),
          postcode: cellTextForColumn(postcodeRow, applicantColumn, nextApplicantColumn),
          income,
          incomeHtml: richIncomeHtmlFromPlainText(income)
        };
      });
    }

    function parseQuickliYtdIncome(rows, startAt = 0) {
      const start = findExactSectionIndex(rows, "YTD Income", startAt);
      if (start === -1) return [];
      const end = findExactSectionIndex(rows, "Income", start + 1);
      const ytdRows = rows.slice(start + 1, end === -1 ? undefined : end);
      const nameRow = ytdRows.find((row) => /^Name\b/i.test(row.text));
      const baseSalaryRow = ytdRows.find((row) => /^Base Salary\b/i.test(row.text));
      if (!nameRow || !baseSalaryRow) return [];

      const nameColumns = nameRow.items.filter((item) => item.x > nameRow.items[0].x + 60);
      const names = nameColumns.length
        ? nameColumns.map((item) => item.text).filter(Boolean)
        : [rowValueAfterLabel(nameRow)].filter(Boolean);
      if (!names.length) return [];

      return names.map((name, index) => {
        const column = nameColumns[index];
        const nextColumn = nameColumns[index + 1];
        const salaryText = column
          ? cellTextForColumn(baseSalaryRow, column, nextColumn)
          : rowValueAfterLabel(baseSalaryRow);
        const salary = normalizeQuickliYtdCurrency(salaryText || baseSalaryRow.text);
        if (!salary) return null;
        return {
          name,
          nameNorm: normalizePersonNameForMatch(name),
          lines: [
            `Base Salary: ${salary}`,
            "(Using YTD Income - see Quickli for breakdown)"
          ]
        };
      }).filter(Boolean);
    }

    function parseQuickliSelfEmployedIncome(incomeRows, applicantNames = []) {
      const starts = incomeRows
        .map((row, index) => /^Self Employed Income\b/i.test(row.text) ? index : -1)
        .filter((index) => index >= 0);
      return starts.map((start, blockIndex) => {
        const end = starts[blockIndex + 1] ?? incomeRows.length;
        const blockRows = incomeRows.slice(start + 1, end)
          .filter((row) => !/^\d+\s*\/\s*\d+$/.test(row.text));
        const entityRow = blockRows.find((row) => {
          return !/^Entity Type\b/i.test(row.text)
            && !/^Most Recent Year\b/i.test(row.text)
            && !/^Previous Year\b/i.test(row.text)
            && !/^Year Ended\b/i.test(row.text)
            && !/^Net Profit\b/i.test(row.text)
            && !/^Individual\s*\/\s*Directors Wages\b/i.test(row.text)
            && !/^Directors Wages\b/i.test(row.text)
            && !/^Addbacks\b/i.test(row.text)
            && !/^Percent Ownership\b/i.test(row.text)
            && !/^Calculation Method\b/i.test(row.text);
        });
        const entityName = entityRow?.text || "Self Employed Income";
        const entityTypeRow = blockRows.find((row) => /^Entity Type\b/i.test(row.text));
        const yearRow = blockRows.find((row) => /^Year Ended\b/i.test(row.text));
        const netProfitRow = blockRows.find((row) => /^Net Profit\b/i.test(row.text));
        const addbacksIndex = blockRows.findIndex((row) => /^Addbacks\b/i.test(row.text));
        const directorsWagesIndex = blockRows.findIndex((row) => /^Individual\s*\/\s*Directors Wages\b/i.test(row.text) || /^Directors Wages\b/i.test(row.text));
        const ownershipIndex = blockRows.findIndex((row) => /^Percent Ownership\b/i.test(row.text));
        const calculationRow = blockRows.find((row) => /^Calculation Method\b/i.test(row.text));
        const yearColumns = yearRow
          ? yearRow.items.filter((item) => item.x > yearRow.items[0].x + 60)
          : [];
        const yearlyValueRow = (row) => {
          return row.items.some((item) => yearColumns.some((column, index) => {
            const nextColumn = yearColumns[index + 1];
            return item.x >= column.x - 8 && (!nextColumn || item.x < nextColumn.x - 12);
          }));
        };
        const firstExistingIndex = (...indexes) => {
          return indexes.filter((index) => index >= 0).sort((a, b) => a - b)[0] ?? -1;
        };
        const addbacksEnd = firstExistingIndex(directorsWagesIndex, ownershipIndex);
        const addbackRows = addbacksIndex === -1
          ? []
          : blockRows.slice(addbacksIndex + 1, addbacksEnd === -1 ? undefined : addbacksEnd)
            .filter((row) => {
              return !/^Percent Ownership\b/i.test(row.text)
                && !/^Calculation Method\b/i.test(row.text)
                && !/^Individual\s*\/\s*Directors Wages\b/i.test(row.text)
                && !/^Directors Wages\b/i.test(row.text)
                && yearlyValueRow(row);
            });
        const directorsEnd = firstExistingIndex(ownershipIndex, calculationRow ? blockRows.indexOf(calculationRow) : -1);
        const directorsWageRows = directorsWagesIndex === -1
          ? []
          : blockRows.slice(directorsWagesIndex + 1, directorsEnd === -1 ? undefined : directorsEnd)
            .filter((row) => {
              return !/^Percent Ownership\b/i.test(row.text)
                && !/^Calculation Method\b/i.test(row.text)
                && yearlyValueRow(row);
            });
        const ownershipRows = ownershipIndex === -1
          ? []
          : blockRows.slice(ownershipIndex + 1, calculationRow ? blockRows.indexOf(calculationRow) : undefined);
        const ownership = ownershipRows
          .map((row) => {
            const ownerName = row.items[0]?.text || "";
            const percent = row.items.slice(1).map((item) => item.text).join(" ").match(/\d+(?:\.\d+)?%/)?.[0] || "";
            return ownerName && percent ? { name: ownerName, percent } : null;
          })
          .filter(Boolean);
        const ownerNames = ownership
          .filter(({ percent }) => parsePercentNumber(percent) > 0)
          .map(({ name }) => normalizePersonNameForMatch(name));
        if (!ownerNames.length) return null;

        const lines = [];
        lines.push(entityName);
        const entityType = rowValueAfterLabel(entityTypeRow);
        if (entityType) lines.push(`Entity Type: ${entityType}`);
        yearColumns.forEach((column, index) => {
          const nextColumn = yearColumns[index + 1];
          const labelBoundary = yearColumns[0]?.x ?? column.x;
          const year = cellTextForColumn(yearRow, column, nextColumn);
          if (!year) return;
          if (lines.length) lines.push("");
          lines.push(`Year Ended: ${year}`);
          const netProfit = cellTextForColumn(netProfitRow, column, nextColumn);
          if (netProfit) lines.push(`- Net Profit: ${netProfit}`);
          const addbacks = addbackRows
            .map((row) => {
              const label = row.items
                .filter((item) => item.x < labelBoundary - 20)
                .map((item) => item.text)
                .join(" ")
                .trim();
              const value = cellTextForColumn(row, column, nextColumn);
              return label && value ? `  - ${label}: ${value}` : "";
            })
            .filter(Boolean);
          if (addbacks.length) {
            lines.push("- Addbacks:");
            lines.push(...addbacks);
          }
          const directorsWages = directorsWageRows
            .map((row) => {
              const label = row.items
                .filter((item) => item.x < labelBoundary - 20)
                .map((item) => item.text)
                .join(" ")
                .trim();
              const value = cellTextForColumn(row, column, nextColumn);
              return label && value ? `  - ${label}: ${value}` : "";
            })
            .filter(Boolean);
          if (directorsWages.length) {
            lines.push("- Directors Wages:");
            lines.push(...directorsWages);
          }
        });
        const calculationMethod = rowValueAfterLabel(calculationRow).replace(/^Use\s+/i, "");
        if (calculationMethod) {
          if (lines.length) lines.push("");
          lines.push(`Calculation Method: ${calculationMethod}`);
        }
        if (ownership.length) {
          if (lines.length) lines.push("");
          lines.push("Ownership");
          ownership.forEach(({ name, percent }) => lines.push(`- ${name}: ${percent}`));
        }
        return { ownerNames, lines };
      }).filter(Boolean);
    }

    function rowValueAfterLabel(row) {
      if (!row || row.items.length < 2) return "";
      const labelX = row.items[0].x;
      return row.items
        .filter((item) => item.x > labelX + 60)
        .map((item) => item.text)
        .join(" ")
        .trim();
    }

    function normalizePersonNameForMatch(name) {
      return String(name || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
    }

    function normalizeQuickliYtdCurrency(value) {
      const amount = parseCurrencyNumber(value);
      if (!amount) return "";
      return `$${amount.toLocaleString("en-AU", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      })}`;
    }

    function parseQuickliDependants(rows) {
      const start = rows.findIndex((row) => /^Dependants\b/i.test(row.text));
      if (start === -1) return "";
      const end = rows.slice(start + 1).findIndex((row) => /^Postcode\b/i.test(row.text));
      const dependantRows = end === -1 ? rows.slice(start) : rows.slice(start, start + 1 + end);
      const ages = [];
      dependantRows.forEach((row) => {
        const ageMatches = row.text.match(/age\s+\d+/gi) || [];
        ageMatches.forEach((age) => {
          if (!ages.includes(age.toLowerCase())) ages.push(age.toLowerCase());
        });
      });
      if (!ages.length) return "";
      return `${ages.length} dependant${ages.length === 1 ? "" : "s"} (${ages.join(", ")})`;
    }

    function parseQuickliHecsDetails(rows, clients = []) {
      const applicantsStart = findExactSectionIndex(rows, "Applicants");
      const incomeRows = rowsBetweenExact(rows, "Income", "Properties and Rental Income", applicantsStart + 1);
      const incomeNameRow = incomeRows.find((row) => /^Name\b/.test(row.text));
      const columns = incomeNameRow
        ? incomeNameRow.items.filter((item) => item.x > incomeNameRow.items[0].x + 60)
        : clients.map((client, index) => ({ text: client.name, x: 190 + (index * 155) }));
      const hasDebtRow = incomeRows.find((row) => /Has HECS\s*\/\s*HELP Debt/i.test(row.text));
      const balanceRow = incomeRows.find((row) => /HECS\s*\/\s*HELP Balance/i.test(row.text));
      if (!hasDebtRow && !balanceRow) return "";

      const details = columns.map((column, index) => {
        const nextColumn = columns[index + 1];
        const name = clients[index]?.name || column.text || `Applicant ${index + 1}`;
        const debtValue = cellTextForColumn(hasDebtRow, column, nextColumn);
        const balance = cellTextForColumn(balanceRow, column, nextColumn);
        const hasDebt = /^yes$/i.test(debtValue) || Boolean(balance);
        if (!hasDebt) return "";
        return `${name}${balance ? ` - ${balance}` : ""}`;
      }).filter(Boolean);

      return details.join("; ");
    }

    function cellTextForColumn(row, column, nextColumn) {
      if (!row || !column) return "";
      return row.items
        .filter((item) => item.x >= column.x - 8 && (!nextColumn || item.x < nextColumn.x - 12))
        .map((item) => item.text)
        .join(" ")
        .trim();
    }

    function parseQuickliProposedLoans(rows) {
      const proposedRows = rowsBetween(rows, "Proposed Home Loans", "Existing Home Loans");
      return proposedRows
        .filter((row) => /\$[\d,]+(?:\.\d+)?/.test(row.text) && /\d+(?:\.\d+)?%/.test(row.text))
        .map((row, index) => {
          const money = row.text.match(/\$[\d,]+(?:\.\d+)?/g) || [];
          const percentages = row.text.match(/\b\d+(?:\.\d+)?%/g) || [];
          const years = row.text.match(/\b\d+(?:\.\d+)?\s*yrs\b/gi) || [];
          const firstMoneyIndex = row.text.search(/\$[\d,]+(?:\.\d+)?/);
          const productAndInvestment = firstMoneyIndex > 0 ? row.text.slice(0, firstMoneyIndex).trim() : "";
          const investmentFlag = productAndInvestment.match(/\b(Yes|No)\s*$/i)?.[1] || "";
          const product = investmentFlag
            ? productAndInvestment.replace(/\b(Yes|No)\s*$/i, "").trim()
            : productAndInvestment;
          const loanUse = /^yes$/i.test(investmentFlag)
            ? "Investment"
            : /^no$/i.test(investmentFlag)
              ? "Owner Occupied"
              : "";
          const lvrText = percentages[0] || "";
          const afterLvr = lvrText ? row.text.slice(row.text.lastIndexOf(lvrText) + lvrText.length) : "";
          const securityLinkText = afterLvr.replace(/\b\d+(?:\.\d+)?%/g, "");
          const securityIds = (securityLinkText.match(/\b\d+\b/g) || [])
            .map((value) => Number(value) - 1)
            .filter((value) => Number.isInteger(value) && value >= 0);
          return {
            index,
            loanAmount: money[0] || "",
            lvr: lvrText,
            term: years[0] ? years[0].replace(/\s*yrs/i, "") : "",
            ioTerm: years[1] ? years[1].replace(/\s*yrs/i, "") : "",
            product,
            loanUse,
            securityIds,
            row: row.text
          };
        });
    }

    function parseQuickliProperties(rows) {
      const propertyRows = rowsBetween(rows, "Properties and Rental Income", "Proposed Home Loans");
      const securities = [];
      propertyRows.forEach((row, index) => {
        if (!quickliLooksLikePropertyAddress(row.text)) return;
        const detailRow = propertyRows.slice(index + 1).find((candidate) => {
          return !quickliLooksLikePropertyAddress(candidate.text)
            && /\$[\d,]+(?:\.\d+)?/.test(candidate.text)
            && !/^Value\b/i.test(candidate.text);
        });
        if (!detailRow) return;
        const money = detailRow.text.match(/\$[\d,]+(?:\.\d+)?/g) || [];
        const value = money[0] || "";
        if (!value) return;
        const weeklyIncome = money[1] || "";
        const investmentExpense = money[2] || "";
        const transactionType = detailRow.text.match(/\b(Owns with Mortgage|Owns Outright|Purchasing)\b/i)?.[1] || "";
        const hasRentalIncome = money.slice(1).some((amount) => parseCurrencyNumber(amount) > 0);
        const propertyPurpose = hasRentalIncome || /\bInvestment\b/i.test(detailRow.text)
          ? "Investment"
          : "Owner Occupied";
        const normalizedTransactionType = normalizeQuickliTransactionType(transactionType) || "Purchasing";
        securities.push(blankSecurity({
          types: ["established"],
          address: normalizeQuickliPropertyAddress(row.text),
          value,
          propertyPurpose,
          transactionType: normalizedTransactionType,
          weeklyIncome,
          investmentExpense,
          contract: defaultSecurityContract(normalizedTransactionType)
        }));
      });
      return securities;
    }

    function quickliLooksLikePropertyAddress(text) {
      const normalized = String(text || "").trim();
      if (!normalized || /^Value\b/i.test(normalized) || /\$[\d,]+(?:\.\d+)?/.test(normalized)) return false;
      if (!/\b\d{4}\b/.test(normalized)) return false;
      if (/^\d+\s*\/\s*\d+$/.test(normalized)) return false;
      if (/\b(page|postcode|income|expense|lvr|loan|term|rate)\b/i.test(normalized)) return false;
      return /[,/]/.test(normalized) || /\b(QLD|NSW|VIC|SA|WA|TAS|ACT|NT)\b/i.test(normalized);
    }

    function normalizeQuickliPropertyAddress(text) {
      return String(text || "")
        .replace(/\s+/g, " ")
        .replace(/\b(QLD|NSW|VIC|SA|WA|TAS|ACT|NT)\s+(\d{4}),\s*\2\b/i, "$1 $2")
        .trim();
    }

    function normalizeQuickliTransactionType(value) {
      const normalized = String(value || "").toLowerCase();
      if (normalized === "purchasing") return "Purchasing";
      if (normalized === "owns outright") return "Owns Outright";
      if (normalized === "owns with mortgage") return "Owns with Mortgage";
      return "";
    }

    function parseQuickliPersonalLiabilities(rows) {
      const liabilityRows = rowsBetweenExact(rows, "Personal Liabilities", "Living Expenses");
      return liabilityRows
        .filter((row) => /\$[\d,]+(?:\.\d+)?/.test(row.text) && !/^Loan Type\b/i.test(row.text))
        .map((row) => {
          const moneyItems = row.items.filter((item) => /^\$[\d,]+(?:\.\d+)?$/.test(item.text));
          const firstValueX = Math.min(
            ...row.items
              .filter((item) => /^\$[\d,]+(?:\.\d+)?$/.test(item.text) || /^\d+(?:\.\d+)?%$/.test(item.text))
              .map((item) => item.x)
          );
          const liability = row.items
            .filter((item) => Number.isFinite(firstValueX) ? item.x < firstValueX - 8 : !/^\$[\d,]+(?:\.\d+)?$/.test(item.text))
            .map((item) => item.text)
            .join(" ")
            .trim();
          const limitItem = moneyItems.find((item) => item.x < 300);
          const repaymentItem = moneyItems.find((item) => item.x > 560)
            || (moneyItems.length > 1 ? moneyItems[moneyItems.length - 1] : null);
          const rate = row.text.match(/\b\d+(?:\.\d+)?%/)?.[0] || "";
          return {
            liability: liability || "Personal Liability",
            limit: limitItem?.text || "",
            owing: "",
            rate,
            repayment: repaymentItem?.text || ""
          };
        })
        .filter((item) => item.liability || item.limit || item.repayment);
    }

    function parseQuickliLivingExpenses(rows) {
      const livingRows = rowsBetween(rows, "Living Expenses", "");
      const totalRow = livingRows.find((row) => /(?:Total\s+)?Basic Expenses/i.test(row.text) && /\$[\d,]+/.test(row.text));
      const primaryRow = livingRows.find((row) => /Primary Residence/i.test(row.text) && /\$[\d,]+/.test(row.text));
      const rentBoardRow = livingRows.find((row) => /Rent\s*\/\s*Board/i.test(row.text) && /\$[\d,]+/.test(row.text));
      const chosen = totalRow || primaryRow;
      const amount = chosen?.text.match(/\$[\d,]+(?:\.\d+)?/)?.[0] || "";
      const rentBoard = rentBoardRow?.text.match(/\$[\d,]+(?:\.\d+)?/)?.[0] || "";
      return [
        rentBoard ? `Quickli rent / board: ${rentBoard}` : "",
        amount ? `Quickli basic living expenses: ${amount}` : ""
      ].filter(Boolean).join(", ");
    }

    function buildQuickliSummary(rows, proposed, parsed) {
      const favouriteRows = rowsBetween(rows, "Favourite Results", "Results");
      const favouriteResult = favouriteRows.find((row) => /\$[\d,]+/.test(row.text) && /\d+(?:\.\d+)?%/.test(row.text));
      const existingRows = rowsBetween(rows, "Existing Home Loans", "Personal Liabilities");
      const existingLoan = existingRows.find((row) => /\$[\d,]+/.test(row.text) && /yrs/i.test(row.text) && !/^LOC\b/i.test(row.text));
      const propertyRows = rowsBetween(rows, "Properties and Rental Income", "Proposed Home Loans");
      const propertyAddress = propertyRows.find((row) => /\bQLD\b|\bNSW\b|\bVIC\b|\bSA\b|\bWA\b|\bTAS\b|\bACT\b|\bNT\b/i.test(row.text));
      const propertyValue = propertyRows.find((row) => /\$[\d,]+/.test(row.text) && /Owns|Mortgage|Rent/i.test(row.text));
      const summary = [];

      summary.push(`Quickli file imported: ${new Date().toLocaleString("en-AU", { dateStyle: "medium", timeStyle: "short" })}`);
      if (favouriteResult) summary.push(`Favourite servicing result: ${favouriteResult.text}`);
      if (proposed.row) summary.push(`Proposed home loan: ${proposed.row}`);
      if (existingLoan) summary.push(`Existing home loan: ${existingLoan.text}`);
      if (propertyAddress) summary.push(`Security/property: ${propertyAddress.text}${propertyValue ? ` - ${propertyValue.text}` : ""}`);
      if (parsed.livingExpenses) summary.push(`Living expenses: ${parsed.livingExpenses}`);
      return summary.join("\n");
    }

    function promptQuickliLoanGrouping(proposedLoans) {
      return new Promise((resolve) => {
        let groups = [proposedLoans.map((_, index) => index)];
        let draggedLoanIndex = null;
        const backdrop = document.createElement("div");
        backdrop.className = "modal-backdrop";

        const cleanup = (value) => {
          document.removeEventListener("keydown", onKeyDown);
          backdrop.remove();
          resolve(value);
        };
        const compactGroups = () => {
          groups = groups.filter((group) => group.length);
          if (!groups.length) groups = [[]];
        };
        const assignments = () => {
          const result = [];
          groups.forEach((group, groupIndex) => {
            group.forEach((loanIndex) => {
              result[loanIndex] = groupIndex + 1;
            });
          });
          return proposedLoans.map((_, index) => result[index] || 1);
        };
        const cardHtml = (loanIndex) => {
          const loan = proposedLoans[loanIndex];
          return `
            <div class="quickli-drag-card" draggable="true" data-quickli-card="${loanIndex}">
              <div class="quickli-loan-main">${escapeHtml(loan.loanAmount || `Proposed loan ${loanIndex + 1}`)}</div>
              <div class="quickli-loan-meta">${escapeHtml([loan.product, loan.term ? `${loan.term} yrs` : "", loan.ioTerm ? `IO ${loan.ioTerm} yrs` : "", loan.lvr].filter(Boolean).join(" - "))}</div>
            </div>
          `;
        };
        const renderBoard = () => {
          backdrop.innerHTML = `
            <div class="quickli-modal" role="dialog" aria-modal="true" aria-labelledby="quickliLoanGroupingTitle">
              <div class="quickli-modal-head">
                <h2 id="quickliLoanGroupingTitle">Group Quickli loans</h2>
                <button class="icon-button" type="button" data-quickli-cancel aria-label="Cancel Quickli import" title="Cancel" data-icon="x"></button>
              </div>
              <div class="quickli-modal-body">
                <p>Drag proposed loans into the same box for splits, or separate boxes for separate loans.</p>
                <div class="quickli-quick-actions">
                  <button class="button" type="button" data-quickli-all-splits>All as splits</button>
                  <button class="button" type="button" data-quickli-separate>Separate loans</button>
                  <button class="button" type="button" data-quickli-add-group data-icon="plus">Add loan</button>
                </div>
                <div class="quickli-drag-board">
                  ${groups.map((group, groupIndex) => `
                    <div class="quickli-group" data-quickli-group="${groupIndex}">
                      <div class="quickli-group-head">
                        <span class="quickli-group-title">Loan ${groupIndex + 1}</span>
                        ${groups.length > 1 ? `<button class="icon-button" type="button" data-quickli-remove-group="${groupIndex}" aria-label="Remove loan box" title="Remove loan box" data-icon="trash"></button>` : ""}
                      </div>
                      <div class="quickli-dropzone">
                        ${group.map(cardHtml).join("") || `<div class="quickli-loan-meta">Drop proposed loans here</div>`}
                      </div>
                    </div>
                  `).join("")}
                </div>
              </div>
              <div class="quickli-modal-foot">
                <button class="button ghost" type="button" data-quickli-cancel>Cancel</button>
                <button class="button primary" type="button" data-quickli-import>Import loans</button>
              </div>
            </div>
          `;
          bindBoard();
          hydrateIcons();
        };
        const moveLoanToGroup = (loanIndex, targetGroupIndex) => {
          groups = groups.map((group) => group.filter((item) => item !== loanIndex));
          groups[targetGroupIndex] = groups[targetGroupIndex] || [];
          groups[targetGroupIndex].push(loanIndex);
          compactGroups();
          renderBoard();
        };
        const onKeyDown = (event) => {
          if (event.key === "Escape") cleanup(null);
        };
        const bindBoard = () => {
          backdrop.querySelectorAll("[data-quickli-cancel]").forEach((button) => {
            button.addEventListener("click", () => cleanup(null));
          });
          backdrop.querySelector("[data-quickli-import]")?.addEventListener("click", () => cleanup(assignments()));
          backdrop.querySelector("[data-quickli-all-splits]")?.addEventListener("click", () => {
            groups = [proposedLoans.map((_, index) => index)];
            renderBoard();
          });
          backdrop.querySelector("[data-quickli-separate]")?.addEventListener("click", () => {
            groups = proposedLoans.map((_, index) => [index]);
            renderBoard();
          });
          backdrop.querySelector("[data-quickli-add-group]")?.addEventListener("click", () => {
            groups.push([]);
            renderBoard();
          });
          backdrop.querySelectorAll("[data-quickli-remove-group]").forEach((button) => {
            button.addEventListener("click", () => {
              const index = Number(button.dataset.quickliRemoveGroup);
              const removed = groups[index] || [];
              groups.splice(index, 1);
              groups[0] = [...(groups[0] || []), ...removed];
              compactGroups();
              renderBoard();
            });
          });
          backdrop.querySelectorAll("[data-quickli-card]").forEach((card) => {
            card.addEventListener("dragstart", (event) => {
              draggedLoanIndex = Number(card.dataset.quickliCard);
              event.dataTransfer?.setData("text/plain", String(draggedLoanIndex));
            });
          });
          backdrop.querySelectorAll("[data-quickli-group]").forEach((group) => {
            group.addEventListener("dragover", (event) => {
              event.preventDefault();
              group.classList.add("is-drag-over");
            });
            group.addEventListener("dragleave", () => group.classList.remove("is-drag-over"));
            group.addEventListener("drop", (event) => {
              event.preventDefault();
              group.classList.remove("is-drag-over");
              const loanIndex = Number(event.dataTransfer?.getData("text/plain") || draggedLoanIndex);
              if (Number.isFinite(loanIndex)) moveLoanToGroup(loanIndex, Number(group.dataset.quickliGroup));
            });
          });
        };

        document.body.appendChild(backdrop);
        document.addEventListener("keydown", onKeyDown);
        renderBoard();
        backdrop.querySelector("[data-quickli-import]")?.focus();
      });
    }

    function applyQuickliProposedLoans(proposedLoans, grouping) {
      if (!proposedLoans.length) return false;
      const grouped = new Map();
      proposedLoans.forEach((loan, index) => {
        const groupNumber = Number(grouping[index] || index + 1);
        if (!grouped.has(groupNumber)) grouped.set(groupNumber, []);
        grouped.get(groupNumber).push(loan);
      });
      const groups = Array.from(grouped.entries())
        .sort((a, b) => a[0] - b[0])
        .map(([, loans]) => loans);

      state.loans = groups.map((loans, index) => {
        const existing = state.loans?.[index] || blankLoan();
        const loanAmount = loans.reduce((total, loan) => total + parseCurrencyNumber(loan.loanAmount), 0);
        const lvr = loans.reduce((highest, loan) => Math.max(highest, parsePercentNumber(loan.lvr)), 0);
        const securityIds = [...new Set(loans.flatMap((loan) => loan.securityIds || []))]
          .filter((securityIndex) => state.securities?.[securityIndex]);
        const linkedValue = securityIds.reduce((total, securityIndex) => {
          return total + parseCurrencyNumber(state.securities?.[securityIndex]?.value);
        }, 0);
        const splits = loans.map((loan) => blankSplit({
          amount: normalizeCurrencyValue(loan.loanAmount),
          loanUse: loan.loanUse || existing.loanUse || "Owner Occupied",
          product: loan.product || "",
          term: loan.term || "",
          ioTerm: loan.ioTerm && loan.ioTerm !== "0" ? loan.ioTerm : "",
          interestRate: ""
        }));
        const loanUse = loans.find((loan) => loan.loanUse)?.loanUse || splits[0]?.loanUse || existing.loanUse;
        return calculateLoanLvr(normalizeLoan({
          ...existing,
          loanUse,
          loanAmount: loanAmount ? normalizeCurrencyValue(String(loanAmount)) : existing.loanAmount,
          loanSecurityValue: linkedValue ? normalizeCurrencyValue(String(linkedValue)) : existing.loanSecurityValue,
          baseLvr: lvr ? formatLvrPercent(lvr) : existing.baseLvr,
          securityIds,
          securityLinksTouched: Boolean(securityIds.length),
          splits: splits.length ? splits : existing.splits
        }));
      });
      syncPrimaryLoanState();
      return true;
    }

    function findSectionRow(rows, sectionName, rowPattern) {
      const start = findSectionIndex(rows, sectionName);
      if (start === -1) return null;
      return rows.slice(start + 1).find((row) => rowPattern.test(row.text)) || null;
    }

    function findSectionIndex(rows, sectionName, startAt = 0) {
      return rows.findIndex((row, index) => index >= startAt && rowMatchesSectionName(row.text, sectionName));
    }

    function findExactSectionIndex(rows, sectionName, startAt = 0) {
      return rows.findIndex((row, index) => index >= startAt && String(row.text || "").trim() === sectionName);
    }

    function quickliRowsWithoutNotes(rows) {
      const notesStart = findExactSectionIndex(rows, "Notes");
      if (notesStart === -1) return rows;
      const applicantsStart = findExactSectionIndex(rows, "Applicants", notesStart + 1);
      if (applicantsStart === -1 || applicantsStart <= notesStart) return rows;
      return rows.filter((_, index) => index < notesStart || index >= applicantsStart);
    }

    function rowsBetween(rows, startText, endText, startAt = 0) {
      const start = findSectionIndex(rows, startText, startAt);
      if (start === -1) return [];
      const afterStart = rows.slice(start + 1);
      const end = endText
        ? afterStart.findIndex((row) => rowMatchesSectionName(row.text, endText))
        : -1;
      return end === -1 ? afterStart : afterStart.slice(0, end);
    }

    function rowsBetweenExact(rows, startText, endText, startAt = 0) {
      const start = findExactSectionIndex(rows, startText, startAt);
      if (start === -1) return [];
      const afterStart = rows.slice(start + 1);
      const end = endText
        ? afterStart.findIndex((row) => String(row.text || "").trim() === endText)
        : -1;
      return end === -1 ? afterStart : afterStart.slice(0, end);
    }

    function rowMatchesSectionName(rowText, sectionName) {
      const text = String(rowText || "").trim();
      return text === sectionName
        || text.startsWith(`${sectionName} `)
        || text.endsWith(` ${sectionName}`)
        || text.includes(` ${sectionName} `);
    }

    function applyQuickliData(quickli, loanGrouping = []) {
      if (quickli.clients.length) {
        state.clients = quickli.clients;
      }
      if (quickli.dependantsDetails) {
        state.dependants = ["Dependants"];
        state.dependantsDetails = quickli.dependantsDetails;
      }
      if (quickli.liabilities.length) {
        state.liabilities = quickli.liabilities.map((item) => normalizeLiabilityCurrency({ ...blankLiability(), ...item }));
      }
      if (quickli.hecsDebtDetails) {
        state.hecsDebtRequired = ["HECS debt disclosed"];
        state.hecsDebt = quickli.hecsDebtDetails;
      }
      if (quickli.securities?.length) {
        state.securities = quickli.securities.map(normalizeSecurity);
        state.securityValueOverridden = true;
        syncLegacySecurityFieldsFromSecurities();
      }
      const appliedProposedLoans = applyQuickliProposedLoans(quickli.proposedLoans || [], loanGrouping);
      if (!appliedProposedLoans && (quickli.loanAmount || quickli.lvr)) {
        updatePrimaryLoan({
          loanAmount: quickli.loanAmount ? normalizeCurrencyValue(quickli.loanAmount) : state.loanAmount,
          baseLvr: quickli.lvr ? normalizePercent(quickli.lvr) : state.baseLvr
        });
      }
      if (quickli.favouriteLender && state.loans?.[0] && !state.loans[0].lender) {
        state.loans[0].lender = lenderForName(quickli.favouriteLender)?.name || quickli.favouriteLender;
        syncPrimaryLoanState();
      }
      applyQuickliFavouriteOtherLenders(quickli.favouriteResults || []);
      if (quickli.livingExpenses) state.livingExpenses = quickli.livingExpenses;
    }

    function applyQuickliFavouriteOtherLenders(favouriteResults = []) {
      const otherFavourites = favouriteResults
        .map((result) => lenderForName(result.lender)?.name || result.lender || "")
        .filter(Boolean)
        .filter((lender, index, lenders) => index > 0 && lenders.indexOf(lender) === index);
      if (!otherFavourites.length) return;
      if (!Array.isArray(state.otherLenders)) state.otherLenders = [];
      otherFavourites.forEach((lender) => {
        const alreadyListed = state.otherLenders.some((item) => normalizeLenderSearch(item.lender) === normalizeLenderSearch(lender));
        if (alreadyListed) return;
        let target = state.otherLenders.find((item) => !item.lender && !item.product && !item.reason);
        if (!target) {
          target = { lender: "", product: "", reason: "" };
          state.otherLenders.push(target);
        }
        target.lender = lender;
      });
    }

    document.getElementById("quickliUpload").addEventListener("change", (event) => {
      importQuickliPdf(event.target.files[0]);
      event.target.value = "";
    });
    document.getElementById("loanScenarioUpload").addEventListener("change", (event) => {
      importLoanScenarioPdf(event.target.files[0]);
      event.target.value = "";
    });
    document.getElementById("toolPdfImport").addEventListener("change", (event) => {
      importToolExportPdf(event.target.files[0]);
      event.target.value = "";
    });
    document.getElementById("progressFileImport").addEventListener("change", (event) => {
      importProgressFile(event.target.files[0]);
      event.target.value = "";
    });
    document.getElementById("savedNotesLibraryImport").addEventListener("change", (event) => {
      importSavedNotesLibrary(event.target.files[0]);
      event.target.value = "";
    });
    document.getElementById("saveInAppNote").addEventListener("click", saveCurrentNoteInApp);
    document.getElementById("openSavedNotes").addEventListener("click", openSavedNotesModal);
    document.getElementById("openSettings").addEventListener("click", openSettingsModal);
    document.getElementById("openFeedbackReport").addEventListener("click", openFeedbackModal);

    const topActions = document.getElementById("topActions");
    const actionsToggle = document.getElementById("actionsToggle");

    actionsToggle?.addEventListener("click", () => {
      const collapsed = topActions.classList.toggle("is-collapsed");
      actionsToggle.setAttribute("aria-expanded", collapsed ? "false" : "true");
      const label = collapsed ? "Show actions" : "Hide actions";
      actionsToggle.setAttribute("aria-label", label);
      actionsToggle.title = label;
      if (collapsed) closeImportMenu();
    });

    const importMenuButton = document.getElementById("importMenuButton");
    const importMenu = document.getElementById("importMenu");

    function closeImportMenu() {
      if (!importMenu || !importMenuButton) return;
      importMenu.hidden = true;
      importMenuButton.setAttribute("aria-expanded", "false");
    }

    function toggleImportMenu() {
      if (!importMenu || !importMenuButton) return;
      const shouldOpen = importMenu.hidden;
      importMenu.hidden = !shouldOpen;
      importMenuButton.setAttribute("aria-expanded", shouldOpen ? "true" : "false");
    }

    importMenuButton?.addEventListener("click", (event) => {
      event.stopPropagation();
      toggleImportMenu();
    });

    importMenu?.addEventListener("click", () => {
      requestAnimationFrame(closeImportMenu);
    });

    importMenu?.querySelectorAll("label[for]").forEach((label) => {
      label.addEventListener("keydown", (event) => {
        if (!["Enter", " "].includes(event.key)) return;
        event.preventDefault();
        document.getElementById(label.getAttribute("for"))?.click();
        closeImportMenu();
      });
    });

    document.addEventListener("click", (event) => {
      if (event.target.closest?.(".import-menu-wrap")) return;
      closeImportMenu();
    });

    function openClearConfirmation() {
      const hasContent = noteHasContent();
      const alreadySaved = Boolean(activeSavedNoteId);
      const backdrop = document.createElement("div");
      backdrop.className = "modal-backdrop";
      backdrop.innerHTML = `
        <div class="quickli-modal is-confirm" role="dialog" aria-modal="true" aria-labelledby="clearConfirmTitle">
          <div class="quickli-modal-head">
            <h2 id="clearConfirmTitle">Start a new note?</h2>
            <button class="icon-button" type="button" data-clear-cancel aria-label="Cancel" title="Cancel" data-icon="x"></button>
          </div>
          <div class="quickli-modal-body">
            <p>This clears the form so you can start a fresh note. Saved notes and backups are not deleted.</p>
            ${hasContent ? `
              <label class="choice" data-clear-save-row>
                <input type="checkbox" data-clear-save${alreadySaved ? "" : " checked"}>
                Save note for later
              </label>
              <p class="clear-save-hint" data-clear-save-hint></p>
            ` : ""}
          </div>
          <div class="quickli-modal-foot">
            <button class="button ghost" type="button" data-clear-cancel>Cancel</button>
            <button class="button primary" type="button" data-clear-confirm>Start new note</button>
          </div>
        </div>
      `;
      const cleanup = () => {
        document.removeEventListener("keydown", onKeyDown);
        backdrop.remove();
      };
      const onKeyDown = (event) => {
        if (event.key === "Escape") cleanup();
      };
      backdrop.querySelectorAll("[data-clear-cancel]").forEach((button) => {
        button.addEventListener("click", cleanup);
      });
      const saveToggle = backdrop.querySelector("[data-clear-save]");
      const saveHint = backdrop.querySelector("[data-clear-save-hint]");
      const syncSaveHint = () => {
        if (!saveHint) return;
        if (!saveToggle?.checked) {
          saveHint.textContent = alreadySaved
            ? `"${savedNoteTitle()}" stays in Notes with the changes already autosaved.`
            : "This note has not been saved - the current answers will be discarded.";
          saveHint.classList.toggle("is-warning", !alreadySaved);
          return;
        }
        saveHint.textContent = `Saves to Notes as "${savedNoteTitle()}" before clearing.`;
        saveHint.classList.remove("is-warning");
      };
      saveToggle?.addEventListener("change", syncSaveHint);
      syncSaveHint();
      backdrop.querySelector("[data-clear-confirm]")?.addEventListener("click", () => {
        const savedNote = saveToggle?.checked ? saveCurrentNoteInApp({ show: false }) : null;
        cleanup();
        reset(false);
        showToast(savedNote ? `Saved "${savedNote.title}". Started a new note.` : "Started a new note.");
      });
      backdrop.addEventListener("click", (event) => {
        if (event.target === backdrop) cleanup();
      });
      document.body.appendChild(backdrop);
      hydrateIcons();
      document.addEventListener("keydown", onKeyDown);
      backdrop.querySelector("[data-clear-cancel]")?.focus();
    }

    function cleanLegacyBuilderUrl() {
      if (!window.location.pathname.endsWith("/para-broker-notes-builder.html")) return;
      const cleanPath = window.location.pathname.replace(/para-broker-notes-builder\.html$/, "");
      window.history.replaceState(null, document.title, `${cleanPath}${window.location.search}${window.location.hash}`);
    }

    function jumpRelativeSection(direction) {
      const steps = Array.from(document.querySelectorAll(".step:not(.is-hidden)"))
        .filter((step) => document.getElementById(`section-${step.dataset.jump}`));
      if (!steps.length) return false;
      const activeId = hoveredSectionId || visibleSectionId || steps[0].dataset.jump;
      const currentIndex = Math.max(0, steps.findIndex((step) => step.dataset.jump === activeId));
      const nextIndex = Math.min(steps.length - 1, Math.max(0, currentIndex + direction));
      const target = document.getElementById(`section-${steps[nextIndex].dataset.jump}`);
      if (!target) return false;
      target.scrollIntoView({ behavior: "smooth", block: "start" });
      return true;
    }

    document.addEventListener("keydown", (event) => {
      if (event.metaKey && !event.ctrlKey && !event.altKey && event.key.toLowerCase() === "z") {
        event.preventDefault();
        if (event.shiftKey) {
          redoState();
        } else {
          undoState();
        }
        return;
      }
      if (event.metaKey && !event.ctrlKey && !event.altKey && !event.shiftKey && ["ArrowDown", "ArrowUp"].includes(event.key)) {
        event.preventDefault();
        jumpRelativeSection(event.key === "ArrowDown" ? 1 : -1);
        return;
      }
      if (event.key === "Escape") {
        closeImportMenu();
      }
      if (event.key === "Escape" && !document.querySelector("[data-contribution-panel]")?.classList.contains("is-hidden")) {
        closeContributionPanel();
        event.preventDefault();
        return;
      }
      if (event.key !== "Enter" || event.shiftKey || event.metaKey || event.ctrlKey || event.altKey) return;
      if (event.target instanceof HTMLTextAreaElement) return;
      if (event.target.closest?.("[contenteditable='true']")) return;
      if (focusNextMissingField()) event.preventDefault();
    });
    document.getElementById("resetForm").addEventListener("click", openClearConfirmation);
    const printButton = document.getElementById("printNotes");
    let printBypassReady = false;
    let printHoldTimer = null;

    function clearPrintHold() {
      clearTimeout(printHoldTimer);
      printHoldTimer = null;
    }

    printButton.addEventListener("pointerdown", () => {
      printBypassReady = false;
      clearPrintHold();
      printHoldTimer = setTimeout(() => {
        printBypassReady = true;
        showToast("Release to print.", 2200);
      }, 5000);
    });
    ["pointerup", "pointerleave", "pointercancel"].forEach((eventName) => {
      printButton.addEventListener(eventName, () => {
        if (!printBypassReady) clearPrintHold();
      });
    });
    printButton.addEventListener("click", () => {
      clearPrintHold();
      collectAndUpdate();
      const missing = getMissingRequiredItems();
      if (missing.length && !printBypassReady) {
        highlightMissingItems(missing);
        showToast(`${missing.length} required field${missing.length === 1 ? "" : "s"} missing.`, 4200);
        return;
      }
      printBypassReady = false;
      ensurePrintDocument();
      window.print();
    });
    // Covers Ctrl/Cmd+P and the browser menu. matchMedia is the fallback for Safari,
    // where beforeprint has historically been unreliable.
    window.addEventListener("beforeprint", ensurePrintDocument);
    window.matchMedia?.("print")?.addEventListener?.("change", (event) => {
      if (event.matches) ensurePrintDocument();
    });
    document.getElementById("copyNotes").addEventListener("click", async () => {
      try {
        if (!noteOutput.dataset.plainText) ensurePrintDocument();
        await navigator.clipboard.writeText(noteOutput.dataset.plainText || noteOutput.innerText);
        showToast("Notes copied.");
      } catch (error) {
        showToast("Copy failed. Try printing to PDF instead.");
      }
    });

    // Debounced writes must land before the tab goes away. pagehide and a hidden
    // visibilitychange are the two events that reliably fire on mobile and desktop.
    window.addEventListener("pagehide", flushPendingSaves);
    window.addEventListener("beforeunload", flushPendingSaves);
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") flushPendingSaves();
    });

    cleanLegacyBuilderUrl();
    registerServiceWorker();
    loadDraftState();
    render();
    recordHistorySnapshot({ clearRedo: true, force: true });
    updateAutosaveStatus(activeSavedNoteId ? "Saved note loaded" : "Draft loaded locally");
    showWelcomeIfNeeded();
  </script>
