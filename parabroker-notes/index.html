    function normalizeLoan(loan = {}) {
      const normalized = blankLoan({
        ...loan,
        purpose: normalizePurpose(loan.purpose || "Purchase Established"),
        loanUse: loan.loanUse || "Owner Occupied",
        loanAmount: normalizeCurrencyValue(loan.loanAmount || ""),
        loanSecurityValue: normalizeCurrencyValue(loan.loanSecurityValue || ""),
        baseLvr: normalizePercent(loan.baseLvr || ""),
        postCapLvr: normalizePercent(loan.postCapLvr || ""),
        lmi: normalizeCurrencyValue(loan.lmi || ""),
        lmiCapitalised: loan.lmiCapitalised !== false,
        interestRate: normalizePercent(loan.interestRate || ""),
        pricingStatus: loan.pricingStatus === "Needs to be done" ? "To be completed" : (loan.pricingStatus || "To be completed"),
        approvalRequested: loan.preApproval ? "Pre-Approval" : (loan.approvalRequested || "Formal"),
        preApproval: Boolean(loan.preApproval || loan.approvalRequested === "Pre-Approval"),
        depositScheme: Boolean(loan.depositScheme),
        securityIds: Array.isArray(loan.securityIds) ? loan.securityIds.map(Number).filter((index) => Number.isInteger(index) && index >= 0) : [],
        securityLinks: Array.isArray(loan.securityLinks) ? loan.securityLinks.map(String).filter((link) => /^\d+:(land|build)$/.test(link)) : [],
        securityLinksTouched: Boolean(loan.securityLinksTouched)
      });
      normalized.splits = Array.isArray(loan.splits) && loan.splits.length
        ? loan.splits.map(normalizeSplit)
        : [blankSplit()];
      if (normalized.loanUse && normalized.splits.length && !normalized.splits[0].loanUse) {
        normalized.splits[0].loanUse = normalized.loanUse;
      }
      if (normalized.repaymentType && normalized.splits.length && !normalized.splits[0].repaymentType) {
        normalized.splits[0].repaymentType = normalized.repaymentType;
      }
      if (normalized.interestRate && normalized.splits.length && !normalized.splits[0].interestRate) {
        normalized.splits[0].interestRate = normalized.interestRate;
      }
      if (normalized.depositScheme) {
        normalized.lmi = LMI_WAIVER_LABEL;
      } else if (normalized.lmi === LMI_WAIVER_LABEL) {
        normalized.lmi = "";
      }
      // Splits used to total the base loan only. Older records predate the capitalised
      // flag, so fold their LMI into the first split to keep the base loan intact.
      const legacyLmi = loan.lmiCapitalised === undefined ? capitalisedLmiAmount(normalized) : 0;
      if (legacyLmi && normalized.splits.some((split) => parseCurrencyNumber(split.amount) > 0)) {
        normalized.splits[0].amount = normalizeCurrencyValue(String(parseCurrencyNumber(normalized.splits[0].amount) + legacyLmi));
      }
      return normalized;
    }

    function normalizeSecurity(security = {}) {
      const propertyPurpose = ["Owner Occupied", "Investment"].includes(security.propertyPurpose) ? security.propertyPurpose : "Owner Occupied";
      const transactionType = ["Purchasing", "Owns Outright", "Owns with Mortgage"].includes(security.transactionType) ? security.transactionType : "Purchasing";
      const normalized = blankSecurity({
        ...security,
        types: normalizeSecurityTypes(security),
        value: normalizeCurrencyValue(security.value || ""),
        propertyPurpose,
        transactionType,
        boarder: propertyPurpose === "Owner Occupied" && Boolean(security.boarder),
        weeklyIncome: normalizeCurrencyValue(security.weeklyIncome || ""),
        investmentExpense: normalizeCurrencyValue(security.investmentExpense || ""),
        valuation: security.valuation || "",
        valuationOther: security.valuationOther || "",
        contract: normalizeSecurityContract(security.contract || "", transactionType),
        expectedDate: normalizeMonthValue(security.expectedDate || ""),
        land: normalizeLandComponent(security.land || {}),
        build: normalizeBuildComponent(security.build || {})
      });
      return normalized;
    }

    function normalizeSecurityTypes(security = {}) {
      const raw = [
        ...(Array.isArray(security.types) ? security.types : []),
        security.securityMode || security.mode || ""
      ].filter(Boolean);
      const expandedTypes = raw.flatMap((type) => {
        if (type === "landBuild") return ["land", "construction"];
        if (type === "landOnly") return ["land"];
        if (type === "build") return ["construction"];
        return type;
      });
      const types = [...new Set(expandedTypes.filter((type) => ["established", "land", "construction"].includes(type)))];
      if (types.length) {
        const withoutEstablished = types.filter((type) => type !== "established");
        if (withoutEstablished.length) return withoutEstablished;
        if (types.includes("established")) return ["established"];
        return withoutEstablished.length ? withoutEstablished : ["established"];
      }
      const hasLand = Boolean(security.land?.price || security.land?.address || security.land?.estate);
      const hasBuild = Boolean(security.build?.contractAmount || security.build?.outOfContractItems || security.build?.builderName);
      if (hasLand || hasBuild) return [hasLand ? "land" : "", hasBuild ? "construction" : ""].filter(Boolean);
      return ["established"];
    }

    function securityMode(security = {}) {
      if (securityHasType(security, "established")) return "established";
      if (securityHasType(security, "land") && securityHasType(security, "construction")) return "landBuild";
      if (securityHasType(security, "land")) return "landOnly";
      return "established";
    }

    function securityModeTypes(mode) {
      if (mode === "landBuild") return ["land", "construction"];
      if (mode === "landOnly") return ["land"];
      return ["established"];
    }

    function securityModeLabel(security = {}) {
      const mode = securityMode(security);
      if (mode === "landBuild") return "Land & Build";
      if (mode === "landOnly") return "Land Only";
      return "Established";
    }

    function normalizeLandComponent(land = {}) {
      return blankLandComponent({
        ...land,
        price: normalizeCurrencyValue(land.price || ""),
        depositsPaid: normalizeCurrencyValue(land.depositsPaid || ""),
        posDate: normalizeMonthValue(land.posDate || ""),
        valuation: land.valuation || "",
        valuationOther: land.valuationOther || "",
        contract: land.contract || "Signed / Held",
        expectedDate: normalizeMonthValue(land.expectedDate || "")
      });
    }

    function normalizeBuildComponent(build = {}) {
      return blankBuildComponent({
        ...build,
        contractAmount: normalizeCurrencyValue(build.contractAmount || ""),
        outOfContractItems: normalizeCurrencyValue(build.outOfContractItems || ""),
        outOfContractDetails: build.outOfContractDetails || "",
        depositsPaid: normalizeCurrencyValue(build.depositsPaid || ""),
        contract: build.contract || "Signed / Held",
        expectedDate: normalizeMonthValue(build.expectedDate || ""),
        valuation: build.valuation || "",
        valuationOther: build.valuationOther || ""
      });
    }

    function securityComponentValue(security, component) {
      if (!security) return 0;
      if (component === "land" && !securityHasType(security, "land")) return 0;
      if (component === "build" && !securityHasType(security, "construction")) return 0;
      if (component === "land") return parseCurrencyNumber(security.land?.price);
      if (component === "build") {
        return parseCurrencyNumber(security.build?.contractAmount) + parseCurrencyNumber(security.build?.outOfContractItems);
      }
      return 0;
    }

    function securityComponentLabel(securityIndex, component) {
      if (!Number.isInteger(securityIndex) || !component) return "";
      const name = component === "build" ? "Build" : "Land";
      return `${securityLabel(securityIndex)} - ${name}`;
    }

    function shouldShowLandComponent() {
      return sectionIsVisible({ showWhen: { type: "landBuild" } }) || sectionIsVisible({ showWhen: { type: "absorbLand" } });
    }

    function shouldShowBuildComponent() {
      return sectionIsVisible({ showWhen: { type: "buildLoan" } });
    }

    function securityHasType(security, type) {
      return Array.isArray(security?.types) && security.types.includes(type);
    }

    function securityShowsWeeklyIncome(security) {
      return security?.propertyPurpose === "Investment" || (security?.propertyPurpose === "Owner Occupied" && Boolean(security?.boarder));
    }

    function securityShowsInvestmentExpense(security) {
      return security?.propertyPurpose === "Investment";
    }

    function defaultSecurityContract(transactionType, currentContract = "") {
      if (transactionType === "Purchasing") {
        return currentContract && currentContract !== "Property Owned" ? currentContract : "Signed / Held";
      }
      if (transactionType === "Owns Outright" || transactionType === "Owns with Mortgage") {
        return "Property Owned";
      }
      return currentContract || "";
    }

    function defaultContractForTransaction(transactionType) {
      if (transactionType === "Owns Outright" || transactionType === "Owns with Mortgage") return "Property Owned";
      if (transactionType === "Purchasing") return "Signed / Held";
      return "";
    }

    function normalizeSecurityContract(contract, transactionType = "") {
      const validContracts = ["Signed / Held", "Requested", "Expected", "Property Owned"];
      if (validContracts.includes(contract)) return contract;
      return defaultContractForTransaction(transactionType);
    }

    function valuationOptions(extra = []) {
      return ["Ordered", "In OneDrive", "To be ordered", ...extra, "Other (Free Type)"];
    }

    function valuationDisplay(value, other = "") {
      if (value === "Other (Free Type)") return other || "Other";
      return value || "";
    }

    function anySecurityHasType(type) {
      return (state.securities || []).some((security) => securityHasType(security, type));
    }

    function firstSecurityIndexWithType(type) {
      const index = (state.securities || []).findIndex((security) => securityHasType(security, type));
      return index === -1 ? 0 : index;
    }

    function securityComponentTotal(security) {
      return securityComponentValue(security, "land") + securityComponentValue(security, "build");
    }

    function normalizeSplit(split = {}) {
      return blankSplit({
        ...split,
        amount: normalizeCurrencyValue(split.amount || ""),
        loanUse: split.loanUse || "Owner Occupied",
        interestRate: normalizePercent(split.interestRate || ""),
        term: split.term || "30"
      });
    }

    function calculateLoanLvr(loan, activeId = "", activeEventType = "") {
      syncLoanAmountWithSplits(loan, activeId, activeEventType);
      const loanAmount = parseCurrencyNumber(loan.loanAmount);
      const securityValue = parseCurrencyNumber(loan.loanSecurityValue);
      const lmi = capitalisedLmiAmount(loan);
      if (!loanAmount || !securityValue) return loan;

      const sourceSignature = `${loanAmount}|${securityValue}`;
      const shouldAutoBase = !activeId.endsWith("BaseLvr") && (
        !loan.baseLvr ||
        loan._baseLvrAuto ||
        loan._lvrSourceSignature !== sourceSignature
      );
      if (activeId.endsWith("BaseLvr")) {
        loan._baseLvrAuto = false;
      } else if (shouldAutoBase) {
        loan.baseLvr = formatLvrPercent((loanAmount / securityValue) * 100);
        loan._baseLvrAuto = true;
      }
      loan._lvrSourceSignature = sourceSignature;

      const showPostCap = parsePercentNumber(loan.baseLvr) > 80;
      const postCapSignature = `${loanAmount}|${securityValue}|${lmi}`;
      const shouldAutoPostCap = !activeId.endsWith("PostCapLvr") && showPostCap && (
        !loan.postCapLvr ||
        loan._postCapLvrAuto ||
        loan._postCapSourceSignature !== postCapSignature
      );
      if (activeId.endsWith("PostCapLvr")) {
        loan._postCapLvrAuto = false;
      } else if (shouldAutoPostCap) {
        loan.postCapLvr = formatLvrPercent(((loanAmount + lmi) / securityValue) * 100);
        loan._postCapLvrAuto = true;
      } else if (!showPostCap) {
        loan.postCapLvr = "";
        loan._postCapLvrAuto = true;
      }
      loan._postCapSourceSignature = postCapSignature;
      return loan;
    }

    const LMI_WAIVER_LABEL = "N/A - LMI Waiver";

    function loanLmiApplies(loan = {}) {
      // During a split/amount edit the stored baseLvr is still the previous value, so derive
      // it from the amounts unless the broker has typed the LVR in by hand.
      const loanAmount = parseCurrencyNumber(loan.loanAmount);
      const securityValue = parseCurrencyNumber(loan.loanSecurityValue);
      if (loan._baseLvrAuto !== false && loanAmount && securityValue) {
        return parsePercentNumber(formatLvrPercent((loanAmount / securityValue) * 100)) > 80;
      }
      return parsePercentNumber(loan.baseLvr) > 80;
    }

    function capitalisedLmiAmount(loan = {}) {
      if (!loanLmiApplies(loan) || loan.depositScheme || loan.lmiCapitalised === false) return 0;
      return parseCurrencyNumber(loan.lmi);
    }

    function loanPrintLmiValue(loan = {}) {
      if (loan.depositScheme) return LMI_WAIVER_LABEL;
      if (!loan.lmi) return "";
      return `${loan.lmi}${loan.lmiCapitalised === false ? " (not capitalised)" : " (capitalised)"}`;
    }

    function loanLmiHint(loan = {}) {
      const baseLoan = parseCurrencyNumber(loan.loanAmount);
      const lmi = capitalisedLmiAmount(loan);
      if (loan.depositScheme) return "LMI waived under the 5% Deposit Scheme.";
      if (!parseCurrencyNumber(loan.lmi)) return "Capitalised LMI is added to the loan splits.";
      if (!lmi) return `Not capitalised - splits total ${normalizeCurrencyValue(String(baseLoan))}.`;
      return `Capitalised - splits total ${normalizeCurrencyValue(String(baseLoan + lmi))}.`;
    }

    function syncLoanAmountWithSplits(loan, activeId = "", activeEventType = "") {
      const capitalisedLmi = capitalisedLmiAmount(loan);
      const activeIsLoanAmount = /^loan\d+Amount$/.test(activeId);
      const activeIsLmi = /^loan\d+(Lmi|LmiCapitalised|DepositScheme)$/.test(activeId);
      if (activeIsLoanAmount || activeIsLmi) {
        // LMI keeps re-deriving from the base loan on every keystroke, so it stays consistent
        // with the later passes that read the base loan back off the splits.
        if (activeIsLoanAmount && activeEventType === "input") return loan;
        if (activeIsLoanAmount && !String(loan.loanAmount || "").trim()) return loan;
        const targetAmount = parseCurrencyNumber(loan.loanAmount) + capitalisedLmi;
        loan.splits = loan.splits.length ? loan.splits : [blankSplit()];
        const currentTotal = loanSplitTotal(loan);
        if (!currentTotal) {
          loan.splits[0].amount = targetAmount > 0 ? normalizeCurrencyValue(String(targetAmount)) : "";
          return loan;
        }

        let difference = targetAmount - currentTotal;
        if (!difference) return loan;

        const firstAmount = parseCurrencyNumber(loan.splits[0].amount);
        const firstNextAmount = firstAmount + difference;
        if (firstNextAmount >= 0) {
          loan.splits[0].amount = normalizeCurrencyValue(String(firstNextAmount));
          return loan;
        }

        loan.splits[0].amount = "$0";
        difference = firstNextAmount;
        for (let index = 1; index < loan.splits.length && difference < 0; index += 1) {
          const splitAmount = parseCurrencyNumber(loan.splits[index].amount);
          const nextAmount = splitAmount + difference;
          if (nextAmount >= 0) {
            loan.splits[index].amount = normalizeCurrencyValue(String(nextAmount));
            difference = 0;
          } else {
            loan.splits[index].amount = "$0";
            difference = nextAmount;
          }
        }
        return loan;
      }
      const hasSplitAmounts = loan.splits.some((split) => parseCurrencyNumber(split.amount) > 0);
      const splitTotal = loanSplitTotal(loan);
      if (hasSplitAmounts) {
        loan.loanAmount = normalizeCurrencyValue(String(Math.max(0, splitTotal - capitalisedLmi)));
      } else if (parseCurrencyNumber(loan.loanAmount) > 0) {
        loan.splits[0] = loan.splits[0] || blankSplit();
        loan.splits[0].amount = normalizeCurrencyValue(String(parseCurrencyNumber(loan.loanAmount) + capitalisedLmi));
      }
      return loan;
    }

    function loanSplitTotal(loan) {
      return (loan.splits || []).reduce((total, split) => total + parseCurrencyNumber(split.amount), 0);
    }

    function syncPrimaryLoanState() {
      const primary = state.loans?.[0] || blankLoan();
      state.purposes = state.loans.map((loan) => normalizePurpose(loan.purpose)).filter(Boolean);
      if (!state.purposes.length) state.purposes = [""];
      state.purpose = state.purposes.find(Boolean) || "";
      state.loanUse = primary.splits?.find((split) => split.loanUse)?.loanUse || primary.loanUse || "";
      state.loanAmount = primary.loanAmount || "";
      state.loanSecurityValue = primary.loanSecurityValue || state.loanSecurityValue || "";
      state.baseLvr = primary.baseLvr || "";
      state.postCapLvr = primary.postCapLvr || "";
      state.lmi = primary.lmi || "";
      state.lmiCapitalised = primary.lmiCapitalised !== false;
      state.depositScheme = primary.depositScheme ? ["5% Deposit Scheme"] : [];
      state.lender = primary.lender || "";
      state.product = primary.product || "";
      state.repaymentType = primary.repaymentType || "";
      state.interestRate = primary.interestRate || "";
      state.pricingStatus = primary.pricingStatus || "";
      state.pricingNotes = primary.pricingNotes || "";
      state.approvalRequested = primary.approvalRequested || "";
      state.approvalSubjectTo = primary.approvalSubjectTo || "";
    }

    function updatePrimaryLoan(updates = {}) {
      if (!Array.isArray(state.loans) || !state.loans.length) state.loans = [blankLoan()];
      state.loans[0] = calculateLoanLvr(normalizeLoan({ ...state.loans[0], ...updates }));
      syncPrimaryLoanState();
    }

    function ensureDefaults() {
      if (!state.minimizedStages || typeof state.minimizedStages !== "object" || Array.isArray(state.minimizedStages)) {
        state.minimizedStages = {};
      }
      if (checkboxHasValue("exitStrategyRequired", "Exit strategy required")) {
        state.exitStrategyRequired = ["Exit strategy required (Client is over 40 years old)"];
      }
      if (checkboxHasValue("craaIssuesRequired", "CRAA issues disclosed")) {
        state.craaIssuesRequired = ["CCR issues disclosed"];
      }
      if (!state.shortSettlement) state.shortSettlement = "No";
      if (!Array.isArray(state.purposes)) {
        state.purposes = [state.purpose || ""];
      }
      state.purposes = state.purposes.map(normalizePurpose);
      if (!state.purposes.length) state.purposes = [""];
      state.purpose = state.purposes.find(Boolean) || "";
      if (!Array.isArray(state.loans) || !state.loans.length) {
        const legacyLoan = {
          purpose: state.purpose || state.purposes[0] || "",
          loanUse: state.loanUse || "",
          loanAmount: state.loanAmount || "",
          loanSecurityValue: state.loanSecurityValue || state.securityValue || "",
          baseLvr: state.baseLvr || state.lvr || "",
          postCapLvr: state.postCapLvr || "",
          lmi: state.lmi || "",
          depositScheme: checkboxHasValue("depositScheme", "5% Deposit Scheme"),
          lender: state.lender || "",
          product: state.product || "",
          repaymentType: state.repaymentType || "",
          interestRate: state.interestRate || "",
          pricingStatus: state.pricingStatus || "",
          pricingNotes: state.pricingNotes || "",
          approvalRequested: state.approvalRequested || "",
          approvalSubjectTo: state.approvalSubjectTo || ""
        };
        state.loans = state.purposes.map((purpose, index) => blankLoan(index === 0 ? { ...legacyLoan, purpose } : { purpose }));
      }
      if (!Array.isArray(state.securities) || !state.securities.length) {
        state.securities = [blankSecurity({
          address: state.securityAddress || state.absorbLandAddress || "",
          value: state.securityValue || state.loanSecurityValue || state.absorbLandValue || "",
          valuation: state.securityValuation || state.absorbLandValuation || "",
          contract: state.securityContract || state.absorbLandContract || "",
          expectedDate: state.securityContractExpectedDate || state.absorbLandContractExpectedDate || "",
          conveyancer: state.securityConveyancer || state.absorbLandConveyancer || ""
        })];
      }
      if (state.securities.length === 1 && !state.securities[0].address && !state.securities[0].value && (state.securityAddress || state.securityValue || state.absorbLandAddress || state.absorbLandValue)) {
        state.securities[0] = blankSecurity({
          address: state.securityAddress || state.absorbLandAddress || "",
          value: state.securityValue || state.loanSecurityValue || state.absorbLandValue || "",
          valuation: state.securityValuation || state.absorbLandValuation || "",
          contract: state.securityContract || state.absorbLandContract || "",
          expectedDate: state.securityContractExpectedDate || state.absorbLandContractExpectedDate || "",
          conveyancer: state.securityConveyancer || state.absorbLandConveyancer || ""
        });
      }
      state.securities = state.securities.map(normalizeSecurity);
      if (state.securities[0]) {
        const primarySecurity = state.securities[0];
        primarySecurity.land = normalizeLandComponent({
          ...primarySecurity.land,
          estate: primarySecurity.land.estate || state.landEstate || "",
          price: primarySecurity.land.price || state.landPrice || state.absorbLandValue || "",
          depositsPaid: primarySecurity.land.depositsPaid || state.landDepositsPaid || "",
          depositReceipt: primarySecurity.land.depositReceipt || state.landDepositReceipt || "",
          posDate: primarySecurity.land.posDate || state.posDate || "",
          valuation: primarySecurity.land.valuation || state.landValuation || state.absorbLandValuation || "",
          contract: primarySecurity.land.contract || state.landContract || state.absorbLandContract || "",
          expectedDate: primarySecurity.land.expectedDate || state.landContractExpectedDate || state.absorbLandContractExpectedDate || "",
          conveyancer: primarySecurity.land.conveyancer || state.conveyancer || state.absorbLandConveyancer || ""
        });
        primarySecurity.build = normalizeBuildComponent({
          ...primarySecurity.build,
          builderName: primarySecurity.build.builderName || (state.builderName === "Other" ? state.builderNameOther : state.builderName) || "",
          contract: primarySecurity.build.contract || state.buildingContract || "",
          expectedDate: primarySecurity.build.expectedDate || state.buildingContractExpectedDate || "",
          contractAmount: primarySecurity.build.contractAmount || state.builderContractAmount || "",
          outOfContractItems: primarySecurity.build.outOfContractItems || state.builderOutOfContractItems || "",
          outOfContractDetails: primarySecurity.build.outOfContractDetails || state.builderOutOfContractDetails || "",
          depositsPaid: primarySecurity.build.depositsPaid || state.builderDepositsPaid || "",
          depositReceipt: primarySecurity.build.depositReceipt || state.buildDepositReceipt || "",
          siteStart: primarySecurity.build.siteStart || state.siteStart || "",
          valuation: primarySecurity.build.valuation || state.buildValuation || ""
        });
      }
      if (securityNestedMode() && !state.securityValueOverridden) {
        state.securities = state.securities.map((security) => {
          const componentTotal = securityComponentTotal(security);
          return componentTotal ? { ...security, value: normalizeCurrencyValue(String(componentTotal)) } : security;
        });
      }
      state.loans = state.loans.map((loan) => calculateLoanLvr(normalizeLoan(loan)));
      state.loans.forEach((loan, index) => {
        if (!loan.securityLinksTouched && !loan.securityIds.length && !loan.securityLinks.length && index === 0 && state.securities.some((security) => security.value || security.address)) {
          loan.securityIds = [0];
        }
        normalizeLoanSecuritySelections(loan);
      });
      syncLegacySecurityFieldsFromSecurities();
      syncLoanSecurityValuesFromLinks();
      syncPrimaryLoanState();
      if (state.lvr && !state.baseLvr) state.baseLvr = state.lvr;
      if (state.pricingStatus === "Needs to be done") state.pricingStatus = "To be completed";
      if (state.securityValue && !state.loanSecurityValue) state.loanSecurityValue = state.securityValue;
      if (state.loanSecurityValue && !state.securityValue) state.securityValue = state.loanSecurityValue;
      if (state.lenderProduct && !state.lender && !state.product) {
        const parts = String(state.lenderProduct).split(/\s*[/|-]\s*/).filter(Boolean);
        state.lender = parts.shift() || state.lenderProduct;
        state.product = parts.join(" - ");
      }
      if (state.securityPreApproval === "Yes" || checkboxHasValue("securityPreApproval", "Pre-Approval")) {
        state.loans[0] = calculateLoanLvr(normalizeLoan({
          ...(state.loans[0] || blankLoan()),
          preApproval: true,
          approvalRequested: "Pre-Approval"
        }));
        state.securityPreApproval = "";
        syncPrimaryLoanState();
      }
      if (!Array.isArray(state.clients) || !state.clients.length) {
        state.clients = [{ name: "", income: "" }];
      }
      state.clients = state.clients.map((client) => {
        const citizenship = client.citizenship || state.citizenship || "Australian Citizen";
        const visaVevoHeld = Boolean(client.visaVevoHeld || checkboxHasValue("visaVevoHeld", "VISA/VEVO held"));
        return {
          ...client,
          citizenship,
          visaVevoHeld: ["Permanent Resident", "Temporary Resident"].includes(citizenship) ? visaVevoHeld : false
        };
      });
      syncClientRelationships();
      syncPreferredContact();
      if (!Array.isArray(state.liabilities) || !state.liabilities.length) {
        state.liabilities = [blankLiability()];
      }
      state.liabilities = state.liabilities.map((item) => {
        const merged = normalizeLiabilityCurrency({ ...blankLiability(), ...item });
        delete merged.undefined; // Junk key written by older builds; drop it on load.
        return merged;
      });
      state.refinanceLiability = normalizeLiabilityCurrency({
        ...blankLiability(),
        liability: "Loan being refinanced",
        beingRefinanced: true,
        ...(state.refinanceLiability || {})
      });
      currencyFieldIds().forEach((id) => {
        if (state[id]) state[id] = normalizeCurrencyValue(state[id]);
      });
      syncContributionFromDeposits();
      syncSecurityValueFromNestedFields();
      syncLinkedSecurityValue();
      syncPrimaryLoanSecurityValue();
      calculateLvrFields();
      ["baseLvr", "postCapLvr", "interestRate"].forEach((id) => {
        if (state[id]) state[id] = normalizePercent(state[id]);
      });
      ["securityValuation", "landValuation"].forEach((id) => {
        if (state[id] === "Held") state[id] = "In OneDrive";
      });
      if (state.voiMethod === "Audio") state.voiMethod = "";
      ["posDate", "landContractExpectedDate", "buildingContractExpectedDate", "securityContractExpectedDate", "absorbLandContractExpectedDate"].forEach((id) => {
        if (state[id]) state[id] = normalizeMonthValue(state[id]);
      });
      if (state.buildValuation && !["Ordered", "In OneDrive", "To be ordered", "Awaiting HIA", "Other (Free Type)"].includes(state.buildValuation)) {
        state.buildValuation = "";
      }
      if (!Array.isArray(state.otherLenders)) {
        state.otherLenders = [];
      }
      while (state.otherLenders.length < 2) {
        state.otherLenders.push({ lender: "", product: "", reason: "" });
      }
      if (state.clientNotes && !state.notesForTeam && !state.notesForAssessor) {
        state.notesForTeam = state.clientNotes;
      }
    }

    function renderSectionPanel(section) {
      const isMinimized = Boolean(state.minimizedStages?.[section.id]);
      return `
        <section class="section-panel${section.id === "security" && securityNestedMode() ? " has-nested-security" : ""}${isMinimized ? " is-minimized" : ""}" id="section-${section.id}" data-section="${section.id}">
          <div class="section-head">
            <div>
              <div class="section-title-row">
                <h2>${sectionDisplayTitle(section)}</h2>
                ${section.id === "loan" ? `
                  <label class="button" for="fundingPositionUpload" data-icon="upload">Upload Funding Position / Loan Scenario</label>
                  <button class="button" type="button" id="copyFundingFromClipboard" data-icon="copy">Copy from clipboard</button>
                  <input id="fundingPositionUpload" type="file" accept="image/*,application/pdf,.pdf" hidden>
                ` : ""}
                ${section.id === "security" ? `
                  <button class="button" type="button" data-add-security data-icon="plus">Add security</button>
                ` : ""}
              </div>
              <p>${section.note}</p>
            </div>
            <div class="section-head-actions">
              <button class="icon-button stage-toggle${isMinimized ? " is-minimized" : ""}" type="button" data-toggle-stage="${section.id}" aria-label="${isMinimized ? "Expand" : "Minimize"} ${sectionDisplayTitle(section)}" title="${isMinimized ? "Expand" : "Minimize"}" data-icon="chevron-up"></button>
            </div>

    function updateLoanSecurityLinkControls(control) {
      const loanIndex = control.dataset.loanIndex;
      const securityIndex = control.dataset.loanSecurityLink || String(control.dataset.loanSecurityComponentLink || "").split(":")[0];
      if (loanIndex === undefined || !securityIndex) return;
      const main = document.querySelector(`[data-loan-index="${loanIndex}"][data-loan-security-link="${securityIndex}"]`);
      const components = Array.from(document.querySelectorAll(`[data-loan-index="${loanIndex}"][data-loan-security-component-link^="${securityIndex}:"]`));
      if (control.matches("[data-loan-security-link]")) {
        components.forEach((component) => {
          component.checked = control.checked;
        });
        return;
      }
      if (!main) return;
      if (main.checked) {
        main.checked = false;
        components.forEach((component) => {
          component.checked = component === control;
        });
        return;
      }
      if (components.length > 1 && components.every((component) => component.checked)) {
        main.checked = true;
      }
    }

      return sections.some((section) => (section.required || []).includes(id));

                  <label for="liabilityRepayment${index}">Repayment</label>
                  <input id="liabilityRepayment${index}" type="text" data-liability-index="${index}" data-liability-key="repayment" data-currency-field value="${escapeHtml(item.repayment || "")}">
                </div>
                <label class="choice mini-choice">
                  <input type="checkbox" data-liability-index="${index}" data-liability-flag="beingRefinanced"${item.beingRefinanced ? " checked" : ""}>
                  Consolidated in loan
                </label>
                <label class="choice mini-choice">
                  <input type="checkbox" data-liability-index="${index}" data-liability-flag="beingClosed"${item.beingClosed ? " checked" : ""}>
                  Closed before approval
                </label>
                <button class="icon-button danger" type="button" data-remove-liability="${index}" aria-label="Remove liability ${index + 1}" title="Remove liability"${state.liabilities.length === 1 ? " disabled" : ""} data-icon="trash"></button>
              </div>
            `).join("")}
            <div class="repeater-actions">
              <button class="button" type="button" data-add-liability data-icon="plus">Add liability</button>
            </div>
          </div>
        `;
      }

      if (field.type === "securityRepeater") {
        return `
          <div class="security-repeater" data-field="${field.id}">
            ${state.securities.map((security, index) => {
              const linkedLoans = state.loans
                .map((loan, loanIndex) => {
                  const linkedWhole = (loan.securityIds || []).includes(index);
                  const linkedComponent = (loan.securityLinks || []).some((link) => String(link).startsWith(`${index}:`));
                  return linkedWhole || linkedComponent ? `Loan ${loanIndex + 1}` : "";
                })
                .filter(Boolean)
                .join(", ");
              const isEstablished = securityHasType(security, "established");
              const showLand = securityHasType(security, "land");
              const showBuild = securityHasType(security, "construction");
              const showBoarder = security.propertyPurpose === "Owner Occupied";
              const showWeeklyIncome = securityShowsWeeklyIncome(security);
              const showInvestmentExpense = securityShowsInvestmentExpense(security);
              const isPreApprovalFile = securityPreApprovalSelected();
              return `
                <div class="security-card">
                  <div class="security-card-head">
                    <div>
                      <h3>Security ${index + 1}</h3>
                      <div class="security-linked-loans">${linkedLoans ? `Linked to ${linkedLoans}` : "Not linked to a loan yet"}</div>
                    </div>
                    <button class="icon-button danger" type="button" data-remove-security="${index}" aria-label="Remove security ${index + 1}" title="Remove security"${state.securities.length === 1 ? " disabled" : ""} data-icon="trash"></button>
                  </div>
                  <div class="security-type-row">
                    ${[
                      ["established", "Established"],
                      ["landBuild", "Land & Build"],
                      ["landOnly", "Land Only"]
                    ].map(([mode, label]) => `
                      <label class="choice mini-choice">
                        <input type="radio" name="securityMode${index}" data-security-index="${index}" data-security-mode="${mode}" value="${mode}"${securityMode(security) === mode ? " checked" : ""}>
                        ${label}
                      </label>
                    `).join("")}
                  </div>
                  <div class="security-card-grid">
                    <div class="mini-field wide${isPreApprovalFile ? " is-hidden" : ""}">
                      <label for="securityAddress${index}">${requiredLabel("Security Address", isEstablished && !isPreApprovalFile)}</label>
                      <input id="securityAddress${index}" type="text" data-security-index="${index}" data-security-key="address" data-address-search autocomplete="off" placeholder="Search or type address manually" value="${escapeHtml(security.address || "")}">
                      <div class="address-status" data-address-status="securityAddress${index}"></div>
                      <div class="address-suggestions is-hidden" data-address-suggestions="securityAddress${index}"></div>
                    </div>
                    <div class="mini-field${isPreApprovalFile ? " is-hidden" : ""}">
                      <label for="securityValue${index}">${requiredLabel("Estimated Value / Purchase Price", isEstablished && !isPreApprovalFile)}</label>
                      <input id="securityValue${index}" type="text" data-security-index="${index}" data-security-key="value" data-currency-field value="${escapeHtml(security.value || "")}">
                    </div>
                    <div class="mini-field">
                      <label for="securityPropertyPurpose${index}">Property Purpose</label>
                      <div class="property-purpose-controls">
                        <div class="property-purpose-switch" role="radiogroup" aria-labelledby="securityPropertyPurpose${index}">
                          <label>
                            <input type="radio" name="securityPropertyPurpose${index}" data-security-index="${index}" data-security-key="propertyPurpose" value="Owner Occupied"${security.propertyPurpose === "Owner Occupied" ? " checked" : ""}>
                            OO
                          </label>
                          <label>
                            <input type="radio" name="securityPropertyPurpose${index}" data-security-index="${index}" data-security-key="propertyPurpose" value="Investment"${security.propertyPurpose === "Investment" ? " checked" : ""}>
                            INV
                          </label>
                        </div>
                        <label class="choice mini-choice${showBoarder ? "" : " is-hidden"}">
                          <input type="checkbox" data-security-index="${index}" data-security-key="boarder"${security.boarder ? " checked" : ""}>
                          Boarder
                        </label>
                        <label class="choice mini-choice fhog-choice">
                          <input type="checkbox" name="fhogRequired" value="FHOG"${checkboxHasValue("fhogRequired", "FHOG") ? " checked" : ""}>
                          FHOG
                        </label>
                        <input class="inline-detail${checkboxHasValue("fhogRequired", "FHOG") ? "" : " is-hidden"}" id="fhog${index}" type="text" data-fhog-detail placeholder="FHOG details" value="${escapeHtml(state.fhog || "")}">
                      </div>
                    </div>
                    <div class="mini-field">
                      <label for="securityTransactionType${index}">Transaction Type</label>
                      <select id="securityTransactionType${index}" data-security-index="${index}" data-security-key="transactionType">
                        <option value=""></option>
                        ${["Purchasing", "Owns Outright", "Owns with Mortgage"].map((option) => `<option value="${option}"${security.transactionType === option ? " selected" : ""}>${option}</option>`).join("")}
                      </select>
                    </div>
                    <div class="mini-field${isEstablished && !isPreApprovalFile ? "" : " is-hidden"}">
                      <label for="securityValuation${index}">Valuation</label>
                      <select id="securityValuation${index}" data-security-index="${index}" data-security-key="valuation">
                        <option value=""></option>
                        ${valuationOptions(["Not required"]).map((option) => `<option value="${option}"${security.valuation === option ? " selected" : ""}>${option}</option>`).join("")}
                      </select>
                      <input class="valuation-other-input${security.valuation === "Other (Free Type)" ? "" : " is-hidden"}" id="securityValuationOther${index}" type="text" data-security-index="${index}" data-security-key="valuationOther" value="${escapeHtml(security.valuationOther || "")}" placeholder="Valuation details">
                    </div>
                    <div class="security-rental-row full-row${showWeeklyIncome || showInvestmentExpense ? "" : " is-hidden"}">
                      <div class="mini-field compact-money-field${showWeeklyIncome ? "" : " is-hidden"}">
                        <label for="securityWeeklyIncome${index}">Weekly Income</label>
                        <input id="securityWeeklyIncome${index}" type="text" data-security-index="${index}" data-security-key="weeklyIncome" data-currency-field value="${escapeHtml(security.weeklyIncome || "")}">
                      </div>
                      <div class="mini-field compact-money-field${showInvestmentExpense ? "" : " is-hidden"}">
                        <label for="securityInvestmentExpense${index}">Investment Expense</label>
                        <input id="securityInvestmentExpense${index}" type="text" data-security-index="${index}" data-security-key="investmentExpense" data-currency-field value="${escapeHtml(security.investmentExpense || "")}">
                      </div>
                    </div>
                    <div class="mini-field${isEstablished && !isPreApprovalFile ? "" : " is-hidden"}">
                      <label for="securityContract${index}">Contract</label>
                      <select id="securityContract${index}" data-security-index="${index}" data-security-key="contract">
                        <option value=""></option>
                        ${["Signed / Held", "Requested", "Expected", "Property Owned"].map((option) => `<option value="${option}"${security.contract === option ? " selected" : ""}>${option}</option>`).join("")}
                      </select>
                    </div>
                    <div class="mini-field${isEstablished && !isPreApprovalFile && security.contract === "Expected" ? "" : " is-hidden"}">
                      <label for="securityExpectedDate${index}">Expected Contract Date</label>
                      <input id="securityExpectedDate${index}" type="text" list="siteStartSuggestions" data-security-index="${index}" data-security-key="expectedDate" value="${escapeHtml(security.expectedDate || "")}">
                    </div>
                    <div class="mini-field wide${isEstablished && !isPreApprovalFile ? "" : " is-hidden"}">
                      <label for="securityConveyancer${index}">Conveyancer</label>
                      <input id="securityConveyancer${index}" type="text" data-security-index="${index}" data-security-key="conveyancer" value="${escapeHtml(security.conveyancer || "")}">
                    </div>
                  </div>
                  <div class="security-components">
                    ${showLand ? renderSecurityLandComponent(security, index) : ""}
                    ${showBuild ? renderSecurityBuildComponent(security, index) : ""}
                  </div>
                  <div class="mini-field wide${showLand || showBuild ? "" : " is-hidden"}">
                    <label for="securitySettlementTimelines${index}">Settlement Conditions and / or Plan of Subdivision Timelines</label>
                    <textarea id="securitySettlementTimelines${index}" data-security-index="${index}" data-security-key="settlementTimelines">${escapeHtml(security.settlementTimelines || "")}</textarea>
                  </div>
                </div>
              `;
            }).join("")}
            <datalist id="builderOptions">
              ${["Plantation Homes", "Coral Homes", "Orbit Homes", "Glenvill Homes"].map((option) => `<option value="${option}"></option>`).join("")}
            </datalist>
            <datalist id="siteStartSuggestions">
              ${siteStartSuggestions().map((option) => `<option value="${escapeHtml(option)}"></option>`).join("")}
            </datalist>
            <div class="repeater-actions">
              <button class="button" type="button" data-add-security data-icon="plus">Add security</button>
            </div>
          </div>
        `;
      }

      function securityComponentInput(securityIndex, component, key, value, attrs = "") {
        return `data-security-index="${securityIndex}" data-security-component="${component}" data-security-component-key="${key}" ${attrs} value="${escapeHtml(value || "")}"`;
      }

      function renderSecurityLandComponent(security, securityIndex) {
        const land = security.land || blankLandComponent();
        const isAbsorbLand = sectionIsVisible({ showWhen: { type: "absorbLand" } });
        const isFirstLandSecurity = securityIndex === firstSecurityIndexWithType("land");
        return `
          <div class="security-component" id="${isFirstLandSecurity ? (isAbsorbLand ? "section-absorbLand" : "section-land") : ""}" data-section="${isAbsorbLand ? "absorbLand" : "land"}">
            <h4>${isAbsorbLand ? "Land Security" : "Land"}</h4>
            <div class="security-component-grid">
              <div class="mini-field">
                <label for="security${securityIndex}LandEstate">${requiredLabel("Land Estate", !isAbsorbLand && fieldIsRequired("landEstate"))}</label>
                <input id="security${securityIndex}LandEstate" type="text" ${securityComponentInput(securityIndex, "land", "estate", land.estate)}>
              </div>
              <div class="mini-field">
                <label for="security${securityIndex}LandPrice">${requiredLabel(isAbsorbLand ? "Estimated Value / Purchase Price" : "Land Price", fieldIsRequired(isAbsorbLand ? "absorbLandValue" : "landPrice"))}</label>
                <input id="security${securityIndex}LandPrice" type="text" data-currency-field ${securityComponentInput(securityIndex, "land", "price", land.price)}>
              </div>
              <div class="mini-field">
                <label for="security${securityIndex}LandDeposits">Land Deposits Paid</label>
                <input id="security${securityIndex}LandDeposits" type="text" data-currency-field ${securityComponentInput(securityIndex, "land", "depositsPaid", land.depositsPaid)}>
              </div>
              <div class="mini-field${land.depositsPaid ? "" : " is-hidden"}">
                <label for="security${securityIndex}LandDepositReceipt">Land Deposit Receipt</label>
                <select id="security${securityIndex}LandDepositReceipt" data-security-index="${securityIndex}" data-security-component="land" data-security-component-key="depositReceipt">
                  <option value=""></option>
                  ${["Yes", "No", "Requested"].map((option) => `<option value="${option}"${land.depositReceipt === option ? " selected" : ""}>${option}</option>`).join("")}
                </select>
              </div>
              <div class="mini-field">
                <label for="security${securityIndex}LandPosDate">POS Date</label>
                <input id="security${securityIndex}LandPosDate" type="text" list="siteStartSuggestions" ${securityComponentInput(securityIndex, "land", "posDate", land.posDate)}>
              </div>
              <div class="mini-field">
                <label for="security${securityIndex}LandValuation">${requiredLabel("Land Valuation", fieldIsRequired(isAbsorbLand ? "absorbLandValuation" : "landValuation"))}</label>
                <select id="security${securityIndex}LandValuation" data-security-index="${securityIndex}" data-security-component="land" data-security-component-key="valuation">
                  <option value=""></option>
                  ${valuationOptions([isAbsorbLand ? "Not required" : "Awaiting COS"]).map((option) => `<option value="${option}"${land.valuation === option ? " selected" : ""}>${option}</option>`).join("")}
                </select>
                <input class="valuation-other-input${land.valuation === "Other (Free Type)" ? "" : " is-hidden"}" id="security${securityIndex}LandValuationOther" type="text" ${securityComponentInput(securityIndex, "land", "valuationOther", land.valuationOther, `placeholder="Valuation details"`)}>
              </div>
              <div class="mini-field">
                <label for="security${securityIndex}LandContract">${requiredLabel("Land Contract", isAbsorbLand && fieldIsRequired("absorbLandContract"))}</label>
                <select id="security${securityIndex}LandContract" data-security-index="${securityIndex}" data-security-component="land" data-security-component-key="contract">
                  <option value=""></option>
                  ${["Signed / Held", "Requested", "Expected", "Property Owned"].map((option) => `<option value="${option}"${land.contract === option ? " selected" : ""}>${option}</option>`).join("")}
                </select>
              </div>
              <div class="mini-field${land.contract === "Expected" ? "" : " is-hidden"}">
                <label for="security${securityIndex}LandExpectedDate">Expected</label>
                <input id="security${securityIndex}LandExpectedDate" type="text" list="siteStartSuggestions" ${securityComponentInput(securityIndex, "land", "expectedDate", land.expectedDate)}>
              </div>
              <div class="mini-field">
                <label for="security${securityIndex}LandConveyancer">${requiredLabel("Conveyancer", !isAbsorbLand && fieldIsRequired("conveyancer"))}</label>
                <input id="security${securityIndex}LandConveyancer" type="text" ${securityComponentInput(securityIndex, "land", "conveyancer", land.conveyancer)}>
              </div>
              <div class="mini-field field-spacer" aria-hidden="true"></div>
            </div>
          </div>
        `;
      }

      function renderSecurityBuildComponent(security, securityIndex) {
        const build = security.build || blankBuildComponent();
        const isFirstBuildSecurity = securityIndex === firstSecurityIndexWithType("construction");
        return `
          <div class="security-component" id="${isFirstBuildSecurity ? "section-builder" : ""}" data-section="builder">
            <h4>Build</h4>
            <div class="security-component-grid">
              <div class="mini-field">
                <label for="security${securityIndex}BuilderName">${requiredLabel("Builder", fieldIsRequired("builderName"))}</label>
                <input id="security${securityIndex}BuilderName" type="text" list="builderOptions" ${securityComponentInput(securityIndex, "build", "builderName", build.builderName)}>
              </div>
              <div class="mini-field">
                <label for="security${securityIndex}BuildAmount">${requiredLabel("Builder Contract Amount", fieldIsRequired("builderContractAmount"))}</label>
                <input id="security${securityIndex}BuildAmount" type="text" data-currency-field ${securityComponentInput(securityIndex, "build", "contractAmount", build.contractAmount)}>
              </div>
              <div class="mini-field">
                <label for="security${securityIndex}BuildOutOfContractItems">Out of Contract Items</label>
                <input id="security${securityIndex}BuildOutOfContractItems" type="text" data-currency-field ${securityComponentInput(securityIndex, "build", "outOfContractItems", build.outOfContractItems)}>
              </div>
              <div class="mini-field associated-detail${build.outOfContractItems ? "" : " is-placeholder"}" data-out-of-contract-detail-wrap="${securityIndex}">
                <label for="security${securityIndex}BuildOutOfContractDetails">Out of Contract Details</label>
                <input id="security${securityIndex}BuildOutOfContractDetails" type="text" ${securityComponentInput(securityIndex, "build", "outOfContractDetails", build.outOfContractDetails)}>
              </div>
              <div class="mini-field">
                <label for="security${securityIndex}BuildDeposits">Builder Deposits Paid</label>
                <input id="security${securityIndex}BuildDeposits" type="text" data-currency-field ${securityComponentInput(securityIndex, "build", "depositsPaid", build.depositsPaid)}>
              </div>
              <div class="mini-field${build.depositsPaid ? "" : " is-hidden"}">
                <label for="security${securityIndex}BuildDepositReceipt">Build Deposit Receipt</label>
                <select id="security${securityIndex}BuildDepositReceipt" data-security-index="${securityIndex}" data-security-component="build" data-security-component-key="depositReceipt">
                  <option value=""></option>
                  ${["Yes", "No", "Requested"].map((option) => `<option value="${option}"${build.depositReceipt === option ? " selected" : ""}>${option}</option>`).join("")}
                </select>
              </div>
              <div class="mini-field">
                <label for="security${securityIndex}SiteStart">Site Start</label>
                <input id="security${securityIndex}SiteStart" type="text" list="siteStartSuggestions" ${securityComponentInput(securityIndex, "build", "siteStart", build.siteStart)}>
              </div>
              <div class="mini-field">
                <label for="security${securityIndex}BuildValuation">${requiredLabel("Construction Valuation (TBE/TOC)", fieldIsRequired("buildValuation"))}</label>
                <select id="security${securityIndex}BuildValuation" data-security-index="${securityIndex}" data-security-component="build" data-security-component-key="valuation">
                  <option value=""></option>
                  ${valuationOptions(["Awaiting HIA"]).map((option) => `<option value="${option}"${build.valuation === option ? " selected" : ""}>${option}</option>`).join("")}
                </select>
                <input class="valuation-other-input${build.valuation === "Other (Free Type)" ? "" : " is-hidden"}" id="security${securityIndex}BuildValuationOther" type="text" ${securityComponentInput(securityIndex, "build", "valuationOther", build.valuationOther, `placeholder="Valuation details"`)}>
              </div>
              <div class="mini-field">
                <label for="security${securityIndex}BuildContract">${requiredLabel("Building Contract", fieldIsRequired("buildingContract"))}</label>
                <select id="security${securityIndex}BuildContract" data-security-index="${securityIndex}" data-security-component="build" data-security-component-key="contract">
                  <option value=""></option>
                  ${["Signed / Held", "Requested", "Expected"].map((option) => `<option value="${option}"${build.contract === option ? " selected" : ""}>${option}</option>`).join("")}
                </select>
              </div>
              <div class="mini-field${build.contract === "Expected" ? "" : " is-hidden"}">
                <label for="security${securityIndex}BuildExpectedDate">Expected</label>
                <input id="security${securityIndex}BuildExpectedDate" type="text" list="siteStartSuggestions" ${securityComponentInput(securityIndex, "build", "expectedDate", build.expectedDate)}>
              </div>
            </div>
          </div>
        `;
      }

      if (field.type === "otherLenderRepeater") {
        if (checkboxHasValue("otherLendersComparisonCompleted", "Completed in Broker Engine Product Comparison")) return "";
        return `
          <div class="repeater" data-field="${field.id}">
            <div class="repeater-head">
              <h3>${field.label}</h3>
            </div>
            ${state.otherLenders.map((item, index) => `
              <div class="repeat-row compact">
                <div class="mini-field lender-field">
                  <label for="otherLenderName${index}">Lender</label>
                  ${renderLenderInput({
                    id: `otherLenderName${index}`,
                    value: item.lender || "",
                    attrs: `data-other-lender-index="${index}" data-other-lender-key="lender"`
                  })}
                </div>
                <div class="mini-field">
                  <label for="otherLenderProduct${index}">Product / Option</label>
                  <input id="otherLenderProduct${index}" type="text" data-other-lender-index="${index}" data-other-lender-key="product" value="${escapeHtml(item.product || "")}">
                </div>
                <div class="mini-field">
                  <label for="otherLenderReason${index}">Reason / Outcome</label>
                  <input id="otherLenderReason${index}" type="text" data-other-lender-index="${index}" data-other-lender-key="reason" value="${escapeHtml(item.reason || "")}">
                </div>
                <button class="icon-button danger" type="button" data-remove-other-lender="${index}" aria-label="Remove other lender ${index + 1}" title="Remove lender"${state.otherLenders.length <= 2 ? " disabled" : ""} data-icon="trash"></button>
              </div>
            `).join("")}
            <div class="repeater-actions">
              <button class="button" type="button" data-add-other-lender data-icon="plus">Add lender</button>
            </div>
          </div>
        `;
      }

      if (field.type === "fundingPositionPreview") {
        const hasFundingFile = Boolean(state.fundingPositionImage || state.fundingPositionPdf);
        return `
          <div class="funding-preview${hasFundingFile ? "" : " is-hidden"}" data-funding-preview>
            <div class="funding-preview-head">
              <strong>Funding Position / Loan Scenario</strong>
              <button class="button ghost" type="button" data-remove-funding-image data-icon="x">Delete file</button>
            </div>
            ${state.fundingPositionImage ? `<img src="${state.fundingPositionImage}" alt="Uploaded funding position">` : ""}
            ${state.fundingPositionPdf ? `
              <div class="funding-file-card">
                <span>${escapeHtml(state.fundingPositionPdfName || "Uploaded PDF")}</span>
                <a class="button ghost" href="${escapeHtml(state.fundingPositionPdf)}" download="${escapeHtml(state.fundingPositionPdfName || "funding-position.pdf")}" data-icon="download">Download</a>
              </div>
            ` : ""}
          </div>
        `;
      }

      if (field.type === "contributionButton") {
        return `
          <div class="field contribution-field${fieldClass}${full}${columnClass}${compactClass}${conditionalClass}"${conditionalAttrs}>
            <label>${field.label}</label>
            <div class="contribution-control-row">
              <div class="contribution-button-stack">
                <button class="button" type="button" data-toggle-contribution>${state.clientContribution || "Enter contribution"}</button>
                <div class="contribution-summary">
                  ${contributionSummary().map((line) => `<span>${escapeHtml(line)}</span>`).join("")}
                </div>
                <div class="contribution-panel is-hidden" data-contribution-panel>
                  <div class="contribution-panel-head">
                    <strong>Applicant Contribution</strong>
                    <button class="icon-button contribution-close" type="button" data-close-contribution aria-label="Close contribution popup" title="Close" data-icon="x"></button>
                  </div>
                  <label class="choice">
                    <input type="checkbox" id="contributionEquityHeld" data-contribution-field="contributionEquityHeld"${state.contributionEquityHeld ? " checked" : ""}>
                    Equity Held
                  </label>
                  <div class="mini-field">
                    <label for="contributionLandDeposit">Land Deposit Paid</label>
                    <input id="contributionLandDeposit" type="text" data-contribution-field="contributionLandDeposit" data-currency-field value="${escapeHtml(state.contributionLandDeposit || "")}">
                  </div>
                  <div class="mini-field">
                    <label for="contributionBuilderDeposit">Builder Deposit Paid</label>
                    <input id="contributionBuilderDeposit" type="text" data-contribution-field="contributionBuilderDeposit" data-currency-field value="${escapeHtml(state.contributionBuilderDeposit || "")}">
                  </div>
                  <div class="mini-field">
                    <label for="contributionSavingsHeld">Savings Held</label>
                    <input id="contributionSavingsHeld" type="text" data-contribution-field="contributionSavingsHeld" data-currency-field value="${escapeHtml(state.contributionSavingsHeld || "")}">
                  </div>
                  <div class="contribution-total">
                    <span>Contribution</span>
                    <span>${escapeHtml(state.clientContribution || "$0")}</span>
                  </div>
                </div>
              </div>
              <div class="contribution-choice-row">
                <label class="choice">
                  <input type="checkbox" name="genuineSavings" value="Genuine Savings in OneDrive" data-field="genuineSavings"${checkboxHasValue("genuineSavings", "Genuine Savings in OneDrive") ? " checked" : ""}>
                  Genuine Savings in OneDrive
                  <input class="savings-inline-note" id="genuineSavingsNotes" type="text" data-field="genuineSavingsNotes" placeholder="e.g. Rental Ledger" value="${escapeHtml(state.genuineSavingsNotes || "")}">
                </label>
                <label class="choice">
                  <input type="checkbox" name="cashback" value="Cashback" data-field="cashback"${checkboxHasValue("cashback", "Cashback") ? " checked" : ""}>
                  Cashback
                  <input class="savings-inline-note" id="cashbackNotes" type="text" data-field="cashbackNotes" value="${escapeHtml(state.cashbackNotes || "")}">
                </label>
              </div>
            </div>
          </div>
        `;
      }

      if (["genuineSavings", "cashback"].includes(field.id)) {
        return "";
      }

      if (field.type === "lenderProductPair") {
        return `
          <div class="field full${conditionalClass}"${conditionalAttrs}>
            <div class="inline-pair lender-product-pair">
              <div class="mini-field lender-field">
                <label for="lender">Lender</label>
                ${renderLenderInput({ id: "lender", value: state.lender || "", attrs: `data-field="lender"` })}
              </div>
              <div class="mini-field">
                <label for="product">Product</label>
                <input id="product" type="text" data-field="product" value="${escapeHtml(state.product || "")}">

      }

      if (field.type === "textarea") {
        return `
          <div class="field${fieldClass}${full}${columnClass}${compactClass}${conditionalClass}"${conditionalAttrs}>
            <label for="${field.id}">${fieldLabel(field)}</label>
            <textarea id="${field.id}" data-field="${field.id}">${escapeHtml(state[field.id] || "")}</textarea>
          </div>
        `;
      }

      if (field.type === "inlineText") {
        return "";
      }

      if (field.type === "hiddenCheckbox") {
        return "";
      }

      if (field.type === "radio" || field.type === "checkbox") {
        const inputType = field.type;
        const options = field.options || [];
        const legend = field.label ? `
          ${field.downloadSettlementTerms ? `
            <legend class="legend-row">
              <span>${fieldLabel(field)}</span>
              <button class="icon-button" type="button" data-download-settlement-terms aria-label="Download Settlement Conditions form" title="Download Settlement Conditions form" data-icon="download"></button>

        const otherInput = field.other ? `
          <label class="choice">
            <input type="${inputType}" name="${field.id}" value="${escapeHtml(field.other)}" data-field="${field.id}"${isChecked(field, field.other)}>

        const otherDetail = field.other ? `
          <div class="field full conditional-field" data-other-detail="${field.id}" data-conditional-source="${field.id}" data-conditional-value="${field.other}">

        return `
          <fieldset class="field${fieldClass}${full}${columnClass}${compactClass}${conditionalClass}"${conditionalAttrs}>

              ${options.map((option) => {
                const inlineDetail = field.inlineDetails?.[option];

                const hasInlineDetail = Boolean(inlineDetail);
                return `
                  <label class="choice${hasInlineExpected || hasInlineDetail ? " inline-choice" : ""}">
                    <input type="${inputType}" name="${field.id}" value="${escapeHtml(option)}" data-field="${field.id}"${isChecked(field, option)}>
                    ${choiceLabel(option)}
                    ${hasInlineExpected ? `
                      <input class="inline-expected-date" type="${field.expectedDateInputType || "date"}" id="${field.expectedDateField}" data-field="${field.expectedDateField}" value="${escapeHtml(state[field.expectedDateField] || "")}" aria-label="${escapeHtml(field.label)} expected date">

                    ${hasInlineDetail ? `
                      ${inlineDetail.type === "checkbox" ? `
                        <span class="inline-detail-check">
                          <input type="checkbox" id="${inlineDetail.id}" data-field="${inlineDetail.id}"${state[inlineDetail.id] === "Yes" ? " checked" : ""}>
                          ${escapeHtml(inlineDetail.label)}

                        <input class="inline-detail-input" type="text" id="${inlineDetail.id}" data-field="${inlineDetail.id}"${inlineDetail.format === "currency" ? " data-currency-field" : ""}${inlineDetail.format === "percent" ? " data-percent-field" : ""} value="${escapeHtml(state[inlineDetail.id] || "")}" placeholder="" aria-label="${escapeHtml(inlineDetail.label)}">
                      `}
                    ` : ""}
                  </label>
                `;
              }).join("")}
              ${field.preApprovalToggle ? `
                <label class="choice">
                  <input id="${field.preApprovalToggle}" type="checkbox" data-field="${field.preApprovalToggle}"${securityPreApprovalSelected() ? " checked" : ""}>
                  Pre-Approval
                </label>
              ` : ""}
              ${otherInput}
            </div>
            ${otherDetail}
          </fieldset>
        `;
      }

      if (field.type === "select") {
        return `
          <div class="field${fieldClass}${full}${columnClass}${compactClass}${conditionalClass}"${conditionalAttrs}>
            <div class="field-label-row">
              <label for="${field.id}">${fieldLabel(field)}</label>
              ${field.preApprovalToggle ? `
                <label class="choice mini-toggle">
                  <input id="${field.preApprovalToggle}" type="checkbox" data-field="${field.preApprovalToggle}"${securityPreApprovalSelected() ? " checked" : ""}>
                  Pre-Approval
                </label>
              ` : ""}
            </div>
            <select id="${field.id}" data-field="${field.id}">
              <option value=""></option>
              ${(field.options || []).map((option) => `
                <option value="${escapeHtml(option)}"${state[field.id] === option ? " selected" : ""}>${option}</option>
              `).join("")}
            </select>
          </div>
        `;
      }

      if (field.type === "clientSelect") {
        return `
          <div class="field${fieldClass}${full}${columnClass}${compactClass}${conditionalClass}"${conditionalAttrs}>
            <label for="${field.id}">${fieldLabel(field)}</label>
            <select id="${field.id}" data-field="${field.id}" data-client-select>

          </div>
        `;

      if (field.type === "addressSearch") {
        return `
          <div class="field${fieldClass}${full}${columnClass}${compactClass}${conditionalClass}${field.preApprovalToggle ? " security-address-field" : ""}${securityPreApprovalSelected() && field.preApprovalToggle ? " is-preapproval" : ""}"${conditionalAttrs}>
            <div class="field-label-row">
              <label for="${field.id}">${fieldLabel(field)}</label>

                <label class="choice mini-toggle">
                  <input id="${field.preApprovalToggle}" type="checkbox" data-field="${field.preApprovalToggle}"${securityPreApprovalSelected() ? " checked" : ""}>

            <input class="security-address-control" id="${field.id}" type="text" data-field="${field.id}" data-address-search autocomplete="off" placeholder="Search or type address manually" value="${escapeHtml(state[field.id] || "")}">

            <label for="${field.id}">${field.label}</label>

      if (field.type === "date") {
        return `
          <div class="field${fieldClass}${full}${columnClass}${compactClass}${conditionalClass}"${conditionalAttrs}>

          <div class="field${fieldClass}${full}${columnClass}${compactClass}${conditionalClass}"${conditionalAttrs}>

      }

      return `
        <div class="field${fieldClass}${full}${columnClass}${compactClass}${conditionalClass}"${conditionalAttrs}>

          <input id="${field.id}" type="text" data-field="${field.id}"${field.format === "currency" ? " data-currency-field" : ""}${field.format === "percent" ? " data-percent-field" : ""}${field.readonly ? " readonly" : ""}${field.suggestions ? ` list="${field.id}Suggestions"` : ""} value="${escapeHtml(state[field.id] || "")}">

    function renderLoanStructure(field) {
      return `

    function renderLoanSecurityLinkOptions(loan, loanIndex) {
      return state.securities.map((security, securityIndex) => {
        const wholeSelected = (loan.securityIds || []).includes(securityIndex);
        const landSelected = (loan.securityLinks || []).includes(`${securityIndex}:land`);
        const buildSelected = (loan.securityLinks || []).includes(`${securityIndex}:build`);
        const showLand = securityHasType(security, "land");
        const showBuild = securityHasType(security, "construction");
        const cardSelected = wholeSelected || landSelected || buildSelected;
        const amountSuffix = (value) => {
          const formatted = normalizeCurrencyValue(value);
          return formatted ? ` - ${escapeHtml(formatted)}` : "";
        };
        const componentTotal = securityComponentTotal(security);
        const wholeValue = amountSuffix(security.value || (componentTotal ? String(componentTotal) : ""));
        const landValue = amountSuffix(security.land?.price);
        const buildValue = amountSuffix(String(securityComponentValue(security, "build") || ""));
        return `
          <div class="security-link-card${cardSelected ? " is-selected" : ""}">
            <label class="choice mini-choice security-link-main">
              <input type="checkbox" data-loan-index="${loanIndex}" data-loan-security-link="${securityIndex}"${wholeSelected ? " checked" : ""}>
              <span>${escapeHtml(securityLabel(securityIndex))}${wholeValue}</span>
            </label>
            ${showLand || showBuild ? `
              <div class="security-link-components">
                ${showLand ? `
                  <label class="choice mini-choice security-link-component">
                    <input type="checkbox" data-loan-index="${loanIndex}" data-loan-security-component-link="${securityIndex}:land"${wholeSelected || landSelected ? " checked" : ""}>
                    <span>Land${landValue}</span>
                  </label>

                ${showBuild ? `
                  <label class="choice mini-choice security-link-component">
                    <input type="checkbox" data-loan-index="${loanIndex}" data-loan-security-component-link="${securityIndex}:build"${wholeSelected || buildSelected ? " checked" : ""}>
                    <span>Build${buildValue}</span>
                  </label>
                ` : ""}
              </div>
            ` : ""}
          </div>
        `;
      }).join("");
    }

    function loanFieldRequiredLabel(label, key, loan = {}) {
      return requiredLabel(label, loanFieldIsRequired(key, loan));
    }

    function splitFieldRequiredLabel(label, key) {
      return requiredLabel(label, splitFieldIsRequired(key));
    }

    function loanFieldIsRequired(key, loan = {}) {
      if (["pricingNotes"].includes(key)) return false;
      if (["postCapLvr", "lmi"].includes(key)) return loanLmiApplies(loan);
      if (key === "approvalSubjectTo") return loan.approvalRequested === "Conditional";
      return [
        "purpose",
        "lender",
        "product",
        "loanAmount",
        "loanSecurityValue",
        "baseLvr",
        "pricingStatus",
        "approvalRequested"
      ].includes(key);
    }

    function splitFieldIsRequired(key) {
      return ["amount", "loanUse", "product", "term", "interestRate"].includes(key);
    }

                </div>
                <div class="mini-field loan-summary-cell">

                <div class="mini-field">

    function renderSplitRow(split, loanIndex, splitIndex) {
      return `
        <div class="split-row">
          <div class="mini-field">
            <label for="loan${loanIndex}Split${splitIndex}Amount">${splitFieldRequiredLabel(`Split ${splitIndex + 1} Amount`, "amount")}</label>
            <input id="loan${loanIndex}Split${splitIndex}Amount" type="text" data-loan-index="${loanIndex}" data-split-index="${splitIndex}" data-split-key="amount" data-currency-field value="${escapeHtml(split.amount || "")}">

    function isChecked(field, option) {
      const value = state[field.id];
      if (field.type === "checkbox") {
        return Array.isArray(value) && value.includes(option) ? " checked" : "";
      }
      return value === option ? " checked" : "";
    }

    function collectAndUpdate(eventOrSave) {
      const shouldSave = typeof eventOrSave === "boolean" ? eventOrSave : true;
      const sourceEvent = eventOrSave && typeof eventOrSave === "object" ? eventOrSave : null;
      const sourceActiveId = sourceEvent?.target?.id || sourceEvent?.currentTarget?.id || "";
      const sourceEventType = sourceEvent?.type || "";
      clearMissingIndicators();
      collectRepeaters(sourceActiveId, sourceEventType);
      sections.forEach((section) => {
        state[`include:${section.id}`] = true;
      });

      sections.flatMap((section) => section.fields).forEach((field) => {
        if (field.type === "lenderProductPair") {
          state.lender = document.getElementById("lender")?.value.trim() || "";
          state.product = document.getElementById("product")?.value.trim() || "";
          return;
        }
        if (["clientRepeater", "purposeRepeater", "incomeRepeater", "liabilityRepeater", "securityRepeater", "otherLenderRepeater", "loanStructureRepeater", "fundingPositionPreview", "contributionButton"].includes(field.type)) return;
        if (field.type === "radio") {
          const selected = document.querySelector(`input[name="${field.id}"]:checked`);
          state[field.id] = selected ? selected.value : "";
        } else if (field.type === "checkbox") {
          state[field.id] = Array.from(document.querySelectorAll(`input[name="${field.id}"]:checked`)).map((input) => input.value);
        } else if (field.type === "hiddenCheckbox") {
          state[field.id] = document.getElementById(field.id)?.checked ? "Yes" : "";
        } else {
          const control = document.getElementById(field.id);
          state[field.id] = control ? control.value.trim() : "";
        }
        if (field.id === "interestRate") {
          state.interestRate = normalizePercent(state.interestRate);
        }
        if (field.format === "percent") {
          state[field.id] = normalizePercent(state[field.id]);
        }
        if (field.format === "currency") {
          state[field.id] = normalizeCurrencyValue(state[field.id]);
        }
        if (field.type === "month" || field.format === "month") {
          state[field.id] = normalizeMonthValue(state[field.id]);
        }

        if (field.other) {
          const other = document.getElementById(`${field.id}Other`);
          state[`${field.id}Other`] = other ? other.value.trim() : "";
        }
      });
      const fhogInputs = Array.from(document.querySelectorAll('input[name="fhogRequired"]'));
      if (fhogInputs.length) {
        state.fhogRequired = fhogInputs.some((input) => input.checked) ? ["FHOG"] : [];
        state.fhog = document.querySelector("[data-fhog-detail]")?.value.trim() || "";
      }
      syncContributionFromDeposits();
      syncSecurityValueFromNestedFields();
      syncLoanSecurityValuesFromLinks();
      syncLinkedSecurityValue();
      syncPrimaryLoanSecurityValue();
      calculateLvrFields();

      const noteText = buildNotes();
      noteOutput.dataset.plainText = noteText;
      schedulePrintDocument(noteText);
      updateConditionalVisibility();
      updateSectionVisibility();
      updateFundingPositionVisibility();
      updateSecurityPreApprovalVisibility();
      updateContributionDisplay();
      syncLoanCardCalculatedFields();
      syncLenderMarks();
      updateProgress();
      updateMissing();
      if (shouldSave) saveDraft();

    function collectRepeaters(activeIdOverride = "", activeEventType = "") {

        const nextClients = [];
        clientInputs.forEach((input) => {
          const index = Number(input.dataset.clientIndex);
          const key = input.dataset.clientKey;
          nextClients[index] = nextClients[index] || { ...(state.clients?.[index] || {}) };

        Array.from(document.querySelectorAll("[data-client-income-index]")).forEach((input) => {
          const index = Number(input.dataset.clientIncomeIndex);

          nextClients[index].income = plainTextFromIncomeHtml(incomeHtml);

        syncClientRelationships();
        const preferredInput = document.querySelector('input[name="preferredContactApplicant"]:checked');

      const purposeInputs = Array.from(document.querySelectorAll("[data-purpose-index]"));

        purposeInputs.forEach((input) => {
          nextPurposes[Number(input.dataset.purposeIndex)] = normalizePurpose(input.value);
